<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #141210; --brass: #a8843c; --cream: #f7f2e8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e4da; font-family: "Inter", -apple-system, sans-serif; color: var(--ink); }
    .toolbar { display: flex; justify-content: center; gap: 10px; padding: 16px; }
    .toolbar button, .toolbar a { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 10px; border: 1px solid #c9c2b5; background: #fff; cursor: pointer; color: var(--ink); text-decoration: none; }
    .toolbar button.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .page { width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: var(--cream); padding: 22mm 18mm; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.15); border: 6px double var(--brass); outline: 1px solid var(--brass); outline-offset: -12px; }
    .logo { width: 34mm; height: 34mm; border-radius: 50%; object-fit: cover; border: 1px solid #d5cbb7; margin-bottom: 8mm; }
    .logo--mono { display: grid; place-items: center; font-family: "Playfair Display", serif; font-size: 16mm; font-weight: 600; color: var(--brass); background: #fff; }
    .eyebrow { font-size: 10pt; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
    h1 { font-family: "Playfair Display", serif; font-size: 30pt; margin: 3mm 0 1mm; line-height: 1.1; }
    .sub { font-size: 12pt; color: #5b5648; }
    .rule { display: flex; align-items: center; gap: 10px; width: 60%; margin: 8mm 0; }
    .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: #cfc5ae; }
    .rule span { width: 6px; height: 6px; transform: rotate(45deg); background: var(--brass); }
    h2 { font-family: "Playfair Display", serif; font-size: 22pt; margin: 0 0 2mm; font-weight: 500; }
    .how { font-size: 11.5pt; color: #5b5648; max-width: 120mm; line-height: 1.5; }
    .qr { width: 95mm; height: 95mm; margin: 8mm 0 6mm; padding: 5mm; background: #fff; border: 1px solid #d5cbb7; border-radius: 8px; }
    .qr img { width: 100%; height: 100%; display: block; }
    .url { font-family: ui-monospace, Menlo, monospace; font-size: 11pt; color: #3a362e; }
    .foot { margin-top: auto; font-size: 9pt; color: #8a8375; letter-spacing: .08em; text-transform: uppercase; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page { margin: 0; box-shadow: none; width: auto; min-height: auto; height: 100vh; page-break-after: avoid; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" onclick="window.print()">Print</button>
    <a id="png" download>Download QR (PNG)</a>
    <a id="back">Back to dashboard</a>
  </div>
  <div class="page" id="page"></div>
  <script src="/static/js/common.js"></script>
  <script>
    (function () {
      const L = window.Lineup;
      const slug = L.slugFromPath();
      document.getElementById('png').href = `/q/${slug}/qr.png`;
      document.getElementById('back').href = `/b/${slug}`;
      L.api('GET', `/api/q/${slug}`).then((s) => {
        const b = s.barber;
        document.title = `${b.shop_name} — Poster`;
        const logo = b.brand_image ? `<img class="logo" src="${L.esc(b.brand_image)}" alt="">` : `<div class="logo logo--mono">${L.esc(L.initials(b.shop_name))}</div>`;
        document.getElementById('page').innerHTML = `
          ${logo}
          <p class="eyebrow">Walk-ups welcome</p>
          <h1>${L.esc(b.shop_name)}</h1>
          <p class="sub">${L.esc(b.barber_name)}${b.tagline ? ` · ${L.esc(b.tagline)}` : ''}</p>
          <div class="rule"><span></span></div>
          <h2>Scan to join the line</h2>
          <p class="how">Point your camera at the code. You'll get a spot in line and an expected time, and your phone will let you know when it's your turn.</p>
          <div class="qr"><img src="/q/${L.esc(slug)}/qr.svg" alt="QR code"></div>
          <p class="url">${L.esc(location.host)}/q/${L.esc(slug)}</p>
          <p class="foot">Powered by Lineup</p>`;
      }).catch((e) => { document.getElementById('page').textContent = e.message; });
    })();
  </script>
</body>
</html>
