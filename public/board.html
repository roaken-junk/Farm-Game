<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131211">
  <title>Now serving</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <style>
    .board { max-width: 1200px; margin: 0 auto; padding: 32px; min-height: 100dvh; display: grid; grid-template-columns: 1fr; gap: 28px; position: relative; z-index: 1; }
    @media (min-width: 900px) { .board { grid-template-columns: 1.4fr 1fr; align-items: start; padding: 48px; } }
    .board .brand { flex-direction: row; text-align: left; gap: 18px; padding: 0 0 12px; }
    .board .brand__logo { width: 72px; height: 72px; }
    .board h1 { font-size: 32px; }
    .serving-name { font-family: var(--display); font-size: clamp(40px, 7vw, 84px); line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; margin: 10px 0 4px; word-break: break-word; }
    .next-list .list-row { min-height: 72px; }
    .next-list .list-row__name { font-size: 20px; }
    .next-list .list-row__time { font-size: 24px; }
    .board .qr-box { padding: 24px; }
    .board .qr-box img { max-width: 320px; }
    .clock { font-family: var(--display); font-size: 22px; color: var(--cream-2); }
  </style>
</head>
<body>
  <div class="board" id="board"><div class="skeleton"></div></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/board.js"></script>
</body>
</html>
