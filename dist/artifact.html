  r.innerHTML =
    `<div class="row"><div class="ic">💎</div><div class="body"><b>One gem per rung cleared</b>
       <small>All four rungs in a single run pays 💎 4.</small></div></div>
     <div class="row"><div class="ic">🏆</div><div class="body"><b>+1 for a new personal best</b>
       <small>Beating your own score always pays, however small the run.</small></div></div>
     <div class="row"><div class="ic">🪙</div><div class="body"><b>Coins scale with your level</b>

     <div class="row"><div class="ic">🌙</div><div class="body"><b>${D.ARCADE_DAILY_GEMS} gems a day</b>
       <small>The gem limit resets at midnight, wherever you are.</small></div></div>`;
  rules.appendChild(r);
  frag.appendChild(rules);
  return frag;
}

/** The cabinet's own card: what it is, how it plays, what each rung pays. */
function arcadeSheet(game) {
  openSheet((sheet, close) => {
    const best = G.arcadeBest(game.id);
    sheet.appendChild(el('div', 'sheet-hero',
      `<span class="hero-ic">${game.cab}</span>
       <div><h2>${game.icon} ${game.name}</h2>
       <p class="sub">${game.tag} · best ${fmt(best)}</p></div>`));
    sheet.appendChild(el('div', 'note', game.blurb));
    sheet.appendChild(el('div', 'fld-label', 'Controls'));
    sheet.appendChild(el('div', 'note', game.how));

    sheet.appendChild(el('div', 'fld-label', 'Gem rungs'));
    game.gemAt.forEach((at, i) => {
      sheet.appendChild(row({
        icon: '💎',
        title: `${fmt(at)} points`,
        sub: best >= at ? 'Cleared before — still pays every run' : 'Not reached yet',
        chips: [{ text: `Gem ${i + 1} of ${game.gemAt.length}`, cls: best >= at ? 'done' : '' }],
        locked: best < at,
      }));
    });

    const go = el('button', 'btn btn-big btn-green', '▶ Play');
    go.style.marginTop = '12px';
    go.onclick = () => { close(); Arcade.open(game.id, () => render()); };
    sheet.appendChild(go);
  });
}

      <small>${locked ? `🔒 Unlocks at level ${b.level}` : b.desc}</small></div>`;
    const btn = el('button', 'btn btn-sm ' + (left ? 'btn-green' : 'btn-gold'),
      left ? `⏳ ${fmtTime(left)}` : cost);
    btn.disabled = locked || (b.gems ? S.gems < b.gems : S.coins < b.coins);
    btn.onclick = () => { haptic(); G.buyBoost(b.id); render(); };
    row.appendChild(btn);
    boosts.appendChild(row);
  }
  frag.appendChild(boosts);

  /* feed */
  const feed = panel(`<em>🌾</em>Feed`);
  feed.appendChild(troughPanel());
  frag.appendChild(feed);

  /* land */
  const land = panel(`<em>🚜</em>Land`);
  if (S.plots.length >= D.MAX_PLOTS) {
    land.appendChild(el('div', 'muted', '🏆 You own every field on Sunny Acres.'));
  } else {
    const owned = S.plots.length;
    const cost = D.plotCost(owned), lv = D.plotLevel(owned);
    land.appendChild(buyRow('🚧', `Field ${owned + 1}`,
      `${owned} of ${D.MAX_PLOTS} fields cleared`, cost, S.level < lv ? lv : 0,
      () => { G.buyPlot(); render(); }));
  }
  frag.appendChild(land);

  /* storage */
  const store = panel(`<em>📦</em>Storage`);
  store.appendChild(buyRow('🛖', `Silo +${D.SILO_STEP}`,
    `Holds ${S.siloCap} crops now`, D.siloUpgradeCost(S.siloCap), 0,
    () => { G.upgradeSilo(); render(); }));
  store.appendChild(buyRow('🏠', `Barn +${D.BARN_STEP}`,
    `Holds ${S.barnCap} goods now`, D.barnUpgradeCost(S.barnCap), 0,
    () => { G.upgradeBarn(); render(); }));
  frag.appendChild(store);

  /* upgrades */
  const up = panel(`<em>⭐</em>Farm Upgrades`);
  up.appendChild(el('div', 'muted', 'Permanent boosts. Each one takes work off your hands for good.'));
  for (const u of D.UPGRADES) {
    if (S.upgrades[u.id]) {
      const r = el('div', 'row');
      r.innerHTML = `<div class="ic">${u.icon}</div><div class="body"><b>${u.name}</b><small>${u.desc}</small></div>
        <span class="chip done">✔ Owned</span>`;
      up.appendChild(r);
    } else {
      up.appendChild(buyRow(u.icon, u.name, u.desc, u.cost, S.level < u.level ? u.level : 0,
        () => { G.buyUpgrade(u.id); render(); }));
    }
  }
  frag.appendChild(up);
  return frag;
}

function buyRow(icon, name, desc, cost, needLevel, onBuy) {

/** Market drift, as a chip class and a signed percentage. */
function trendClass(f) { return f >= 1.06 ? 'done' : f <= 0.94 ? 'miss' : ''; }
function trendLabel(f) {
  const pct = Math.round((f - 1) * 100);
  return `${pct > 0 ? '▲+' : pct < 0 ? '▼' : '='}${pct === 0 ? '' : pct + '%'}`;
}

function openSheet(build) {
  const root = $('sheet-root');
  const back = el('div', 'backdrop');
  const sheet = el('div', 'sheet');

  const grip = el('div', 'sheet-grip');
  grip.innerHTML = '<span class="sheet-grab"></span>';
  const x = el('button', 'sheet-x', '✕');
  x.setAttribute('aria-label', 'Close');
  grip.appendChild(x);
  sheet.appendChild(grip);

  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    sheet.classList.add('closing');
    back.classList.add('closing');
    setTimeout(() => back.remove(), 180);
  };
  x.onclick = () => { haptic(); close(); };

  build(sheet, close);
  back.appendChild(sheet);
  back.onclick = e => { if (e.target === back) close(); };
  root.appendChild(back);
  makeSheetDraggable(sheet, close);
  return close;
}

/**
 * Drag the sheet down to dismiss it, the way the grab handle implies.
 * The drag only starts when the sheet's own scroller is already at the top,
 * so scrolling a long list still works normally.
 */
function makeSheetDraggable(sheet, close) {
  let startY = 0, dy = 0, dragging = false, startedAt = 0;

  const onDown = e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (sheet.scrollTop > 0) return;
    // Let controls handle their own taps; only bare surface starts a drag.
    if (e.target.closest('button, input, textarea, a')) return;
    dragging = true;
    startY = e.clientY;
    dy = 0;
    startedAt = Date.now();
    sheet.style.transition = 'none';
  };

  const onMove = e => {
    if (!dragging) return;
    dy = e.clientY - startY;
    if (dy < 0) dy = dy * 0.25;          // slight resistance upward
    sheet.style.transform = `translateY(${dy}px)`;
    if (dy > 4 && e.cancelable) e.preventDefault();
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    const flicked = dy > 40 && Date.now() - startedAt < 300;
    if (dy > 110 || flicked) close();
  };

  sheet.addEventListener('pointerdown', onDown);
  sheet.addEventListener('pointermove', onMove, { passive: false });
  sheet.addEventListener('pointerup', onUp);
  sheet.addEventListener('pointercancel', onUp);
  sheet.addEventListener('pointerleave', onUp);
}

function sellSheet(kind) {
  const S = St.S;
  openSheet((sheet, close) => {
    const isSilo = kind === 'silo';
    sheet.appendChild(el('h2', null, isSilo ? '🛖 Sell Crops' : '🏠 Sell Goods'));
    sheet.appendChild(el('p', 'sub',
      'Tap to sell. Prices swing through the day — ▲ means better than usual.'));

    const list = el('div');
    const build = () => {
      list.innerHTML = '';
      const stock = isSilo ? S.silo : S.barn;
      const ids = Object.keys(stock).filter(id => stock[id] > 0);
      if (!ids.length) {
        list.appendChild(el('div', 'muted center', 'Nothing in here yet.'));
        return;
      }
      ids.sort((a, b) => D.ITEMS[a].price - D.ITEMS[b].price);
      for (const id of ids) {
        const it = D.ITEMS[id];
        const n = stock[id];
        const f = G.marketFactor(id);
        const one = el('button', 'btn btn-sm btn-gold', 'Sell 1');
        const all = el('button', 'btn btn-sm btn-green', `All 🪙${fmt(G.sellPrice(id) * n)}`);

        const doSell = (btn, qty) => {
          const got = G.sell(id, qty);
          FX.floatFrom(btn, '+' + fmt(got) + ' 🪙');
          build();
          refresh();
        };
        one.onclick = () => { haptic(); doSell(one, 1); };
        all.onclick = () => {
          haptic();
          if (St.S.settings.confirmSell && n > 1) {
            confirmSheet(`Sell all ${n} ${it.name}?`,
              `That's 🪙 ${fmt(G.sellPrice(id) * n)} at today's price.`, () => doSell(all, n));
          } else doSell(all, n);
        };

        const trail = el('div', 'row-actions');
        trail.append(one, all);
        list.appendChild(row({
          icon: it.icon,
          title: `${it.name} × ${n}`,
          sub: `🪙 ${fmt(G.sellPrice(id))} each <span class="trend ${trendClass(f)}">${trendLabel(f)}</span>`,
          trail,
          onIcon: () => itemSheet(id),
        }));
      }
    };
    build();
    sheet.appendChild(list);

    const done = el('button', 'btn btn-big btn-blue', 'Done');
    done.style.marginTop = '10px';
    done.onclick = () => { close(); render(); };
    sheet.appendChild(done);
  });
}

/** Everything the game knows about one item, in one place. */
function itemSheet(id) {
  const it = D.ITEMS[id];
  if (!it) return;
  openSheet((sheet, close) => {
    const f = G.marketFactor(id);
    sheet.appendChild(el('div', 'sheet-hero',
      `<span class="hero-ic">${it.icon}</span>
       <div><h2>${it.name}</h2>
       <p class="sub">${it.kind === 'crop' ? 'Crop · kept in the silo' : 'Good · kept in the barn'}</p></div>`));

    const facts = el('div', 'factgrid');
    const add = (k, v, cls) => facts.appendChild(el('div', 'fact ' + (cls || ''),
      `<small>${k}</small><b>${v}</b>`));

    add('You have', fmt(St.count(id)));
    add('Sells for', '🪙 ' + fmt(G.sellPrice(id)));
    add('Base value', '🪙 ' + fmt(it.price));
    add('Market now', trendLabel(f), trendClass(f) === 'done' ? 'fact-up'
      : trendClass(f) === 'miss' ? 'fact-down' : '');
    add('Gives', '⭐ ' + it.xp + ' XP');
    if (it.level) add('Unlocks at', 'Level ' + it.level);
    sheet.appendChild(facts);

    /* where it comes from */
    const crop = D.CROPS.find(c => c.id === id);
    const fromAnimal = D.ANIMALS.find(a => a.product === id);
    const madeBy = D.RECIPES.find(r => r.out === id);
    let source = null;
    if (crop) {
      source = `Grows in ${fmtTime(G.growSeconds(crop))} from a 🪙${crop.seed} seed, ` +
               `${D.CROP_YIELD} per field.`;
    } else if (fromAnimal) {
      source = `${fromAnimal.name}s make one every ${fmtTime(fromAnimal.cycle)} ` +
               `for ${fromAnimal.feed} feed.`;
    } else if (madeBy) {
      const m = D.MACHINES.find(x => x.id === madeBy.machine);
      const ing = Object.entries(madeBy.in)
        .map(([k, q]) => `${D.ITEMS[k].icon} ${q}`).join(' + ');
      source = `${m.name} turns ${ing} into this in ${fmtTime(G.craftTime(madeBy))}.`;
    }
    if (source) {
      sheet.appendChild(el('div', 'fld-label', 'Where it comes from'));
      sheet.appendChild(el('div', 'note', source));
    }

    /* what it's used for */
    const usedIn = D.RECIPES.filter(r => r.in[id]);
    if (usedIn.length) {
      sheet.appendChild(el('div', 'fld-label', 'Used to make'));
      const chips = el('div', 'chips');
      for (const r of usedIn) {
        const b = el('button', 'chip chip-link',
          `${D.ITEMS[r.out].icon} ${D.ITEMS[r.out].name} ×${r.in[id]}`);
        b.onclick = () => { haptic(); itemSheet(r.out); };
        chips.appendChild(b);
      }
      sheet.appendChild(chips);
    }

    const done = el('button', 'btn btn-big btn-blue', 'Got it');
    done.style.marginTop = '12px';
    done.onclick = close;
    sheet.appendChild(done);
  });
}

/** Where your farm lives, how safe it is, and every way to copy it. */
function backupSheet() {
  openSheet(async (sheet, close) => {
    sheet.appendChild(el('h2', null, '🛟 Backup & Safety'));
    sheet.appendChild(el('p', 'sub', 'Where this farm is stored, and how to keep it.'));

    /* --- how safe are we right now --- */
    const status = el('div');
    sheet.appendChild(status);
    const paint = async () => {
      const r = await Store.report();
      status.innerHTML = '';
      const safe = r.installed || r.persisted;
      status.appendChild(row({
        icon: safe ? '🛡️' : '⚠️',
        title: safe ? 'Your farm is protected' : 'Your farm is only in this browser',
        sub: safe
          ? 'This browser has marked the game as permanent, so it will not be cleared automatically.'
          : 'Safari clears data for sites you have not opened in a while. Add the game to your ' +
            'Home Screen, or keep a backup file, and that stops being a risk.',
        tone: safe ? 'good' : 'warn',
      }));
      status.appendChild(row({
        icon: '💾',
        title: 'Saved in two places on this device',
        sub: `Browser storage${r.mirrored ? ' and a database mirror' : ''}. ` +
             `The last few snapshots are kept, so a bad write can be undone.`,
      }));
      if (!r.installed) {
        status.appendChild(row({
          icon: '📲',
          title: 'Add to Home Screen',
          sub: 'In Safari tap Share, then Add to Home Screen. Installed games are exempt from ' +
               'the automatic clear-out — this is the single best thing you can do.',
        }));
      }
    };
    await paint();

    /* --- the file that nothing can evict --- */
    sheet.appendChild(el('div', 'fld-label', 'Backup file'));
    sheet.appendChild(el('div', 'note',
      'Saves all three farms to a file. Keep it in Files, iCloud Drive or email it to yourself — ' +
      'nothing on the phone can delete that copy.'));

    const dl = el('button', 'btn btn-big btn-green', '⬇️ Download backup file');
    dl.style.marginTop = '8px';
    dl.onclick = () => {
      haptic();
      const stamp = new Date().toISOString().slice(0, 10);
      Store.downloadBackup(St.exportAll(), `sunny-acres-${stamp}.json`);
      toast('Backup saved', '💾');
    };
    sheet.appendChild(dl);

    const picker = el('input');
    picker.type = 'file';
    picker.accept = 'application/json,.json';
    picker.style.display = 'none';
    picker.onchange = async () => {
      const f = picker.files && picker.files[0];
      if (!f) return;
      try {
        const payload = await Store.readBackupFile(f);
        const n = St.importAll(payload);
        toast(`Restored ${n} farm${n > 1 ? 's' : ''}`, '✅');
        setTimeout(() => location.reload(), 700);
      } catch (err) {
        SFX.error();
        toast(err.message, '⚠️', true);
      }
    };
    const up = el('button', 'btn btn-big', '⬆️ Restore from a backup file');
    up.style.marginTop = '8px';
    up.onclick = () => { haptic(); picker.click(); };
    sheet.append(picker, up);

    /* --- code transfer --- */
    sheet.appendChild(el('div', 'fld-label', 'Move one farm'));
    const xfer = el('button', 'btn btn-big', '📤 Copy this farm as a code');
    xfer.onclick = () => transferSheet();
    sheet.appendChild(xfer);

    /* --- cloud --- */
    sheet.appendChild(el('div', 'fld-label', 'Sign in to sync'));
    sheet.appendChild(cloudSection());

    const done = el('button', 'btn btn-big btn-blue', 'Done');
    done.style.marginTop = '12px';
    done.onclick = close;
    sheet.appendChild(done);
  });
}

/** The login block — real when cloud.js is configured, explanatory when not. */
function cloudSection() {
  const wrap = el('div');

  if (!Cloud.configured()) {
    wrap.appendChild(el('div', 'note',
      'Signing in with Google, Apple or Facebook needs a server to hold the saves and to keep ' +
      'the login secrets, which a page like this cannot do on its own. The code for it ships ' +
      'with the game — see "Cloud saves" in the README to switch it on. Until then the backup ' +
      'file above is the way to move a farm between devices.'));
    const dead = el('div', 'provider-row');
    for (const p of Cloud.PROVIDERS) {
      dead.appendChild(el('span', 'provider off', `${p.icon} ${p.name}`));
    }
    wrap.appendChild(dead);
    return wrap;
  }

  const acct = Cloud.account();
  if (acct) {
    wrap.appendChild(row({
      icon: '☁️',
      title: 'Signed in',
      sub: acct.email || 'Your farms sync to this account.',
      trail: costBtn('Sign out', { tone: 'red', onTap: () => { Cloud.signOut(); backupSheet(); } }),
    }));
    const syncBtn = el('button', 'btn btn-big btn-green', '🔄 Sync now');
    syncBtn.onclick = async () => {
      haptic();
      syncBtn.disabled = true;
      syncBtn.textContent = 'Syncing…';
      try {
        const { notes } = await Cloud.sync(St.exportAll().slots);
        toast(`Synced · ${notes.pulled} down, ${notes.pushed} up`, '☁️');
        setTimeout(() => location.reload(), 700);
      } catch (err) {
        SFX.error();
        toast(err.message, '⚠️', true);
        syncBtn.disabled = false;
        syncBtn.textContent = '🔄 Sync now';
      }
    };
    wrap.appendChild(syncBtn);
    return wrap;
  }

  wrap.appendChild(el('div', 'note',
    'Sign in and your farms are copied to your account. Log in on any device to pick them up.'));
  const rowEl = el('div', 'provider-row');
  for (const p of Cloud.PROVIDERS) {
    const b = el('button', 'provider', `${p.icon} ${p.name}`);
    b.onclick = () => { haptic(); Cloud.signIn(p.id); };
    rowEl.appendChild(b);
  }
  wrap.appendChild(rowEl);
  return wrap;
}

/** A farm's whole save as a code you can paste on another phone. */
function transferSheet() {
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, '📤 Move your farm'));
    sheet.appendChild(el('p', 'sub',
      'Copy this code, then paste it into Load From Code on the other device. Your farm here is left alone.'));

    const box = el('textarea', 'fld code-box');
    box.readOnly = true;
    box.value = St.exportCode();
    box.onclick = () => box.select();
    sheet.appendChild(box);

    const copy = el('button', 'btn btn-big btn-green', '📋 Copy code');
    copy.style.marginTop = '10px';
    copy.onclick = async () => {
      haptic();
      box.select();
      try {
        await navigator.clipboard.writeText(box.value);
        toast('Code copied', '📋');
      } catch {
        // Clipboard is blocked in some in-app browsers; the selection still works.
        toast('Press and hold the code to copy', '📋');
      }
    };
    sheet.appendChild(copy);

    const done = el('button', 'btn btn-big btn-blue', 'Done');
    done.style.marginTop = '8px';
    done.onclick = close;
    sheet.appendChild(done);
  });
}

function confirmSheet(title, body, onYes) {
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, title));
    sheet.appendChild(el('p', 'sub', body));
    const yes = el('button', 'btn btn-big btn-red', 'Yes, do it');
    yes.onclick = () => { close(); onYes(); };
    const no = el('button', 'btn btn-big', 'Cancel');
    no.style.marginTop = '8px';
    no.onclick = close;
    sheet.append(yes, no);
  });
}

/* ------------------------------- feedback -------------------------------- */

function toast(msg, icon, bad) {
  const t = el('div', 'toast' + (bad ? ' bad' : ''), `${icon ? icon + ' ' : ''}${msg}`);
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2300);
}

function floatText(e, text) {
  const f = el('div', 'float', text);
  const x = e && e.clientX ? e.clientX : innerWidth / 2;
  const y = e && e.clientY ? e.clientY : innerHeight / 2;
  f.style.left = x + 'px';
  f.style.top = y + 'px';
  f.style.transform = 'translate(-50%, 0)';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

/** What the player just earned the right to do. */
function unlocksAt(level) {
  const out = [];
  for (const c of D.CROPS) if (c.level === level) out.push(`${c.icon} ${c.name}`);
  for (const a of D.ANIMALS) if (a.level === level) out.push(`${a.icon} ${a.name}`);
  for (const m of D.MACHINES) if (m.level === level) out.push(`${m.icon} ${m.name}`);
  for (const r of D.RECIPES) if (r.level === level && !D.MACHINES.some(m => m.level === level && m.id === r.machine)) {
    out.push(`${D.ITEMS[r.out].icon} ${D.ITEMS[r.out].name}`);
  }
  for (const u of D.UPGRADES) if (u.level === level) out.push(`${u.icon} ${u.name}`);
  const owned = St.S.plots.length;
  if (owned < D.MAX_PLOTS && D.plotLevel(owned) === level) out.push('🚧 New field');
  return out;
}

/**
 * Levels come fast early on, and a single order can carry you through two or
 * three at once. Splashes queue rather than stack, so each level still gets
 * its own moment and its own list of unlocks.
 */
const pendingLevels = [];

function levelUpSplash(level) {
  if (document.querySelector('.levelup')) { pendingLevels.push(level); return; }
  showLevelUp(level);
}

function showLevelUp(level) {
  SFX.levelUp();
  FX.confetti(90);
  setTimeout(() => FX.confetti(50, innerWidth * 0.25, innerHeight * 0.28), 220);
  setTimeout(() => FX.confetti(50, innerWidth * 0.75, innerHeight * 0.28), 400);
  const wrap = el('div', 'levelup');
  const card = el('div', 'card');
  const unlocks = unlocksAt(level);
  const newTitle = D.titleFor(level) !== D.titleFor(level - 1);
  card.innerHTML = `<div class="big">🎉</div><h2>Level ${level}!</h2>
    <p>${newTitle ? `You are now a ${D.titleFor(level)} · ` : ''}+🪙${fmt(level * 120)} · +💎${level % 5 === 0 ? 3 : 1}</p>
    ${unlocks.length ? `<div class="unlock-list">${unlocks.map(u => `<span class="chip">${u}</span>`).join('')}</div>` : ''}`;
  const dismiss = () => {
    wrap.remove();
    const nextLevel = pendingLevels.shift();
    if (nextLevel != null) showLevelUp(nextLevel);
    else render();
  };
  const b = el('button', 'btn btn-big btn-green', pendingLevels.length ? 'Next!' : 'Nice!');
  b.onclick = dismiss;
  card.appendChild(b);
  wrap.appendChild(card);
  wrap.onclick = e => { if (e.target === wrap) dismiss(); };
  document.body.appendChild(wrap);
}

function welcomeBack(info) {
  if (info.away < 120) return;
  const bits = [];
  if (info.ripe) bits.push(`${info.ripe} field${info.ripe > 1 ? 's' : ''} ripened`);
  if (info.ready) bits.push(`${info.ready} animal${info.ready > 1 ? 's' : ''} produced`);
  if (info.crafts) bits.push(`${info.crafts} craft${info.crafts > 1 ? 's' : ''} finished`);
  if (!bits.length) return;
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, '👋 Welcome back!'));
    sheet.appendChild(el('p', 'sub', `You were away for ${fmtSpan(info.away)}.`));
    const list = el('div');
    for (const b of bits) {
      const r = el('div', 'row');
      r.innerHTML = `<div class="ic">✅</div><div class="body"><b>${b}</b></div>`;
      list.appendChild(r);
    }
    sheet.appendChild(list);
    const go = el('button', 'btn btn-big btn-green', 'Back to the farm');
    go.style.marginTop = '10px';
    go.onclick = close;
    sheet.appendChild(go);
  });
}
return { setView, render, refresh, troughPanel, openSheet, itemSheet, machineSheet, settingsSheet, backupSheet, toast, levelUpSplash, welcomeBack, get view() { return view; } };
})();

/* ---------- js/main.js ---------- */
const __mod_main = (function () {
const D = __mod_data;
const St = __mod_state;
const G = __mod_game;
const UI = __mod_ui;
const FX = __mod_fx;
const Store = __mod_store;
const Cloud = __mod_cloud;
const {setSound, unlockAudio, SFX} = __mod_audio;
const {el, fmt, setHaptics} = __mod_util;
/* ==========================================================================
   main.js — the title screen, onboarding, and the once-a-second heartbeat.
   ========================================================================== */











const $ = id => document.getElementById(id);

/* ------------------------------ title screen ----------------------------- */

/** "3 days ago" style, for the save list. */
function ago(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs > 1 ? 's' : ''} ago`;
  const days = Math.floor(hrs / 24);
  return `${days} day${days > 1 ? 's' : ''} ago`;
}

function showTitle() {
  const screen = $('title');
  screen.hidden = false;
  $('onboard').hidden = true;
  $('app').hidden = true;

  const list = $('slots');
  list.innerHTML = '';

  for (const s of St.slotSummaries()) {
    const card = el('button', 'slot-card' + (s.empty ? ' empty' : ''));
    card.type = 'button';
    card.innerHTML = s.empty
      ? `<span class="face">＋</span><span class="who"><b>New Farm</b>
         <small>Save ${s.i + 1} · empty</small></span>`
      : `<span class="face">${s.avatar}</span><span class="who"><b>${s.name}</b>
         <small>Level ${s.level} · 🪙 ${fmt(s.coins)} · played ${ago(s.played)}</small></span>`;
    card.onclick = () => {
      unlockAudio();
      if (s.empty) showOnboarding(s.i);
      else if (St.load(s.i)) boot();
    };
    list.appendChild(card);

    if (!s.empty) {
      const del = el('button', 'slot-del', '🗑️');
      del.type = 'button';
      del.title = `Delete save ${s.i + 1}`;
      del.onclick = e => {
        e.stopPropagation();
        if (confirm(`Delete ${s.name}'s farm? This cannot be undone.`)) {
          St.deleteSlot(s.i);
          showTitle();
        }
      };
      card.appendChild(del);
    }
  }

  // A quiet line about durability, shown once there is something to lose.
  const note = $('title-note');
  if (note) {
    const anyFarm = St.slotSummaries().some(x => !x.empty);
    note.hidden = !anyFarm || Store.isInstalled();
    note.textContent = 'Tip: add Sunny Acres to your Home Screen, or keep a backup file, ' +
                       'so your farm is never cleared. Both are under Backup & Safety.';
  }

  $('load-code').onclick = () => {
    const code = prompt('Paste the farm code from your other device:');
    if (!code) return;
    const target = St.slotSummaries().find(s => s.empty);
    if (!target) { alert('All three saves are full. Delete one first.'); return; }
    const err = St.importCode(code, target.i);
    if (err) alert(err);
    else boot();
  };
}

/* ------------------------------ onboarding ------------------------------- */

function showOnboarding(slot) {
  const ob = $('onboard');
  $('title').hidden = true;
  ob.hidden = false;
  let avatar = D.AVATARS[0];

  const grid = $('ob-avatars');
  grid.innerHTML = '';
  D.AVATARS.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'av' + (i === 0 ? ' on' : '');
    b.type = 'button';
    b.textContent = a;
    b.onclick = () => {
      avatar = a;
      [...grid.children].forEach(c => c.classList.toggle('on', c === b));
    };
    grid.appendChild(b);
  });

  $('ob-start').onclick = () => {
    unlockAudio();
    const name = ($('ob-name').value || '').trim().slice(0, 14) || 'Farmer';
    St.startNew(name, avatar, slot);
    boot();
  };
}

/* --------------------------------- boot ---------------------------------- */

let started = false;

/** Push the saved preferences into the systems that act on them. */
function applySettings() {
  const st = St.S.settings;
  setSound(st.sound !== false);
  setHaptics(st.haptics !== false);
  FX.setMotion(st.motion !== false);
  document.body.classList.toggle('big-text', !!st.bigText);
}

function boot() {
  const S = St.S;
  applySettings();
  $('title').hidden = true;
  $('onboard').hidden = true;
  $('app').hidden = false;

  if (!started) {
    started = true;
    FX.bindTapFeedback();
    G.on('toast', t => UI.toast(t.msg, t.icon, t.bad));
    G.on('levelup', lv => UI.levelUpSplash(lv));
    G.on('celebrate', e => {
      FX.confetti(e && e.big ? 120 : 60);
      if (e && e.big) setTimeout(() => FX.confetti(80), 260);
    });

    // Heartbeat: advance the world, then repaint the cheap bits.
    setInterval(() => {
      G.tick();
      UI.refresh();
    }, 1000);

    // Timers are all timestamp-based, so a backgrounded tab catches up instantly.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) St.save();
      else { G.tick(); UI.render(); }
    });
    window.addEventListener('pagehide', St.save);
    window.addEventListener('blur', St.save);

    // iOS only starts audio inside a user gesture.
    document.addEventListener('pointerdown', unlockAudio, { once: true });

    // Kill the pull-to-refresh / rubber-band bounce on the game surface.
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  }

  const info = G.settleOffline();
  UI.setView('farm');
  UI.welcomeBack(info);
}

/* --------------------------------- start --------------------------------- */

/**
 * Before anything reads a save: pick up an OAuth redirect if there is one,
 * restore any slot that localStorage lost from the IndexedDB mirror, and ask
 * the browser to stop evicting us.
 */
async function start() {
  Cloud.captureRedirect();

  let restored = [];
  try {
    restored = await Store.hydrate(St.allSlotKeys());
  } catch { /* storage unavailable — carry on with whatever is there */ }

  Store.requestPersistence();
  showTitle();

  if (restored.length) {
    setTimeout(() => alert(
      'Your farm was restored from this device\'s backup copy — the browser had cleared its ' +
      'main storage. Open Backup & Safety to keep a file copy so this cannot bite you.'), 400);
  }
}

start();
return {  };
})();
