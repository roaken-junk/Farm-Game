/* ==========================================================================
   Sunny Acres — the handheld the game lives in.
   The screen is a 160x144 canvas; everything here is the plastic around it,
   in the grey-beige and burgundy of the original hardware.
   ========================================================================== */

:root {
  --shell: #cbc6b8;
  --shell-dk: #b3ae9f;
  --shell-lt: #ded9cb;
  --bezel: #58604f;
  --bezel-dk: #3f4639;
  --screen-off: #9bbc0f;
  --btn: #8e2f5a;
  --btn-dk: #6b2143;
  --dpad: #2f2f38;
  --dpad-dk: #1b1b22;
  --ink: #4a4a45;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  background: #6f6a5e;
}

body {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--ink);
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}

button { font: inherit; color: inherit; border: 0; background: none; }

/* -------------------------------- device --------------------------------- */

.device {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  height: 100vh;
  height: 100dvh;
  max-width: 460px;
  margin: 0 auto;
  padding: calc(var(--sat) + 8px) 12px calc(var(--sab) + 8px);
  gap: 8px;
  background: linear-gradient(160deg, var(--shell-lt), var(--shell) 30%, var(--shell-dk));
}

/* screen ---------------------------------------------------------------- */

.bezel {
  width: 100%;
  background: linear-gradient(160deg, var(--bezel), var(--bezel-dk));
  /* the one asymmetric curve that makes it read as a Game Boy */
  border-radius: 10px 10px 44px 10px;
  padding: 14px 16px 20px;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, .45), 0 2px 0 rgba(255, 255, 255, .35);
  flex-shrink: 0;
}

.bezel-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  font-size: 7px;
  letter-spacing: .14em;
  color: #b9c0ae;
}
.bezel-label::before,
.bezel-label::after {
  content: '';
  flex: 1;
  height: 3px;
  border-top: 1px solid #7d3f6a;
  border-bottom: 1px solid #2f3fa0;
}
.bezel-label span { white-space: nowrap; }

#screen {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 160 / 144;
  background: var(--screen-off);
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 2px;
}

.brand {
  align-self: flex-start;
  margin: 2px 0 0 4px;
  font-size: 13px;
  font-weight: 700;
  font-style: italic;
  letter-spacing: .02em;
  color: #3a3f6b;
  flex-shrink: 0;
}
.brand span {
  font-size: 8px;
  font-style: normal;
  letter-spacing: .18em;
  margin-left: 5px;
  color: var(--ink);
}

/* controls -------------------------------------------------------------- */

.pads {
  flex: 1;
  width: 100%;
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
}

.dpad {
  position: relative;
  width: 132px;
  height: 132px;
  flex-shrink: 0;
}

.d {
  position: absolute;
  width: 44px;
  height: 46px;
  background: linear-gradient(180deg, #3c3c48, var(--dpad));
  box-shadow: 0 3px 0 var(--dpad-dk);
  transition: transform .05s, box-shadow .05s;
}
.d::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 0; height: 0;
  border: 7px solid transparent;
  transform: translate(-50%, -50%);
}
.up    { left: 44px; top: 0;    border-radius: 8px 8px 0 0; }
.down  { left: 44px; top: 86px; border-radius: 0 0 8px 8px; }
.left  { left: 0;    top: 43px; border-radius: 8px 0 0 8px; }
.right { left: 88px; top: 43px; border-radius: 0 8px 8px 0; }

.up::after    { border-bottom-color: #8b8b99; margin-top: -4px; }
.down::after  { border-top-color: #8b8b99;    margin-top: 4px; }
.left::after  { border-right-color: #8b8b99;  margin-left: -4px; }
.right::after { border-left-color: #8b8b99;   margin-left: 4px; }

.d-hub {
  position: absolute;
  left: 44px; top: 43px;
  width: 44px; height: 46px;
  background: var(--dpad);
  pointer-events: none;
}
.d-hub::after {
  content: '';
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #4a4a58, #26262e);
}

.d.on { transform: translateY(3px); box-shadow: 0 0 0 var(--dpad-dk); }

.ab {
  display: flex;
  align-items: center;
  gap: 16px;
  transform: rotate(-20deg);
  padding-right: 4px;
}

.rb {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: linear-gradient(180deg, #a8447190, #8e2f5a);
  background: linear-gradient(180deg, #a84471, var(--btn));
  box-shadow: 0 4px 0 var(--btn-dk);
  color: #f0dfe8;
  font-size: 17px;
  font-weight: 700;
  transition: transform .05s, box-shadow .05s;
}
.rb.on { transform: translateY(4px); box-shadow: 0 0 0 var(--btn-dk); }

.startrow {
  display: flex;
  justify-content: center;
  width: 100%;
  flex-shrink: 0;
  padding-bottom: 4px;
}

.pill {
  transform: rotate(-20deg);
  padding: 7px 20px;
  border-radius: 999px;
  background: linear-gradient(180deg, #8f8a7d, #6f6a5e);
  box-shadow: 0 3px 0 #4f4b42;
  color: #e6e2d6;
  font-size: 10px;
  letter-spacing: .16em;
  transition: transform .05s, box-shadow .05s;
}
.pill.on { transform: rotate(-20deg) translateY(3px); box-shadow: 0 0 0 #4f4b42; }

/* Short screens: shrink the controls before the screen gives up any size. */
@media (max-height: 700px) {
  .dpad { width: 108px; height: 108px; }
  .d { width: 36px; height: 38px; }
  .up, .down { left: 36px; }
  .down { top: 70px; }
  .left, .right { top: 35px; }
  .right { left: 72px; }
  .d-hub { left: 36px; top: 35px; width: 36px; height: 38px; }
  .rb { width: 52px; height: 52px; font-size: 15px; }
  .pads { min-height: 120px; }
}

/* ------------------------------ onboarding ------------------------------- */

.onboard {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  padding-top: calc(var(--sat) + 16px);
  background: linear-gradient(160deg, var(--shell-lt), var(--shell-dk));
  overflow-y: auto;
}

.ob-screen {
  width: 100%;
  max-width: 360px;
  background: var(--screen-off);
  border: 12px solid var(--bezel);
  border-radius: 8px 8px 34px 8px;
  padding: 18px 16px 20px;
  text-align: center;
  color: #0f380f;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, .3);

.ob-logo {
  font-size: 24px;

  letter-spacing: .1em;
  text-shadow: 2px 2px 0 #8bac0f;
}
.ob-sub {
  margin: 4px 0 18px;
  font-size: 10px;
  letter-spacing: .1em;
  color: #306230;
}

.ob-label {
  display: block;
  text-align: left;
  font-size: 10px;
  letter-spacing: .14em;
  margin: 12px 2px 5px;
  color: #306230;

.ob-field {
  width: 100%;
  border: 3px solid #0f380f;
  border-radius: 0;
  padding: 10px;
  background: #9bbc0f;
  color: #0f380f;
  font-family: inherit;
  font-size: 16px;          /* keeps iOS from zooming the field */
  letter-spacing: .12em;
  text-transform: uppercase;

.ob-field::placeholder { color: #6d8a2a; }

.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.av {
  aspect-ratio: 1;
  border: 3px solid #306230;
  background: #8bac0f;
  font-size: 24px;
  display: grid;
  place-items: center;

.ob-start {
  width: 100%;

/* Small shared helpers. */

const now = () => Date.now();

function clamp(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));
}

/** 1,234,567 -> "1.23M" so the HUD never overflows on a narrow phone. */
function fmt(n) {
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString('en-US');
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
}

/** Countdown text: 1h 04m / 4m 30s / 12s */
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return `${m}m ${String(s).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

/** Same units, but wordier — used for offline summaries. */
function fmtSpan(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h) return `${h} hour${h > 1 ? 's' : ''} ${m} min`;
  if (m) return `${m} minute${m > 1 ? 's' : ''}`;
  return `${sec} seconds`;
}

function el(tag, className, html) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (html != null) n.innerHTML = html;
  return n;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function randInt(a, b) {
  return a + Math.floor(Math.random() * (b - a + 1));
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

/** A short buzz on supported hardware. iOS ignores it; harmless there. */
function haptic(ms = 12) {
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch { /* ignore */ }
  }
}
return { clamp, fmt, fmtTime, fmtSpan, el, pick, randInt, uid, haptic, now };
})();

  if (owned >= D.MAX_PLOTS) { S.dialog('EVERY FIELD ON THE FARM IS YOURS.'); return; }
  const cost = D.plotCost(owned), lv = D.plotLevel(owned);
  if (St.S.level < lv) { S.dialog(`THIS PATCH IS OVERGROWN. CLEAR IT AT LEVEL ${lv}.`); return; }
  S.confirm(`CLEAR THIS FIELD FOR ${fmt(cost)} COINS?`, () => G.buyPlot());
}

/* --------------------------------- pens ---------------------------------- */

function penTile(type, slot) {
  const kind = D.ANIMALS.find(a => a.id === type);
  const mine = St.animalsOf(type);

  if (slot < mine.length) {
    const an = mine[slot];
    const st = G.animalState(an);
    if (st === 'ready') {
      if (G.collectAnimal(an)) S.flash(`GOT ${D.ITEMS[kind.product].name}`);
      return;
    }
    if (st === 'hungry') {
      if (St.count('feed') < kind.feed) {
        S.dialog(`THE ${kind.name} IS HUNGRY. IT NEEDS ${kind.feed} FEED - MILL SOME AT WORKS.`);
        return;
      }
      G.feedAnimal(an);
      S.flash(`FED THE ${kind.name}`);
      return;
    }
    const left = (an.readyAt - Date.now()) / 1000;
    S.confirm(`${kind.name} IS BUSY FOR ${fmtTime(left)}. RUSH FOR ${D.speedUpCost(left)} GEMS?`,
      () => { if (G.speedUpAnimal(an)) S.flash('READY!'); });
    return;
  }

  if (kind.level > St.S.level) { S.dialog(`${kind.name}S ARRIVE AT LEVEL ${kind.level}.`); return; }
  if (mine.length >= kind.max) { S.dialog('THIS PEN IS FULL.'); return; }
  S.confirm(`BUY A ${kind.name} FOR ${fmt(kind.cost)} COINS?`, () => G.buyAnimal(type));
}

/* ------------------------------- selling --------------------------------- */

function sellList(title, isCrop) {
  const build = () => Object.keys(isCrop ? St.S.silo : St.S.barn)
    .filter(id => St.count(id) > 0)
    .sort((a, b) => D.ITEMS[a].price - D.ITEMS[b].price)
    .map(id => ({
      label: D.ITEMS[id].name, icon: D.ITEMS[id].icon,
      right: 'x' + St.count(id), value: id,
      detail: `${price(id)} EACH. ALL ${St.count(id)} FETCH $${fmt(G.sellPrice(id) * St.count(id))}.`,
    }));

  S.menu({
    title, items: build(),
    onPick(item) {
      const id = item.value;
      S.menu({
        title: D.ITEMS[id].name.toUpperCase(),
        items: [
          { label: 'SELL 1', right: price(id), value: 1 },
          { label: 'SELL 10', right: '$' + fmt(G.sellPrice(id) * Math.min(10, St.count(id))), value: 10 },
          { label: 'SELL ALL', right: '$' + fmt(G.sellPrice(id) * St.count(id)), value: 1e9 },
          { label: 'BACK', value: 0 },
        ],
        onPick(sub) {
          S.pop();
          if (sub.value) {
            const got = G.sell(id, sub.value);
            S.flash(`SOLD FOR $${fmt(got)}`);
          }
          S.refreshMenu(build());
        },
      });
    },
  });
}

const siloMenu = () => sellList('SILO', true);
const barnMenu = () => sellList('BARN', false);

/* ------------------------------ workshops -------------------------------- */

function worksMenu() {
  const build = () => D.MACHINES.map(m => {
    const own = St.S.machines[m.id] && St.S.machines[m.id].owned;
    const ready = own ? St.S.machines[m.id].queue.filter(G.jobReady).length : 0;
    const locked = m.level > St.S.level;
    return {
      label: m.name, icon: m.icon, value: m.id,
      right: !own ? (locked ? 'LV' + m.level : '$' + fmt(m.cost)) : ready ? `!${ready}` : '',
      disabled: locked,
      disabledWhy: `NEEDS LEVEL ${m.level}`,
      detail: !own
        ? (locked ? `UNLOCKS AT LEVEL ${m.level}.` : `BUILD FOR ${fmt(m.cost)} COINS.`)
        : `MAKES ${D.recipesFor(m.id).map(r => D.ITEMS[r.out].name).join(', ')}.`,
      owned: own,
    };
  });

  S.menu({
    title: 'WORKSHOPS', items: build(),
    onPick(item) {
      if (!item.owned) {
        const m = D.MACHINES.find(x => x.id === item.value);
        S.confirm(`BUILD THE ${m.name} FOR ${fmt(m.cost)} COINS?`, () => {
          G.buyMachine(m.id);
          S.refreshMenu(build());
        });
        return;
      }
      machineMenu(item.value, () => S.refreshMenu(build()));
    },
  });
}

function machineMenu(id, onBack) {
  const m = D.MACHINES.find(x => x.id === id);

  const build = () => {
    const q = St.S.machines[id].queue;
    const rows = [];
    for (const job of q) {
      const r = D.RECIPES.find(x => x.id === job.recipe);
      const done = G.jobReady(job);
      rows.push({
        label: done ? 'TAKE ' + D.ITEMS[r.out].name : D.ITEMS[r.out].name,
        icon: D.ITEMS[r.out].icon,
        right: done ? 'DONE' : fmtTime((job.end - Date.now()) / 1000),
        job, detail: done ? 'READY TO COLLECT.' : 'STILL COOKING. PICK IT TO RUSH WITH GEMS.',
      });
    }
    for (const r of D.recipesFor(id)) {
      const locked = r.level > St.S.level;
      const need = Object.entries(r.in)
        .map(([k, v]) => `${St.count(k)}/${v} ${D.ITEMS[k].name}`).join(', ');
      rows.push({
        label: 'MAKE ' + D.ITEMS[r.out].name, icon: D.ITEMS[r.out].icon,
        right: locked ? 'LV' + r.level : fmtTime(G.craftTime(r)),
        recipe: r,
        disabled: locked || !St.hasAll(r.in) || St.S.machines[id].queue.length >= St.queueCap(),
        disabledWhy: locked ? `NEEDS LEVEL ${r.level}`
          : St.S.machines[id].queue.length >= St.queueCap() ? 'QUEUE IS FULL' : 'MISSING INGREDIENTS',
        detail: locked ? `UNLOCKS AT LEVEL ${r.level}.` : `NEEDS ${need}. SELLS ${price(r.out)}.`,
      });
    }
    return rows;
  };

  S.menu({
    title: m.name, items: build(), onCancel: onBack,
    onPick(item) {
      if (item.job) {
        if (G.jobReady(item.job)) {
          G.collectJob(id, item.job.jid);
          S.flash('COLLECTED');
        } else {
          const left = (item.job.end - Date.now()) / 1000;
          S.confirm(`RUSH FOR ${D.speedUpCost(left)} GEMS?`, () => {
            G.speedUpJob(id, item.job.jid);
            S.refreshMenu(build());
          });
          return;
        }
      } else if (item.recipe) {
        if (G.enqueue(id, item.recipe.id)) S.flash('STARTED');
      }
      S.refreshMenu(build());
    },
  });
}

/* -------------------------------- orders --------------------------------- */

function ordersMenu() {
  const build = () => St.S.orders.map((o, i) => {
    if (!o || !o.oid) {
      return { label: 'WAITING...', right: fmtTime(Math.max(0, ((o && o.wait) || 0 - Date.now()) / 1000)),
        disabled: true, disabledWhy: 'NO ORDER YET', detail: 'A NEW CUSTOMER IS ON THE WAY.' };
    }
    const need = Object.entries(o.items)
      .map(([id, q]) => `${St.count(id)}/${q} ${D.ITEMS[id].name}`).join(', ');
    const first = Object.keys(o.items)[0];
    return {
      label: 'ORDER ' + (i + 1), icon: D.ITEMS[first].icon,
      right: '$' + fmt(o.coins), order: o,
      disabled: !G.canDeliver(o), disabledWhy: 'YOU ARE SHORT ON GOODS',
      detail: `WANTS ${need}. PAYS $${fmt(o.coins)} AND ${o.xp} XP${o.gems ? ` AND ${o.gems} GEMS` : ''}.`,
    };
  });

  S.menu({
    title: 'ORDER BOARD', items: build(),
    onPick(item) {
      if (!item.order) return;
      G.deliverOrder(item.order.oid);
      S.refreshMenu(build());
    },
  });
}

/* --------------------------------- store --------------------------------- */

function storeMenu() {
  const build = () => {
    const S_ = St.S;
    const rows = [];
    if (S_.plots.length < D.MAX_PLOTS) {
      const cost = D.plotCost(S_.plots.length), lv = D.plotLevel(S_.plots.length);
      rows.push({
        label: 'NEW FIELD', icon: '🚜', right: '$' + fmt(cost), kind: 'plot',
        disabled: S_.level < lv || S_.coins < cost,
        disabledWhy: S_.level < lv ? `NEEDS LEVEL ${lv}` : 'NOT ENOUGH COINS',
        detail: `CLEARS FIELD ${S_.plots.length + 1} OF ${D.MAX_PLOTS}.`,
      });
    }
    rows.push({
      label: 'BIGGER SILO', icon: '🛖', right: '$' + fmt(D.siloUpgradeCost(S_.siloCap)), kind: 'silo',
      disabled: S_.coins < D.siloUpgradeCost(S_.siloCap), disabledWhy: 'NOT ENOUGH COINS',
      detail: `HOLDS ${S_.siloCap} CROPS. ADDS ${D.SILO_STEP} MORE.`,
    });
    rows.push({
      label: 'BIGGER BARN', icon: '🏠', right: '$' + fmt(D.barnUpgradeCost(S_.barnCap)), kind: 'barn',
      disabled: S_.coins < D.barnUpgradeCost(S_.barnCap), disabledWhy: 'NOT ENOUGH COINS',
      detail: `HOLDS ${S_.barnCap} GOODS. ADDS ${D.BARN_STEP} MORE.`,
    });
    for (const u of D.UPGRADES) {
      const owned = !!S_.upgrades[u.id];
      rows.push({
        label: u.name, icon: u.icon, kind: 'up', up: u.id,
        right: owned ? 'OWNED' : S_.level < u.level ? 'LV' + u.level : '$' + fmt(u.cost),
        disabled: owned || S_.level < u.level || S_.coins < u.cost,
        disabledWhy: owned ? 'ALREADY YOURS' : S_.level < u.level ? `NEEDS LEVEL ${u.level}` : 'NOT ENOUGH COINS',
        detail: u.desc.toUpperCase(),
      });
    }
    return rows;
  };

  S.menu({
    title: 'FARM STORE', items: build(),
    onPick(item) {
      const done = () => S.refreshMenu(build());
      if (item.kind === 'plot') S.confirm('CLEAR A NEW FIELD?', () => { G.buyPlot(); done(); });
      else if (item.kind === 'silo') { G.upgradeSilo(); done(); }
      else if (item.kind === 'barn') { G.upgradeBarn(); done(); }
      else if (item.kind === 'up') {
        const u = D.UPGRADES.find(x => x.id === item.up);
        S.confirm(`BUY ${u.name} FOR ${fmt(u.cost)} COINS?`, () => { G.buyUpgrade(u.id); done(); });
      }
    },
  });
}

/* ------------------------------- farmhouse ------------------------------- */

function homeMenu() {
  const s = St.S.stats;
  S.menu({
    title: St.S.name.toUpperCase(), items: [
      { label: 'LEVEL ' + St.S.level, right: D.titleFor(St.S.level).toUpperCase(),
        detail: `${fmt(St.levelProgress().have)} OF ${fmt(St.levelProgress().need)} XP TO THE NEXT LEVEL.` },
      { label: 'HARVESTED', right: fmt(s.harvested), detail: 'CROPS PULLED OUT OF THE GROUND.' },
      { label: 'COLLECTED', right: fmt(s.collected), detail: 'GOODS TAKEN FROM YOUR ANIMALS.' },
      { label: 'CRAFTED', right: fmt(s.crafted), detail: 'GOODS MADE IN THE WORKSHOPS.' },
      { label: 'ORDERS', right: fmt(s.orders), detail: 'CRATES SHIPPED FROM THE BOARD.' },
      { label: 'EARNED', right: '$' + fmt(s.earned), detail: 'COINS EARNED SINCE DAY ONE.' },
      { label: 'SAVE', icon: '💾', kind: 'save', detail: 'THE FARM SAVES ITSELF, BUT HERE YOU GO.' },
      { label: 'NEW FARM', kind: 'wipe', detail: 'ERASES THIS FARM FOR GOOD.' },
    ],
    onPick(item) {
      if (item.kind === 'save') { St.save(); S.flash('SAVED'); }
      if (item.kind === 'wipe') {
        S.confirm('ERASE THIS FARM FOR GOOD?', () => { St.wipe(); location.reload(); });
      }
    },
  });
}

/* ------------------------------ start menu ------------------------------- */

function startMenu() {
  S.menu({
    title: 'MENU', items: [
      { label: 'SEEDS', icon: '🌱', kind: 'seeds', detail: 'CHOOSE WHAT TO SOW NEXT.' },
      { label: 'SILO', icon: '🛖', kind: 'silo', detail: 'SELL CROPS.' },
      { label: 'BARN', icon: '🏠', kind: 'barn', detail: 'SELL ANIMAL AND CRAFTED GOODS.' },
      { label: 'ORDERS', icon: '📋', kind: 'orders', detail: 'SEE WHAT CUSTOMERS WANT.' },
      { label: 'WORKS', icon: '🏭', kind: 'works', detail: 'MILL FEED AND CRAFT GOODS.' },
      { label: 'STORE', icon: '🛒', kind: 'store', detail: 'LAND, STORAGE AND UPGRADES.' },
      { label: 'FARMER', icon: '🧑‍🌾', kind: 'home', detail: 'YOUR LEVEL AND RECORDS.' },
    ],
    onPick(item) {
      S.pop();
      ({ seeds: seedBag, silo: siloMenu, barn: barnMenu, orders: ordersMenu,
         works: worksMenu, store: storeMenu, home: homeMenu })[item.kind]();

}

/** Routes a building's door to its window. */
function openBuilding(id) {
  ({ home: homeMenu, silo: siloMenu, barn: barnMenu, works: worksMenu, store: storeMenu })[id]();
}
return { fieldMenu, seedBag, lockedField, penTile, worksMenu, ordersMenu, storeMenu, homeMenu, startMenu, openBuilding, siloMenu, barnMenu };
})();

/* ---------- js/main.js ---------- */
const __mod_main = (function () {
const D = __mod_data;
const St = __mod_state;
const G = __mod_game;
const W = __mod_world;
const S = __mod_screen;
const M = __mod_menus;
const GFX = __mod_gfx;
const {setSound, unlockAudio} = __mod_audio;
const {fmtSpan, now} = __mod_util;
/* ==========================================================================
   main.js — boot, the farmer's movement, input, and the frame loop.
   ========================================================================== */











const $ = id => document.getElementById(id);

const DX = { up: 0, down: 0, left: -1, right: 1 };
const DY = { up: -1, down: 1, left: 0, right: 0 };
const MOVE_MS = 150;
const TILE_F = GFX.TILE;

const player = { x: 6, y: 12, ox: 0, oy: 0, dir: 'down', frame: 0, step: null, path: [], goal: null };

let held = null;          // direction currently pressed
let repeatAt = 0;         // next auto-repeat for menu navigation
let canvas = null;

/* ------------------------------ interaction ------------------------------ */

function targetAt(x, y) {
  const b = W.buildingAt(x, y);
  if (b) return { kind: 'building', id: b.id };
  if (W.isBoard(x, y)) return { kind: 'orders' };
  const i = W.plotAt(x, y);
  if (i >= 0) return { kind: 'field', i };
  if (W.lockedPlotAt(x, y)) return { kind: 'locked' };
  const pen = W.penAt(x, y);
  if (pen) return { kind: 'pen', type: pen.type, slot: pen.slot };
  return null;
}

/** What A would act on: the tile you stand on, else the one you face. */
function currentTarget() {
  return targetAt(player.x, player.y) ||
         targetAt(player.x + DX[player.dir], player.y + DY[player.dir]);
}

function act(t) {
  if (!t) return;
  if (t.kind === 'building') M.openBuilding(t.id);
  else if (t.kind === 'orders') M.ordersMenu();
  else if (t.kind === 'field') M.fieldMenu(t.i);
  else if (t.kind === 'locked') M.lockedField();
  else if (t.kind === 'pen') M.penTile(t.type, t.slot);
}

/* -------------------------------- movement ------------------------------- */

function tryStep(dir) {
  player.dir = dir;
  const nx = player.x + DX[dir], ny = player.y + DY[dir];
  if (W.isSolid(nx, ny)) return false;
  player.step = { fromX: player.x, fromY: player.y, dir, t: now() };
  player.x = nx;
  player.y = ny;
  return true;
}

function updateMovement() {
  if (player.step) {
    const k = Math.min(1, (now() - player.step.t) / MOVE_MS);
    player.ox = -DX[player.step.dir] * TILE_F * (1 - k);
    player.oy = -DY[player.step.dir] * TILE_F * (1 - k);
    if (k >= 1) {
      player.step = null;
      player.ox = player.oy = 0;
      player.frame ^= 1;
      St.S.pos = { x: player.x, y: player.y };
      arrived();
    }
    return;
  }
  if (S.busy()) return;

  if (player.path.length) {
    const next = player.path[0];
    const dir = next.x > player.x ? 'right' : next.x < player.x ? 'left'
      : next.y > player.y ? 'down' : 'up';
    player.path.shift();
    if (!tryStep(dir)) { player.path.length = 0; player.goal = null; }
    return;
  }
  if (held) tryStep(held);
}


/** Fires once a queued walk reaches its destination. */
function arrived() {
  if (player.path.length || !player.goal) return;
  const g = player.goal;
  player.goal = null;
  const t = targetAt(g.x, g.y);
  if (t) act(t);
}

/* --------------------------------- input --------------------------------- */

function press(action) {
  unlockAudio();
  if (action === 'start') {
    if (S.busy()) S.closeAll(); else M.startMenu();
    return;
  }
  if (S.busy()) {
    S.uiKey(action);
    if (DX[action] !== undefined) held = action;   // lets menus auto-repeat
    return;
  }

  if (action === 'a') { player.path.length = 0; act(currentTarget()); return; }
  if (action === 'b') return;
  held = action;
  if (!player.step) { player.path.length = 0; player.goal = null; tryStep(action); }
}

function release(action) {
  if (held === action) held = null;
}

function tap(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const px = (clientX - r.left) / r.width * GFX.SCREEN_W;
  const py = (clientY - r.top) / r.height * GFX.SCREEN_H;
  unlockAudio();

  if (S.busy()) { S.uiTap(px, py); return; }
  if (py < S.HUD_H) { M.startMenu(); return; }

  const tx = Math.floor((px + S.camera.x) / GFX.TILE);
  const ty = Math.floor((py - S.HUD_H + S.camera.y) / GFX.TILE);
  if (!W.inBounds(tx, ty)) return;

  // Standing on it already? Just use it.
  if (tx === player.x && ty === player.y) { act(currentTarget()); return; }

  const path = W.isSolid(tx, ty) ? W.approach(player.x, player.y, tx, ty)
                                 : W.findPath(player.x, player.y, tx, ty);
  if (!path) { S.flash('CANT GET THERE'); return; }
  player.path = path;
  player.goal = { x: tx, y: ty };
  if (!path.length) act(targetAt(tx, ty));
}

function bindControls() {
  for (const btn of document.querySelectorAll('[data-key]')) {
    const key = btn.dataset.key;
    const down = e => {
      e.preventDefault();
      btn.classList.add('on');
      press(key);
      repeatAt = now() + 320;
    };
    const up = e => { e.preventDefault(); btn.classList.remove('on'); release(key); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  }

  canvas.addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX, e.clientY); });

  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    z: 'a', Enter: 'a', ' ': 'a', x: 'b', Escape: 'b', Shift: 'start', Tab: 'start',
  };
  addEventListener('keydown', e => {
    const k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    if (!e.repeat) { press(k); repeatAt = now() + 320; }
  });
  addEventListener('keyup', e => { const k = KEYS[e.key]; if (k) release(k); });
}

/* --------------------------------- loop ---------------------------------- */

let lastTick = 0;

function frame() {
  // Held direction repeats inside menus so long lists are quick to scroll.
  if (held && S.busy() && now() >= repeatAt) {
    S.uiKey(held);
    repeatAt = now() + 130;
  }
  updateMovement();

  if (now() - lastTick >= 1000) {
    lastTick = now();
    G.tick();
    St.saveSoon();
  }

  S.drawFrame(player, !S.busy() && !!currentTarget());
  requestAnimationFrame(frame);
}

/* --------------------------------- boot ---------------------------------- */

function boot() {
  setSound(St.S.settings.sound !== false);
  $('onboard').hidden = true;
  $('device').hidden = false;

  GFX.buildAll();
  W.buildMap();
  // Pick up where you left off, unless that spot is no longer walkable.
  const pos = St.S.pos;
  if (pos && !W.isSolid(pos.x, pos.y)) { player.x = pos.x; player.y = pos.y; }
  canvas = $('screen');
  S.initScreen(canvas);
  bindControls();

  G.on('toast', t => S.flash(t.msg));
  G.on('levelup', lv => {
    const bits = [];
    for (const c of D.CROPS) if (c.level === lv) bits.push(c.name);
    for (const a of D.ANIMALS) if (a.level === lv) bits.push(a.name);
    for (const m of D.MACHINES) if (m.level === lv) bits.push(m.name);
    for (const u of D.UPGRADES) if (u.level === lv) bits.push(u.name);
    S.dialog(`LEVEL ${lv}! ${bits.length ? 'YOU UNLOCKED ' + bits.join(', ') + '.' : 'KEEP GOING!'}`);
  });

  const info = G.settleOffline();
  if (info.away > 120 && (info.ripe || info.ready || info.crafts)) {
    const bits = [];
    if (info.ripe) bits.push(`${info.ripe} FIELDS RIPENED`);
    if (info.ready) bits.push(`${info.ready} ANIMALS PRODUCED`);
    if (info.crafts) bits.push(`${info.crafts} CRAFTS FINISHED`);
    S.dialog(`WELCOME BACK! YOU WERE AWAY ${fmtSpan(info.away).toUpperCase()}. ${bits.join('. ')}.`);
  }

  addEventListener('pagehide', St.save);
  addEventListener('blur', St.save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) St.save(); else G.tick();
  });

  requestAnimationFrame(frame);
}

function showOnboarding() {
  const ob = $('onboard');
  ob.hidden = false;
  let avatar = D.AVATARS[0];
  const grid = $('ob-avatars');
  D.AVATARS.forEach((a, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'av' + (i === 0 ? ' on' : '');
    b.textContent = a;
    b.onclick = () => {
      avatar = a;
      [...grid.children].forEach(c => c.classList.toggle('on', c === b));
    };
    grid.appendChild(b);
  });
  $('ob-start').onclick = () => {
    unlockAudio();
    St.startNew(($('ob-name').value || '').trim().slice(0, 10) || 'FARMER', avatar);
    boot();
  };
}

if (St.load()) boot();
else showOnboarding();
return {  };
})();
</script>
