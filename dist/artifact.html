<style>
/* ==========================================================================
   Sunny Acres — phone-first styling.
   Chunky rounded cards, thick outlines and warm colours, in the mould of the
   big mobile farm games. Everything is CSS/emoji; no image or font downloads.
   ========================================================================== */

:root {
  --sky-1: #86d3f5;
  --sky-2: #c8ecff;
  --grass: #74c045;
  --grass-dk: #4e9a2c;
  --soil: #a06a3c;
  --soil-dk: #6f4520;
  --wood: #d99a55;
  --wood-dk: #9c5f26;
  --card: #fffaef;
  --card-2: #fff3dc;
  --ink: #4a3520;
  --ink-soft: #8a6f52;
  --gold: #ffc42e;
  --gold-dk: #d38f00;
  --gem: #47c9ff;
  --red: #ef5a5a;
  --green: #57c04b;
  --green-dk: #3d9134;
  --shadow: 0 3px 0 rgba(0, 0, 0, .18);
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  /* one type scale, used everywhere */
  --t-title: 16px;
  --t-body: 14px;
  --t-sub: 12px;
  --t-tiny: 10px;

  /* Paper grain and wood grain, mixed into surfaces so nothing is flat. */
  --grain:
    repeating-linear-gradient(48deg, rgba(156, 95, 38, .045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-42deg, rgba(156, 95, 38, .03) 0 3px, transparent 3px 7px);
  --woodgrain:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .07) 0 3px, transparent 3px 9px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .06) 0 1px, transparent 1px 14px);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* `display: flex/grid` on #app and .onboard would otherwise beat [hidden]. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
}

body {
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
               "Segoe UI", system-ui, sans-serif;
  font-size: var(--t-body);
  line-height: 1.35;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, #dff3c4 100%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}

button, input { font: inherit; color: inherit; }

/* ------------------------------ app frame -------------------------------- */

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;   /* fallback for older iOS */
  height: 100dvh;
  max-width: 620px;
  margin: 0 auto;
}

.view {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 10px 12px calc(18px + var(--sab));
}

/* --------------------------------- HUD ----------------------------------- */

.hud {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
  padding: calc(var(--sat) + 8px) 12px 9px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .28)),
    var(--grain);
  border-bottom: 3px solid rgba(156, 95, 38, .32);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* left half: who you are */
.hud-who {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
  min-width: 0;
  padding: 0;
  text-align: left;
}

.hud-avatar {
  position: relative;
  width: 44px; height: 44px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 3px solid #fff;
  background: radial-gradient(circle at 36% 30%, #fff2c9, #ffc95e);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
  display: grid; place-items: center;
  font-size: 23px;
  line-height: 1;
}
.hud-lvl {
  position: absolute;
  right: -5px; bottom: -4px;
  min-width: 21px; height: 21px;
  padding: 0 4px;
  border-radius: 11px;
  border: 2.5px solid #fff;
  background: linear-gradient(180deg, #86dd6e, var(--green-dk));
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  line-height: 16px;
  text-align: center;
}

.hud-id { flex: 1; min-width: 0; }
.hud-name {
  display: block;
  font-size: var(--t-body);
  font-weight: 900;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.15;
}
.hud-title {
  display: block;
  font-size: var(--t-tiny);
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  line-height: 1.2;
}

.xpbar {
  display: block;
  position: relative;
  height: 11px;
  margin-top: 4px;
  border-radius: 6px;
  background: rgba(0, 0, 0, .16);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25);
  overflow: hidden;
}
.xpbar > i {
  display: block;
  height: 100%;
  background: linear-gradient(180deg, #b6ff6e, var(--green-dk));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
  transition: width .4s ease;
}
.xpbar > span {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 8.5px;
  font-weight: 900;
  color: #2f4a1e;
  letter-spacing: .02em;
}

/* right half: what you own */
.hud-wallet {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}

.pill {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  min-width: 92px;
  padding: 3px 10px 3px 7px;
  border: 2.5px solid var(--wood-dk);
  border-radius: 999px;
  background: linear-gradient(180deg, #fff, var(--card-2));
  box-shadow: 0 2px 0 rgba(0, 0, 0, .16);
  font-size: var(--t-sub);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.pill em { font-style: normal; font-size: 14px; line-height: 1; }
.pill-coin { border-color: var(--gold-dk); }
.pill-gem { border-color: #2f9dc8; }

/* -------------------------------- tabbar --------------------------------- */

.tabbar {
  display: flex;
  background: linear-gradient(180deg, var(--wood), #c07b36);
  border-top: 3px solid var(--wood-dk);
  padding-bottom: var(--sab);
  flex-shrink: 0;
}

.tab {
  flex: 1;
  border: 0;
  background: none;
  padding: 7px 0 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: #52300f;
  font-size: 10px;
  font-weight: 800;
  position: relative;
  transition: transform .12s ease;
}
.tab em { font-style: normal; font-size: 21px; line-height: 1; filter: saturate(.75) opacity(.75); }
/* Seven tabs on a narrow phone: let the labels use every pixel they can. */
.tab { min-width: 0; padding-left: 1px; padding-right: 1px; letter-spacing: -.2px; }
.tab.on { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.tab.on em { filter: none; transform: translateY(-2px) scale(1.12); }
.tab:active { transform: scale(.94); }

.tab .badge {
  position: absolute;
  top: 3px; right: 50%;
  margin-right: -22px;
  min-width: 17px; height: 17px;
  border-radius: 9px;
  background: var(--red);
  border: 2px solid #fff;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  display: grid; place-items: center;
  padding: 0 3px;
}

/* -------------------------------- pieces --------------------------------- */

.panel {
  background: var(--grain), linear-gradient(180deg, #fffdf7, var(--card) 40%, var(--card-2));
  border: 3px solid var(--wood-dk);
  border-radius: var(--r-lg);
  box-shadow: 0 4px 0 rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255, 255, 255, .9);
  padding: 12px;
  margin-bottom: 12px;
}

/* The one panel allowed to shout — the festival. */
.panel-feature {
  border-color: #c98a1e;
  background:
    var(--grain),
    linear-gradient(180deg, #fff8e0, #ffeec4 55%, #ffe3a8);
  box-shadow: 0 4px 0 rgba(140, 92, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
}
.panel-feature .panel-head { color: #7a4f00; }

.panel-head {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 900;
}
.panel-head .spacer { flex: 1; }
.panel-head em { font-style: normal; font-size: 20px; }

.section-title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  margin: 4px 2px 8px;
}

.btn {
  border: 2.5px solid var(--wood-dk);
  background: linear-gradient(180deg, #fff, var(--card-2));
  color: var(--ink);
  border-radius: 12px;
  padding: 9px 12px;
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .18);
  transition: transform .1s ease, box-shadow .1s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0, 0, 0, .18); }
.btn[disabled] { opacity: .5; filter: grayscale(.6); }

.btn-green { background: linear-gradient(180deg, #86dd6e, var(--green)); border-color: var(--green-dk); color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .25); }
.btn-gold  { background: linear-gradient(180deg, #ffdc73, var(--gold)); border-color: var(--gold-dk); }
.btn-blue  { background: linear-gradient(180deg, #8fe2ff, #35b7ea); border-color: #1c86b3; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .25); }
.btn-red   { background: linear-gradient(180deg, #ff8e8e, var(--red)); border-color: #c33; color: #fff; }
.btn-sm    { padding: 6px 10px; font-size: 12px; min-height: 32px; border-radius: 10px; }
.btn-big   { width: 100%; padding: 14px; font-size: 17px; border-radius: 16px; }
.btn-row   { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1; }

.storage {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; color: var(--ink-soft);
}
.storage .bar {
  flex: 1; height: 10px;
  background: rgba(0, 0, 0, .12);
  border-radius: 6px; overflow: hidden;
}
.storage .bar > i {
  display: block; height: 100%;
  background: linear-gradient(180deg, #ffd777, var(--gold-dk));
  transition: width .3s ease;
}
.storage.full .bar > i { background: linear-gradient(180deg, #ff9a9a, #d33); }

/* --------------------------------- farm ---------------------------------- */

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 8px;
}

.plot {
  position: relative;
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  border-radius: var(--r-md);
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.09) 0 3px, transparent 3px 13px),
    linear-gradient(180deg, var(--soil), var(--soil-dk));
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22), 0 3px 0 rgba(0, 0, 0, .16);
  display: grid;
  place-items: center;
  overflow: hidden;
  transition: transform .1s ease;
}
.plot:active { transform: scale(.95); }

.plot .crop {
  font-size: 34px;
  line-height: 1;
  transition: transform .5s cubic-bezier(.2, 1.4, .4, 1), opacity .3s;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .3));
}
.plot.empty::after {
  content: '＋';
  font-size: 26px;
  font-weight: 800;
  color: rgba(255, 255, 255, .45);
}
.plot.ready { background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.09) 0 3px, transparent 3px 13px), linear-gradient(180deg, #b98450, #7d5227); }

.plot.ready::before {
  content: '';
  position: absolute; inset: -30%;
  background: radial-gradient(circle, rgba(255, 240, 150, .55), transparent 62%);
}
.plot.locked { filter: grayscale(1) brightness(.75); }

.plot .tag {
  position: absolute;
  bottom: 8px; left: 4px; right: 4px;
  background: rgba(0, 0, 0, .5);
  color: #fff;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 0;
  text-align: center;
  backdrop-filter: blur(2px);
}
.plot .growbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(0, 0, 0, .3);
}
.plot .growbar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #ffe07a, #8ce35a);
}

 50% { transform: translateY(-5px) } }
 50% { opacity: 1 } }

/* seed picker strip */
.seeds {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.seeds::-webkit-scrollbar { display: none; }

.seed {
  flex: 0 0 auto;
  width: 74px;
  border: 2.5px solid var(--wood-dk);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #fff, var(--card-2));
  padding: 6px 4px 5px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .16);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: transform .1s ease;
}
.seed em { font-style: normal; font-size: 26px; line-height: 1.1; }
.seed b { font-size: 11px; font-weight: 800; }
.seed small { font-size: 10px; color: var(--ink-soft); font-weight: 700; }
.seed.on { border-color: var(--green-dk); background: linear-gradient(180deg, #dcffcb, #b6f09a); transform: translateY(-2px); }
.seed.locked { filter: grayscale(1); opacity: .6; }
.seed:active { transform: scale(.94); }

/* --------------------------------- lists --------------------------------- */

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #fffdf6, var(--card-2));
  border: 2px solid rgba(156, 95, 38, .26);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8);
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  color: inherit;
}
.row-tap { transition: transform .1s ease; }
.row-tap:active { transform: scale(.985); }
.row-actions { display: flex; gap: 6px; flex-shrink: 0; }
.row:last-child { margin-bottom: 0; }
.row .ic {
  width: 48px; height: 48px;
  padding: 0;
  border-radius: 12px;
  background: radial-gradient(circle at 35% 28%, #fff, #ffeec9 70%);
  border: 2px solid rgba(156, 95, 38, .3);
  box-shadow: inset 0 -2px 0 rgba(156, 95, 38, .12);
  display: grid; place-items: center;
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
  transition: transform .12s ease;
}
button.ic:active { transform: scale(.9) rotate(-4deg); }
/* A tappable icon says so with a faint ring. */
button.ic { position: relative; }
button.ic::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 13px;
  border: 2px dashed rgba(156, 95, 38, .32);
  opacity: .0;
  transition: opacity .15s;
}
button.ic:hover::after { opacity: 1; }
.row .body { flex: 1; min-width: 0; }
.row .body b { display: block; font-size: var(--t-body); font-weight: 900; letter-spacing: -.01em; }
.row .body small { display: block; font-size: var(--t-sub); color: var(--ink-soft); font-weight: 700; line-height: 1.4; margin-top: 1px; }
.row.locked { opacity: .62; filter: grayscale(.7); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: #fff;
  border: 2px solid rgba(156, 95, 38, .3);
  border-radius: 999px;
  padding: 1px 8px 1px 5px;
  font-size: 11px;
  font-weight: 800;
}
.chip.miss { background: #ffe4e4; border-color: #eaa; color: #b33; }
.chip.done { background: #e2ffd9; border-color: #9d9; }

/* pens & machines */
.pen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 7px; margin-top: 9px; }

.critter {
  position: relative;
  aspect-ratio: 1;
  border: 2.5px solid rgba(156, 95, 38, .35);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #d6f3a6, #a8dc72);
  display: grid; place-items: center;
  font-size: 30px;
  padding: 0;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12);
  transition: transform .1s ease;
}
.critter:active { transform: scale(.94); }
.critter .mark {
  position: absolute; top: -6px; right: -4px;
  font-size: 17px;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3));
}
.critter .tag {
  position: absolute; bottom: 2px; left: 2px; right: 2px;
  font-size: 9px; font-weight: 800;
  background: rgba(0, 0, 0, .45); color: #fff;
  border-radius: 6px; padding: 1px 0;
}
.critter.ready { background: linear-gradient(180deg, #ffe9a0, #ffcd4d); border-color: var(--gold-dk); }
.critter.hungry { background: linear-gradient(180deg, #f3ded0, #d9bda6); }
.critter.add { background: rgba(255, 255, 255, .5); border-style: dashed; font-size: 24px; color: var(--ink-soft); }

.slots { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.slot {
  position: relative;
  width: 60px; height: 60px;
  border-radius: 12px;
  border: 2.5px dashed rgba(156, 95, 38, .4);
  background: rgba(255, 255, 255, .45);
  display: grid; place-items: center;
  font-size: 25px;
  padding: 0;
}
.slot.busy { border-style: solid; background: linear-gradient(180deg, #fff, #ffeec9); }
.slot.done { border-color: var(--green-dk); background: linear-gradient(180deg, #dcffcb, #a9ec8b); box-shadow: 0 0 0 3px rgba(87, 192, 75, .3); }
.slot .tag { position: absolute; bottom: -2px; left: 0; right: 0; font-size: 9px; font-weight: 800; color: var(--ink-soft); }
.slot .ring {
  position: absolute; inset: -3px;
  border-radius: 14px;
  background: conic-gradient(var(--green) var(--p, 0%), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
}

/* orders */
.order { border: 2.5px solid var(--wood-dk); border-radius: var(--r-md); background: linear-gradient(180deg, #fffdf6, #fff0d4); padding: 10px; margin-bottom: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.14); }
.order.wait { opacity: .8; text-align: center; padding: 18px 10px; font-weight: 800; color: var(--ink-soft); }
.order-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.order-top .who { font-size: 26px; }
.order-req { display: flex; gap: 6px; flex-wrap: wrap; }
.req {
  display: flex; flex-direction: column; align-items: center;
  min-width: 52px;
  background: #fff;
  border: 2px solid rgba(156, 95, 38, .3);
  border-radius: 10px;
  padding: 4px 6px;
}
.req em { font-style: normal; font-size: 22px; line-height: 1; }
.req b { font-size: 11px; font-weight: 800; }
.req.miss { background: #ffe9e9; border-color: #e9a; }
.req.miss b { color: #c33; }

/* shop */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ------------------------------- sheets ---------------------------------- */

.backdrop {
  position: fixed; inset: 0;
  background: rgba(30, 18, 6, .5);
  z-index: 50;
  animation: fade .18s ease;
  display: flex; align-items: flex-end;
}
@keyframes fade { from { opacity: 0 } }

.sheet {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 3px solid var(--wood-dk);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  padding: 8px 14px calc(18px + var(--sab));
  max-height: 86dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: rise .24s cubic-bezier(.2, .9, .3, 1);
}
@keyframes rise { from { transform: translateY(100%) } }

.sheet-grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .2); margin: 2px auto 10px; }
.sheet h2 { margin: 0 0 4px; font-size: 19px; font-weight: 900; }
.sheet .sub { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); font-weight: 700; }

.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .num { font-size: 20px; font-weight: 900; min-width: 46px; text-align: center; }

/* ------------------------------- toasts ---------------------------------- */

.toasts {
  position: fixed;
  top: calc(var(--sat) + 66px);
  left: 0; right: 0;
  z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: rgba(46, 30, 14, .93);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, .3);
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  animation: toastIn .22s ease, toastOut .3s ease 1.9s forwards;
  max-width: 88%;
  text-align: center;
}
.toast.bad { background: rgba(150, 34, 34, .95); }
@keyframes toastIn { from { transform: translateY(-14px); opacity: 0 } }
@keyframes toastOut { to { transform: translateY(-10px); opacity: 0 } }

/* floating +coins / +xp text */
.float {
  position: fixed;
  z-index: 80;
  font-weight: 900;
  font-size: 17px;
  color: #fff;
  text-shadow: 0 2px 3px rgba(0, 0, 0, .5);
  pointer-events: none;
  animation: floatUp 1s ease forwards;
}
@keyframes floatUp {
  to { transform: translate(-50%, -60px); opacity: 0 }
}

/* level-up splash */
.levelup {
  position: fixed; inset: 0;
  z-index: 95;
  display: grid; place-items: center;
  background: rgba(20, 12, 4, .55);
  animation: fade .2s ease;
}
.levelup .card {
  background: linear-gradient(180deg, #fff8e2, #ffe2a6);
  border: 4px solid var(--gold-dk);
  border-radius: 26px;
  padding: 22px 26px;
  text-align: center;
  box-shadow: 0 8px 0 rgba(0, 0, 0, .25);
  animation: pop .4s cubic-bezier(.2, 1.5, .4, 1);
  max-width: 320px;
}
@keyframes pop { from { transform: scale(.5); opacity: 0 } }
.levelup .big { font-size: 54px; line-height: 1; }
.levelup h2 { margin: 6px 0 2px; font-size: 26px; font-weight: 900; }
.levelup p { margin: 2px 0 10px; font-weight: 700; color: var(--ink-soft); font-size: 13px; }
.unlock-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }

/* ------------------------------ onboarding ------------------------------- */

.onboard {
  position: fixed; inset: 0;
  z-index: 100;
  display: grid; place-items: center;
  padding: 20px;
  padding-top: calc(var(--sat) + 20px);
  background: linear-gradient(180deg, var(--sky-1), #cdefa4);
  overflow-y: auto;
}
.onboard-card {
  background: var(--card);
  border: 4px solid var(--wood-dk);
  border-radius: 26px;
  padding: 20px;
  width: 100%; max-width: 380px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .2);
  text-align: center;
}
.onboard-logo { font-size: 56px; line-height: 1; }
.onboard h1 { margin: 4px 0 0; font-size: 30px; font-weight: 900; }
.onboard .sub { margin: 2px 0 16px; color: var(--ink-soft); font-weight: 700; }
.fld-label { display: block; text-align: left; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); margin: 10px 2px 5px; }
.fld {
  width: 100%;
  border: 2.5px solid var(--wood-dk);
  border-radius: 12px;
  padding: 11px 12px;
  background: #fff;
  font-size: 16px; /* keeps iOS from zooming the field */
  font-weight: 700;
}
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 16px; }
.av {
  aspect-ratio: 1;
  border: 2.5px solid var(--wood-dk);
  border-radius: 14px;
  background: linear-gradient(180deg, #fff, var(--card-2));
  font-size: 27px;
  display: grid; place-items: center;
  padding: 0;
}
.av.on { border-color: var(--green-dk); background: linear-gradient(180deg, #dcffcb, #a9ec8b); transform: scale(1.05); }

.muted { color: var(--ink-soft); font-weight: 700; font-size: 12px; }
.center { text-align: center; }
.hidden { display: none !important; }

/* ------------------------- goals, market, saves --------------------------- */

.goalbar {
  display: block;
  height: 7px;
  margin-top: 5px;
  border-radius: 4px;
  background: rgba(0, 0, 0, .12);
  overflow: hidden;
}
.goalbar > i {
  display: block;
  height: 100%;
  background: linear-gradient(180deg, #ffd777, var(--gold-dk));
  transition: width .35s ease;
}

.trend {
  display: inline-block;
  margin-left: 5px;
  font-weight: 900;
  font-size: 10px;
  color: var(--ink-soft);
}
.trend.done { color: #2e8b2e; }
.trend.miss { color: #c33; }

.code-box {
  width: 100%;
  height: 96px;
  margin-top: 6px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  line-height: 1.4;
  word-break: break-all;
  resize: none;
}

.slots-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

.slot-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px;
  border: 3px solid var(--wood-dk);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #fff, var(--card-2));
  box-shadow: 0 3px 0 rgba(0, 0, 0, .16);
  text-align: left;
  transition: transform .1s ease;
}
.slot-card:active { transform: translateY(3px); box-shadow: 0 0 0; }
.slot-card .face {
  width: 44px; height: 44px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 3px solid #fff;
  background: linear-gradient(180deg, #ffe9a8, #ffc95e);
  display: grid; place-items: center;
  font-size: 22px;
}
.slot-card .who { flex: 1; min-width: 0; }
.slot-card .who b { display: block; font-size: 15px; font-weight: 900; }
.slot-card .who small { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.slot-card.empty { border-style: dashed; background: rgba(255, 255, 255, .6); }
.slot-card.empty .face { background: rgba(0, 0, 0, .06); border-color: rgba(255, 255, 255, .8); }

.slot-del {
  flex-shrink: 0;
  border: 2px solid #c33;
  background: #ffe4e4;
  color: #c33;
  border-radius: 10px;
  width: 34px; height: 34px;
  font-size: 15px;
}

/* =============================== farm scene =============================== */

.view.flush { padding: 0; overflow: hidden; display: flex; }

.mapcol {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  width: 100%;
}

.fieldscroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 12px 14px;
}

/* ---- silo / barn strip ---- */

.storestrip {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.storecard {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  text-align: left;
  border: 3px solid var(--wood-dk);
  border-radius: var(--r-md);
  background: var(--grain), linear-gradient(180deg, #fffdf7, var(--card-2));
  box-shadow: 0 3px 0 rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255, 255, 255, .9);
  transition: transform .1s ease, box-shadow .1s ease;
}
.storecard:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0, 0, 0, .16); }
.sc-ic { font-size: 26px; line-height: 1; flex-shrink: 0; }
.sc-body { flex: 1; min-width: 0; }
.sc-body b { display: block; font-size: var(--t-sub); font-weight: 900; }
.sc-body small { display: block; font-size: var(--t-tiny); font-weight: 800; color: var(--ink-soft); margin-top: 2px; }
.sc-meter {
  display: block;
  height: 7px;
  margin-top: 3px;
  border-radius: 4px;
  background: rgba(0, 0, 0, .14);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2);
  overflow: hidden;
}
.sc-meter > i {
  display: block; height: 100%;
  background: linear-gradient(180deg, #ffe08a, var(--gold-dk));
  transition: width .4s ease;
}
.storecard.full .sc-meter > i { background: linear-gradient(180deg, #ffa2a2, #d33); }
.storecard.full small { color: #c33; }

/* ---- the field grid ---- */

.fieldgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 9px;
}

.plotcard {
  position: relative;
  aspect-ratio: 1;
  padding: 0;
  border: 3px solid var(--wood-dk);
  border-radius: var(--r-md);
  /* ploughed rows, lit from above */
  background:
    repeating-linear-gradient(180deg,
      rgba(255, 255, 255, .10) 0 2px,
      rgba(0, 0, 0, .13) 2px 5px,
      transparent 5px 16px),
    linear-gradient(180deg, #c68e58, #99653b 60%, #85552e);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, .22),
    inset 0 -6px 0 rgba(0, 0, 0, .2),
    0 3px 0 rgba(0, 0, 0, .2);
  display: grid;
  place-items: center;
  overflow: hidden;
  transition: transform .1s ease, box-shadow .15s ease, border-color .2s ease;
}
.plotcard:active { transform: scale(.96); }

/* the completion bar: full and gold means ready */
.plotcard .fill {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 12px;
  background: rgba(0, 0, 0, .34);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18);
}
.plotcard .fill > i {
  display: block; height: 100%;
  background: linear-gradient(180deg, #d9f7a4, #7fce46);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6);
  transition: width .6s linear;
}
.plotcard.ready .fill > i { background: linear-gradient(180deg, #ffe98a, var(--gold)); }

.plotcard .seedling {
  font-size: 46px;
  line-height: 1;
  transform: scale(var(--s, 1));
  transition: transform .6s cubic-bezier(.2, 1.4, .4, 1);
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .35));
}

.plotcard .plot-label {
  position: absolute;
  left: 0; right: 0; bottom: 6px;
  text-align: center;
  font-size: var(--t-sub);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
}
.plotcard.ready .plot-label { color: #fff6d2; letter-spacing: .06em; }

.plotcard.ready {
  border-color: var(--gold);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, .22),
    inset 0 -6px 0 rgba(0, 0, 0, .2),
    0 3px 0 rgba(0, 0, 0, .2),
    0 0 0 3px rgba(255, 196, 46, .4);
}

.plotcard.empty {
  background:
    repeating-linear-gradient(180deg,
      rgba(255, 255, 255, .07) 0 2px,
      rgba(0, 0, 0, .10) 2px 5px,
      transparent 5px 16px),
    linear-gradient(180deg, #b98css, #8c5c34 60%, #7a4d29);
  background:
    repeating-linear-gradient(180deg,
      rgba(255, 255, 255, .07) 0 2px,
      rgba(0, 0, 0, .10) 2px 5px,
      transparent 5px 16px),
    linear-gradient(180deg, #b9834f, #8c5c34 60%, #7a4d29);
}
.plotcard .sow { font-size: 40px; font-weight: 900; color: rgba(255, 255, 255, .5); line-height: 1; }
.plotcard.empty .plot-label { color: rgba(255, 255, 255, .72); font-weight: 800; }

.plotcard.wild {
  border-style: dashed;
  border-color: rgba(255, 255, 255, .8);
  background: rgba(255, 255, 255, .18);
  box-shadow: none;
}
.plotcard.wild .wild-ic { font-size: 34px; opacity: .85; }
.plotcard.wild .wild-tag {
  position: absolute;
  left: 0; right: 0; bottom: 8px;
  text-align: center;
  font-size: var(--t-sub);
  font-weight: 900;
  color: #4a3520;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .5);
}

/* ---- sowing and reaping ---- */

.fx-sow .seedling { animation: sowDrop .55s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes sowDrop {
  0%   { transform: translateY(-42px) scale(.25); opacity: 0; }
  55%  { transform: translateY(3px) scale(var(--s, 1)); opacity: 1; }
  75%  { transform: translateY(0) scaleY(.82) scaleX(1.12); }
  100% { transform: scale(var(--s, 1)); }
}

.fx-reap { animation: reapShake .38s ease; }
@keyframes reapShake {
  0%, 100% { transform: scale(1); }
  30%      { transform: scale(.94) rotate(-1.5deg); }
  60%      { transform: scale(1.03) rotate(1deg); }
}

.reaped {
  position: absolute;
  font-size: 40px;
  line-height: 1;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .4));
  animation: reapFly .85s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes reapFly {
  0%   { transform: translate(-50%, -50%) scale(.8); opacity: 0; }
  18%  { transform: translate(-50%, -70%) scale(1.32); opacity: 1; }
  100% { transform: translate(-50%, -230%) scale(.55); opacity: 0; }
}

.speck {
  position: absolute;
  width: 7px; height: 7px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: speckOut var(--dur, .7s) cubic-bezier(.2, .7, .4, 1) forwards;
}
.speck.soil { background: #7a4d29; }
.speck.leaf { background: #7fce46; border-radius: 2px; }
@keyframes speckOut {
  0%   { transform: translate(-50%, -50%) scale(1); opacity: .95; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 34px)) scale(.35); opacity: 0; }
}

/* ---- floating seed rack ---- */

.seedbar {
  flex-shrink: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 8px calc(7px + var(--sab));
  background: var(--grain), linear-gradient(180deg, #fffdf7, var(--card));
  border-top: 3px solid var(--wood-dk);
}
.seedbar .strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex: 1;
  scrollbar-width: none;
}
.seedbar .strip::-webkit-scrollbar { display: none; }

.seedchip {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 56px;
  padding: 4px 2px 3px;
  border: 2.5px solid var(--wood-dk);
  border-radius: 11px;
  background: linear-gradient(180deg, #fff, var(--card-2));
  font-size: 23px;
  line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.seedchip small { font-size: 9px; font-weight: 800; color: var(--ink-soft); }
.seedchip.on {
  border-color: var(--green-dk);
  background: linear-gradient(180deg, #dcffcb, #b6f09a);
  box-shadow: 0 2px 0 var(--green-dk);
}
.seedchip.locked { filter: grayscale(1); opacity: .55; }

/* boosts in the HUD */
.boostbar {
  width: 100%;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  margin-top: 6px;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.boostbar::-webkit-scrollbar { display: none; }
.boostchip {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 4px;
  background: rgba(255, 255, 255, .9);
  border: 2px solid var(--green-dk);
  border-radius: 999px;
  padding: 1px 9px 1px 6px;
  font-size: 11px;
  font-weight: 900;
}

/* =================== shared components & polish pass ====================== */

/* wood grain on the tab bar, so the chrome feels made of something */
.tabbar {
  background: var(--woodgrain), linear-gradient(180deg, var(--wood), #b8752f);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .22);
}

.hud {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .12)),
    var(--grain);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
}

/* the one progress meter, used by goals, festival and anything else */
.meter {
  position: relative;
  height: 18px;
  border-radius: 10px;
  background: rgba(0, 0, 0, .13);
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, .18);
  overflow: hidden;
}
.meter > i {
  display: block;
  height: 100%;
  border-radius: 10px 0 0 10px;
  background: linear-gradient(180deg, #ffe08a, var(--gold-dk));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6);
  transition: width .5s cubic-bezier(.2, .9, .3, 1);
}
.meter > span {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: var(--t-tiny);
  font-weight: 900;
  color: #4a3520;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
}
.meter-fest > i { background: linear-gradient(180deg, #ffd27a, #e0851b); }

/* the goal bar reuses the meter look */
.goalbar { height: 8px; border-radius: 5px; box-shadow: inset 0 1px 2px rgba(0,0,0,.2); }

/* chips get semantic colours, consistent across every tab */
.chip { line-height: 18px; }
.chip-gold { background: #fff2cd; border-color: var(--gold-dk); }
.chip-gem  { background: #ddf4ff; border-color: #3ba8d6; }
.chip-link { cursor: pointer; border-style: dashed; }
.chip-link:active { transform: scale(.94); }

.tag {
  background: rgba(0, 0, 0, .08);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: var(--t-sub);
  font-weight: 900;
  color: var(--ink-soft);
  white-space: nowrap;
}

.note {
  background: rgba(255, 255, 255, .7);
  border: 2px solid rgba(156, 95, 38, .22);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  font-size: var(--t-sub);
  font-weight: 700;
  color: var(--ink-soft);
  line-height: 1.45;
}

/* festival milestone markers */
.fest-marks {
  display: flex;
  justify-content: space-between;
  margin: 0 2px 10px;
}
.fest-mark {
  display: flex; flex-direction: column; align-items: center;
  font-size: 19px;
  line-height: 1.1;
  filter: grayscale(1) opacity(.45);
  transition: filter .3s, transform .3s;
}
.fest-mark small { font-size: 9px; font-weight: 900; color: var(--ink-soft); }
.fest-mark.hit { filter: none; transform: scale(1.12); }

/* ------------------------------ info sheets ------------------------------ */

.sheet-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.sheet-hero h2 { margin: 0; }
.sheet-hero .sub { margin: 2px 0 0; }
.hero-ic {
  width: 62px; height: 62px;
  flex-shrink: 0;
  border-radius: 16px;
  border: 3px solid var(--wood-dk);
  background: radial-gradient(circle at 34% 28%, #fff, #ffe9bd 72%);
  box-shadow: inset 0 -3px 0 rgba(156, 95, 38, .16);
  display: grid; place-items: center;
  font-size: 34px;
  line-height: 1;
}

.factgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 12px;
}
.fact {
  background: linear-gradient(180deg, #fffdf6, var(--card-2));
  border: 2px solid rgba(156, 95, 38, .24);
  border-radius: var(--r-sm);
  padding: 7px 9px;
}
.fact small { display: block; font-size: var(--t-tiny); font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; }
.fact b { display: block; font-size: 15px; font-weight: 900; margin-top: 1px; }
.fact-up b { color: #2e8b2e; }
.fact-down b { color: #c33; }

/* -------------------------------- switch --------------------------------- */

.switch {
  flex-shrink: 0;
  width: 52px; height: 30px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .18);
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, .25);
  position: relative;
  transition: background .2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: linear-gradient(180deg, #fff, #ecdfc6);
  box-shadow: 0 2px 3px rgba(0, 0, 0, .3);
  transition: transform .2s cubic-bezier(.3, 1.4, .5, 1);
}
.switch.on { background: linear-gradient(180deg, #86dd6e, var(--green-dk)); }
.switch.on::after { transform: translateX(22px); }

/* ------------------------------- feedback -------------------------------- */

.fx-layer {
  position: fixed;
  inset: 0;
  z-index: 95;
  pointer-events: none;
  overflow: hidden;
}

.confetti {
  position: absolute;
  display: block;
  opacity: .95;
  animation: confettiFly var(--dur, 1.6s) cubic-bezier(.15, .6, .4, 1) var(--delay, 0s) forwards;
}
@keyframes confettiFly {
  0%   { transform: translate(-50%, -50%) rotate(0deg) scale(.4); opacity: 1; }
  25%  { opacity: 1; }
  100% {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 78vh)) rotate(var(--rot)) scale(1);
    opacity: 0;
  }
}

.floaty {
  position: absolute;
  transform: translate(-50%, 0);
  font-size: 16px;
  font-weight: 900;
  color: #2e8b2e;
  text-shadow: 0 2px 0 #fff, 0 0 6px rgba(255, 255, 255, .9);
  animation: floaty 1.1s cubic-bezier(.2, .8, .3, 1) forwards;
  white-space: nowrap;
}
.floaty.bad { color: #c33; }
@keyframes floaty {
  0%   { transform: translate(-50%, 0) scale(.7); opacity: 0; }
  22%  { transform: translate(-50%, -14px) scale(1.12); opacity: 1; }
  100% { transform: translate(-50%, -62px) scale(1); opacity: 0; }
}

/* every button squashes when pressed */
.fx-pop { animation: fxPop .34s cubic-bezier(.25, 1.6, .4, 1); }
@keyframes fxPop {
  0%   { transform: scale(1); }
  35%  { transform: scale(.9); }
  70%  { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* icons on the map give a satisfying squish too */
.mp-plot:active .sprout { transform: scale(.82) !important; }
.critter-m:active .beast { transform: scale(.85); }

/* ------------------------------ the arcade ------------------------------- */

.chip-tag { background: #efe6f8; border-color: #8e6bbd; }

/* The cabinet takes the whole screen: a wooden bezel around one canvas. */
.cab {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;

function clamp(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));

/** 1,234,567 -> "1.23M" so the HUD never overflows on a narrow phone. */
function fmt(n) {
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString('en-US');
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + 'K';

  return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';

/** Countdown text: 1h 04m / 4m 30s / 12s */
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return `${m}m ${String(s).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

/** Same units, but wordier — used for offline summaries. */
function fmtSpan(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h) return `${h} hour${h > 1 ? 's' : ''} ${m} min`;
  if (m) return `${m} minute${m > 1 ? 's' : ''}`;
  return `${sec} seconds`;

function randInt(a, b) {
  return a + Math.floor(Math.random() * (b - a + 1));

function uid() {

function growSeconds(crop) {
  return Math.max(2, Math.round(crop.grow * St.growthMult()));
}

function plotState(p) {
  if (!p) return 'empty';
  return now() >= p.end ? 'ready' : 'growing';
}

function plant(i, cropId) {
  const S = St.S;
  const crop = D.CROPS.find(c => c.id === cropId);
  if (!crop) return false;
  if (crop.level > S.level) { fail(`${crop.name} unlocks at level ${crop.level}`, crop.icon); return false; }
  if (S.plots[i]) return false;
  if (!St.spendCoins(crop.seed)) { fail('Not enough coins for seeds', '🪙'); return false; }
  const t = now();
  S.plots[i] = { crop: cropId, at: t, end: t + growSeconds(crop) * 1000 };
  SFX.plant();
  St.saveSoon();
  return true;
}

/** Fills empty plots with the selected seed. The Tractor makes seeds free. */
function plantAll(cropId) {
  const S = St.S;
  const crop = D.CROPS.find(c => c.id === cropId);
  if (!crop) return 0;
  if (crop.level > S.level) { fail(`${crop.name} unlocks at level ${crop.level}`, crop.icon); return 0; }
  const free = St.has('tractor');
  let planted = 0;
  for (let i = 0; i < S.plots.length; i++) {
    if (S.plots[i]) continue;
    if (!free && S.coins < crop.seed) break;
    if (!free) S.coins -= crop.seed;
    const t = now();
    S.plots[i] = { crop: cropId, at: t, end: t + growSeconds(crop) * 1000 };
    planted++;
  }
  if (planted) { SFX.plant(); ok(`Planted ${planted} × ${crop.name}`, crop.icon); St.saveSoon(); }
  else if (!free) fail('Not enough coins for seeds', '🪙');
  else fail('No empty fields', '🌱');
  return planted;
}

function harvest(i, quiet = false) {
  const S = St.S;
  const p = S.plots[i];
  if (!p || plotState(p) !== 'ready') return 0;
  const crop = D.ITEMS[p.crop];
  const got = St.addItem(p.crop, D.CROP_YIELD);
  if (got === 0) {
    if (!quiet) fail('Silo is full — sell some crops', '🌾');
    return 0;
  }
  S.plots[i] = null;
  S.stats.harvested += got;
  festAdd('harvest', got);
  gainXp(crop.xp);
  if (!quiet) SFX.harvest();
  St.saveSoon();
  return got;
}

function harvestAll() {
  const S = St.S;
  let total = 0, full = false;
  for (let i = 0; i < S.plots.length; i++) {
    if (plotState(S.plots[i]) !== 'ready') continue;
    const got = harvest(i, true);
    if (got === 0) { full = true; break; }
    total += got;
  }
  if (total) { SFX.harvest(); ok(`Harvested ${total} crops`, '🧺'); }
  else if (full) fail('Silo is full — sell some crops', '🌾');
  else fail('Nothing is ripe yet', '⏳');
  return total;
}

function speedUpPlot(i) {
  const S = St.S;
  const p = S.plots[i];
  if (!p || plotState(p) === 'ready') return false;
  const cost = D.speedUpCost((p.end - now()) / 1000);
  if (!St.spendGems(cost)) { fail(`Need ${cost} 💎`, '💎'); return false; }
  p.end = now();
  SFX.collect();
  St.saveSoon();
  return true;
}

/* -------------------------------- animals ------------------------------- */

function buyAnimal(typeId) {
  const S = St.S;
  const a = D.ANIMALS.find(x => x.id === typeId);
  if (!a) return false;
  if (a.level > S.level) { fail(`Unlocks at level ${a.level}`, a.icon); return false; }
  if (St.animalsOf(typeId).length >= a.max) { fail(`Your pen is full`, a.icon); return false; }
  if (!St.spendCoins(a.cost)) { fail('Not enough coins', '🪙'); return false; }
  St.addAnimal(typeId);
  SFX.buy();
  ok(`Welcome, new ${a.name.toLowerCase()}!`, a.icon);
  St.saveSoon();
  return true;
}

function animalState(an) {
  if (an.product) return 'ready';
  if (an.readyAt && now() < an.readyAt) return 'working';
  if (an.readyAt && now() >= an.readyAt) return 'ready';
  return 'hungry';
}

/** Puts an animal to work if the trough can cover it. */
function feedAnimal(an, quiet = false) {
  const type = D.ANIMALS.find(x => x.id === an.type);
  if (animalState(an) !== 'hungry') return false;
  if (!St.takeTrough(type.feed)) {
    if (!quiet) fail('The trough is empty — buy hay or mill some feed', '🌾');
    return false;
  }
  an.fedAt = now();
  an.readyAt = now() + Math.max(1, Math.round(type.cycle * St.animalMult())) * 1000;
  an.product = false;
  if (!quiet) SFX.plant();
  St.saveSoon();
  return true;
}

function collectAnimal(an, quiet = false) {
  const S = St.S;
  const type = D.ANIMALS.find(x => x.id === an.type);
  if (animalState(an) !== 'ready') return 0;
  const got = St.addItem(type.product, 1);
  if (!got) {
    if (!quiet) fail('Barn is full — sell some goods', '📦');
    an.product = true;
    an.readyAt = 0;
    return 0;
  }
  an.product = false;
  an.readyAt = 0;
  S.stats.collected += 1;
  festAdd('collect');
  gainXp(D.ITEMS[type.product].xp);
  if (!quiet) SFX.collect();
  St.saveSoon();
  return 1;
}

function collectAllAnimals() {
  let n = 0;
  for (const an of St.S.animals) n += collectAnimal(an, true);
  if (n) { SFX.collect(); ok(`Collected ${n} goods`, '🧺'); }
  else fail('Nothing ready to collect', '⏳');
  return n;
}

/* -------------------------------- trough -------------------------------- */

/** Buy a bale. The point of this is that coins can stand in for fields. */
function buyHay() {
  if (St.troughUnits() >= D.TROUGH_CAP) { fail('The trough is already full', '🌾'); return false; }
  if (!St.spendCoins(D.HAY.coins)) { fail('Not enough coins', '🪙'); return false; }
  const got = St.addTrough(D.HAY.units);
  SFX.buy();
  ok(`Hay delivered · +${got} feed`, '🌾');
  St.saveSoon();
  return true;
}

/** Grass regrows on its own, but only part-way up the trough. */
function graze() {
  const t = St.S.trough;
  const ceiling = D.TROUGH_CAP * D.GRAZE_CEILING;
  const elapsed = Math.max(0, (now() - (t.grazedAt || now())) / 1000);
  t.grazedAt = now();
  if (t.units >= ceiling) return;
  t.units = Math.min(ceiling, t.units + elapsed * St.grazeRate());
}

/** Seconds until the trough can cover this animal again. */
function grazeWait(need) {
  const t = St.S.trough;
  if (t.units >= need) return 0;
  const ceiling = D.TROUGH_CAP * D.GRAZE_CEILING;
  if (need > ceiling) return Infinity;
  return (need - t.units) / St.grazeRate();
}

function speedUpAnimal(an) {
  if (animalState(an) !== 'working') return false;
  const cost = D.speedUpCost((an.readyAt - now()) / 1000);
  if (!St.spendGems(cost)) { fail(`Need ${cost} 💎`, '💎'); return false; }
  an.readyAt = now();
  SFX.collect();
  St.saveSoon();
  return true;
}

/* ------------------------------- machines ------------------------------- */

function buyMachine(id) {
  const S = St.S;
  const m = D.MACHINES.find(x => x.id === id);
  if (!m) return false;
  if (m.level > S.level) { fail(`Unlocks at level ${m.level}`, m.icon); return false; }
  if (S.machines[id] && S.machines[id].owned) return false;
  if (!St.spendCoins(m.cost)) { fail('Not enough coins', '🪙'); return false; }
  S.machines[id] = { owned: true, queue: [] };
  SFX.buy();
  ok(`${m.name} built!`, m.icon);
  St.saveSoon();
  return true;
}

function craftTime(recipe) {
  return Math.max(2, Math.round(recipe.time * St.craftMult()));
}

/** Jobs run back to back, so a queued job's end time is fixed when enqueued. */
function enqueue(machineId, recipeId) {
  const S = St.S;
  const m = S.machines[machineId];
  const r = D.RECIPES.find(x => x.id === recipeId);
  if (!m || !m.owned || !r) return false;
  if (r.level > S.level) { fail(`Unlocks at level ${r.level}`, '🔒'); return false; }
  if (m.queue.length >= St.queueCap()) { fail('Queue is full', '⏳'); return false; }
  if (!St.hasAll(r.in)) { fail('Missing ingredients', '📦'); return false; }
  St.removeAll(r.in);
  const last = m.queue.length ? m.queue[m.queue.length - 1].end : 0;
  const start = Math.max(now(), last);
  m.queue.push({ jid: uid(), recipe: r.id, start, end: start + craftTime(r) * 1000 });
  SFX.buy();
  St.saveSoon();
  return true;
}

function jobReady(job) {
  return now() >= job.end;
}

function collectJob(machineId, jid, quiet = false) {
  const S = St.S;
  const m = S.machines[machineId];
  if (!m) return 0;
  const idx = m.queue.findIndex(j => j.jid === jid);
  if (idx < 0) return 0;
  const job = m.queue[idx];
  if (!jobReady(job)) return 0;
  const r = D.RECIPES.find(x => x.id === job.recipe);

  // Milled feed is poured straight into the trough, not stacked in the barn.
  if (r.out === 'feed') {
    const poured = St.addTrough(D.MILL_UNITS);
    if (!poured) { if (!quiet) fail('The trough is full', '🌾'); return 0; }
    m.queue.splice(idx, 1);
    S.stats.crafted += 1;
    festAdd('craft', 1);
    if (!quiet) SFX.collect();
    St.saveSoon();
    return 1;
  }

  const got = St.addItem(r.out, r.qty);
  if (!got) { if (!quiet) fail('Barn is full — sell some goods', '📦'); return 0; }
  m.queue.splice(idx, 1);
  S.stats.crafted += got;
  festAdd('craft', got);
  gainXp(D.ITEMS[r.out].xp);
  if (!quiet) SFX.collect();
  St.saveSoon();
  return got;
}

function collectAllJobs() {
  const S = St.S;
  let n = 0;
  for (const [mid, m] of Object.entries(S.machines)) {
    if (!m.owned) continue;
    for (const job of [...m.queue]) if (jobReady(job)) n += collectJob(mid, job.jid, true);
  }
  if (n) { SFX.collect(); ok(`Collected ${n} goods`, '🧺'); }
  return n;
}

function speedUpJob(machineId, jid) {
  const m = St.S.machines[machineId];
  if (!m) return false;
  const idx = m.queue.findIndex(j => j.jid === jid);
  if (idx < 0) return false;
  const job = m.queue[idx];
  if (jobReady(job)) return false;
  const cost = D.speedUpCost((job.end - now()) / 1000);
  if (!St.spendGems(cost)) { fail(`Need ${cost} 💎`, '💎'); return false; }
  const saved = job.end - now();
  job.end = now();
  // Pull every job behind it forward by the same amount.
  for (let k = idx + 1; k < m.queue.length; k++) {
    m.queue[k].start -= saved;
    m.queue[k].end -= saved;
  }
  SFX.collect();
  St.saveSoon();
  return true;
}

/* -------------------------------- selling ------------------------------- */

/** How far today's price sits from the item's base value. */
function marketFactor(id) {
  return D.marketMult(id);
}

function sellPrice(id) {
  return Math.max(1, Math.round(D.ITEMS[id].price * St.sellMult() * marketFactor(id)));
}

/** The best-paying things you actually have in storage right now. */
function marketMovers(limit = 4) {
  return Object.keys(D.ITEMS)
    .filter(id => St.count(id) > 0)
    .map(id => ({ id, factor: marketFactor(id), value: sellPrice(id) * St.count(id) }))
    .sort((a, b) => b.factor - a.factor)
    .slice(0, limit);
}

function sell(id, qty = 1) {
  const S = St.S;
  const have = St.count(id);
  qty = Math.min(qty, have);
  if (qty <= 0) return 0;
  St.removeItem(id, qty);
  const gold = sellPrice(id) * qty;
  St.earnCoins(gold);
  S.stats.sold += qty;
  SFX.coin();
  St.saveSoon();
  return gold;
}

/* --------------------------------- shop --------------------------------- */

function buyPlot() {
  const S = St.S;
  const owned = S.plots.length;
  if (owned >= D.MAX_PLOTS) { fail('Every field is yours already', '🏆'); return false; }
  const lv = D.plotLevel(owned);
  if (S.level < lv) { fail(`Next field unlocks at level ${lv}`, '🔒'); return false; }
  if (!St.spendCoins(D.plotCost(owned))) { fail('Not enough coins', '🪙'); return false; }
  S.plots.push(null);
  SFX.buy();
  ok('New field cleared!', '🌱');
  St.saveSoon();
  return true;
}

function upgradeSilo() {
  const S = St.S;
  if (!St.spendCoins(D.siloUpgradeCost(S.siloCap))) { fail('Not enough coins', '🪙'); return false; }
  S.siloCap += D.SILO_STEP;
  SFX.buy();
  ok(`Silo holds ${S.siloCap} now`, '🛖');
  St.saveSoon();
  return true;
}

function upgradeBarn() {
  const S = St.S;
  if (!St.spendCoins(D.barnUpgradeCost(S.barnCap))) { fail('Not enough coins', '🪙'); return false; }
  S.barnCap += D.BARN_STEP;
  SFX.buy();
  ok(`Barn holds ${S.barnCap} now`, '🏠');
  St.saveSoon();
  return true;
}

/** Boosts stack in time: buying one that's already running extends it. */
function buyBoost(id) {
  const S = St.S;
  const b = D.BOOSTS.find(x => x.id === id);
  if (!b) return false;
  if (S.level < b.level) { fail(`Unlocks at level ${b.level}`, '🔒'); return false; }
  if (b.gems) {
    if (!St.spendGems(b.gems)) { fail(`Need ${b.gems} 💎`, '💎'); return false; }
  } else if (!St.spendCoins(b.coins)) {
    fail('Not enough coins', '🪙');
    return false;
  }
  const from = Math.max(now(), S.boosts[id] || 0);
  S.boosts[id] = from + b.mins * 60000;
  SFX.levelUp();
  ok(`${b.name} is running!`, b.icon);
  St.saveSoon();
  return true;
}

function buyUpgrade(id) {
  const S = St.S;
  const u = D.UPGRADES.find(x => x.id === id);
  if (!u || S.upgrades[id]) return false;
  if (S.level < u.level) { fail(`Unlocks at level ${u.level}`, '🔒'); return false; }
  if (!St.spendCoins(u.cost)) { fail('Not enough coins', '🪙'); return false; }
  S.upgrades[id] = true;
  SFX.levelUp();
  ok(`${u.name} unlocked!`, u.icon);
  St.saveSoon();
  return true;
}

/* -------------------------------- orders -------------------------------- */

function makeOrder() {
  const S = St.S;
  const pool = St.producibleItems();
  if (!pool.length) return null;
  const kinds = clamp(randInt(1, S.level < 5 ? 1 : S.level < 12 ? 2 : 3), 1, pool.length);
  const chosen = [];
  while (chosen.length < kinds) {
    const id = pick(pool);
    if (!chosen.includes(id)) chosen.push(id);
  }
  const items = {};
  let coins = 0, xp = 0;
  for (const id of chosen) {
    const it = D.ITEMS[id];
    // Cheap staples are asked for in bulk, expensive goods one or two at a time.
    const max = it.price < 50 ? 8 : it.price < 300 ? 5 : 3;
    const q = randInt(1, max);
    items[id] = q;
    coins += it.price * q;
    xp += it.xp * q;
  }
  return {
    oid: uid(),
    items,
    coins: Math.round(coins * 1.4 * St.orderMult()),
    xp: Math.max(3, Math.round(xp * 1.8)),
    gems: Math.random() < 0.16 ? 1 : 0,
    createdAt: now(),
  };
}

function orderWait() {
  return D.ORDER_REFRESH * (St.has('truck') ? 0.5 : 1) * 1000;
}

/** Keeps the board at ORDER_SLOTS entries, each either an order or a timer. */
function tickOrders() {
  const S = St.S;
  if (!Array.isArray(S.orders)) S.orders = [];
  while (S.orders.length < D.ORDER_SLOTS) S.orders.push({ wait: 0 });
  S.orders.length = D.ORDER_SLOTS;
  for (let i = 0; i < S.orders.length; i++) {
    const slot = S.orders[i];
    if (slot && slot.oid) continue;
    const until = slot && slot.wait ? slot.wait : 0;
    if (now() >= until) {
      const o = makeOrder();
      S.orders[i] = o || { wait: now() + 30000 };
    }
  }
}

function canDeliver(o) {
  return St.hasAll(o.items);
}

function deliverOrder(oid) {
  const S = St.S;
  const i = S.orders.findIndex(o => o && o.oid === oid);
  if (i < 0) return false;
  const o = S.orders[i];
  if (!St.removeAll(o.items)) { fail('You are missing some items', '📦'); return false; }
  St.earnCoins(o.coins);
  S.gems += o.gems;
  S.stats.orders += 1;
  festAdd('order');
  gainXp(o.xp);
  S.orders[i] = { wait: now() + orderWait() };
  SFX.order();
  ok(`Order delivered! +${o.coins} coins`, '🚚');
  St.saveSoon();
  return true;
}

function declineOrder(oid) {
  const S = St.S;
  const i = S.orders.findIndex(o => o && o.oid === oid);
  if (i < 0) return false;
  S.orders[i] = { wait: now() + orderWait() * 0.5 };
  St.saveSoon();
  return true;
}

/* --------------------------------- goals -------------------------------- */

function goalValue(goal) {
  return goal.stat === 'level' ? St.S.level : (St.S.stats[goal.stat] || 0);
}

/** Which tier this goal is working on, and whether it can be claimed now. */
function goalState(goal) {
  const claimed = St.S.goals[goal.id] || 0;
  const done = claimed >= goal.tiers.length;
  const target = done ? goal.tiers[goal.tiers.length - 1] : goal.tiers[claimed];
  const value = goalValue(goal);
  return { claimed, done, target, value, ready: !done && value >= target };
}

function claimGoal(id) {
  const goal = D.GOALS.find(g => g.id === id);
  if (!goal) return false;
  const st = goalState(goal);
  if (!st.ready) return false;
  const reward = D.goalReward(st.claimed);
  St.S.goals[id] = st.claimed + 1;
  St.earnCoins(reward.coins);
  St.S.gems += reward.gems;
  SFX.levelUp();
  ok(`${goal.name} ${D.GOAL_RANKS[st.claimed]}! +${reward.coins} coins`, goal.icon);
  St.saveSoon();
  return true;
}

const goalsReady = () => D.GOALS.filter(g => goalState(g).ready).length;

/* ---------------------------- harvest festival --------------------------- */

/** Rolls the festival over when the clock enters a new cycle. */
function festState() {
  const S = St.S;
  const cycle = D.festCycle();
  if (!S.fest || S.fest.cycle !== cycle) {
    S.fest = { cycle, points: 0, claimed: [] };
  }
  return S.fest;
}

function festAdd(kind, n = 1) {
  const f = festState();
  f.points += (D.FEST_POINTS[kind] || 0) * n;
}

/** Per-tier view: reached, already claimed, and what it pays. */
function festTiers() {
  const f = festState();
  return D.FEST_TIERS.map((t, i) => ({
    ...t, i,
    reached: f.points >= t.at,
    claimed: !!f.claimed[i],
    reward: D.festReward(i, St.S.level),
  }));
}

const festReady = () => festTiers().filter(t => t.reached && !t.claimed).length;
const festLeft = () => (D.festEndsAt() - now()) / 1000;

function claimFest(i) {
  const f = festState();
  const t = festTiers()[i];
  if (!t || !t.reached || t.claimed) return false;
  f.claimed[i] = true;
  St.earnCoins(t.reward.coins);
  St.S.gems += t.reward.gems;
  gainXp(t.reward.xp);
  SFX.fanfare();
  emit('celebrate', { big: i === D.FEST_TIERS.length - 1 });
  ok(`${t.name} prize! +${t.reward.coins} coins`, t.icon);
  St.saveSoon();
  return true;
}

/* ------------------------------ daily bonus ------------------------------ */

function dailyReady() {
  return St.S.daily.day !== D.today();
}

function claimDaily() {
  const S = St.S;
  if (!dailyReady()) return false;
  // Yesterday's date string tells us whether the streak survived.
  const yesterday = D.today(Date.now() - 86400000);
  S.daily.streak = S.daily.day === yesterday ? S.daily.streak + 1 : 1;
  S.daily.day = D.today();
  const r = D.dailyReward(S.daily.streak, S.level);
  St.earnCoins(r.coins);
  S.gems += r.gems;
  SFX.levelUp();
  ok(`Day ${S.daily.streak} bonus! +${r.coins} coins`, '🎁');
  St.saveSoon();
  return true;
}

/* -------------------------------- arcade -------------------------------- */

/** The arcade's day-book, rolled over at local midnight. */
function arcadeDay() {
  const S = St.S;
  if (!S.arcade) S.arcade = { day: '', gems: 0, plays: 0, best: {} };
  if (S.arcade.day !== D.today()) {
    S.arcade.day = D.today();
    S.arcade.gems = 0;
    S.arcade.plays = 0;
  }
  return S.arcade;
}

const arcadeGemsLeft = () => Math.max(0, D.ARCADE_DAILY_GEMS - arcadeDay().gems);
const arcadeBest = id => arcadeDay().best[id] || 0;
const arcadeOpen = game => St.S.level >= game.level;

/**
 * Banks a finished run. Gems are capped for the day; coins never are, so a
 * good run past the cap still pays. Returns everything the results card shows.
 */
function arcadeFinish(gameId, rawScore) {
  const S = St.S;
  const game = D.ARCADE.find(g => g.id === gameId);
  if (!game) return null;

  const a = arcadeDay();
  const score = Math.max(0, Math.round(rawScore) || 0);
  const prev = a.best[gameId] || 0;
  const isBest = score > prev;
  if (isBest) a.best[gameId] = score;

  const earned = D.arcadeReward(game, score, S.level, isBest);
  const gems = Math.min(earned.gems, arcadeGemsLeft());
  const capped = gems < earned.gems;

  a.gems += gems;
  a.plays += 1;
  S.gems += gems;
  St.earnCoins(earned.coins);

  if (gems) SFX.fanfare();
  else if (earned.coins) SFX.coin();
  St.save();

  return { game, score, prev, isBest, gems, coins: earned.coins, capped };
}

/* --------------------------------- clock -------------------------------- */

/** Runs about once a second, and once on load to settle offline progress. */
function tick() {
  const S = St.S;
  if (!S) return;

  // The Feed Mill comes with the first chicken — no coins asked.
  if (S.level >= 3 && !(S.machines.mill && S.machines.mill.owned)) {
    S.machines.mill = { owned: true, queue: [] };
  }

  for (const [id, end] of Object.entries(S.boosts)) if (end <= now()) delete S.boosts[id];

  festState();
  tickOrders();

  // Grass grows, then every hungry animal helps itself. No tapping to feed.
  graze();
  for (const an of S.animals) {
    if (animalState(an) === 'hungry') feedAnimal(an, true);
  }

  // Safety net: broke, nothing growing and an empty silo would be a dead end.

    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }

  /* -------------------------------- input -------------------------------- */

  const at = e => {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / Math.max(1, r.width) * W,
      y: (e.clientY - r.top) / Math.max(1, r.height) * H,
    };
  };

  let press = null;

  const onDown = e => {
    if (phase === 'over') return;
    const p = at(e);
    press = p;
    if (g.onDrag) g.onDrag(p.x, p.y);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch { /* ok */ } }
  };
  const onMove = e => {
    if (!press) return;
    const p = at(e);
    if (g.onDrag) g.onDrag(p.x, p.y);
    if (e.cancelable) e.preventDefault();
  };
  const onUp = e => {
    if (!press || phase === 'over') { press = null; return; }
    const p = at(e);
    const dx = p.x - press.x, dy = p.y - press.y;
    if (Math.abs(dx) + Math.abs(dy) > 16) { if (g.onSwipe) g.onSwipe(dx, dy); }
    else if (g.onTap) g.onTap(p.x, p.y);
    press = null;
  };
  const onKey = e => {
    if (e.key === 'Escape') { leave(); return; }
    if (phase !== 'play') return;
    if (g.onKey) g.onKey(e.key);
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  };

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', () => { press = null; });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', fit);

  /* --------------------------------- loop -------------------------------- */

  let g = build();
  let phase = 'ready', wait = 1.1, raf = 0, last = 0;
  const scoreEl = head.querySelector('#cab-score');
  const livesEl = head.querySelector('#cab-lives');

  function paintChrome() {
    scoreEl.textContent = fmt(g.score);
    livesEl.textContent = g.lives > 0 ? '❤️'.repeat(Math.min(5, g.lives)) : '';
  }

  function paint() {
    g.draw(ctx);
    if (phase === 'ready') {
      ctx.fillStyle = 'rgba(0,0,0,.32)';
      ctx.fillRect(0, 0, W, H);
      const n = Math.max(1, Math.ceil(wait));
      label(ctx, String(n), W / 2, H / 2 - 12, 64, '#fff', 'center');
      label(ctx, 'GET READY', W / 2, H / 2 + 34, 16, '#fff', 'center');
    }
    paintChrome();
  }

  function frame(ts) {
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts;
    if (phase === 'ready') {
      wait -= dt;
      if (wait <= 0) phase = 'play';
    } else if (phase === 'play') {
      g.step(dt);
      if (g.over) { finish(); return; }
    }
    paint();
    raf = requestAnimationFrame(frame);
  }

  function start() {
    g = build();
    phase = 'ready';
    wait = 1.1;
    last = 0;
    fit();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }

  /* ------------------------------- results ------------------------------- */

  function finish() {
    phase = 'over';
    cancelAnimationFrame(raf);
    paint();

    const r = G.arcadeFinish(game.id, g.score);
    if (r && r.gems) FX.confetti(60);

    const card = el('div', 'cab-over');
    const next = game.gemAt.find(t => t > g.score);
    const bits = [];
    bits.push(`<div class="cab-final"><small>Score</small><b>${fmt(g.score)}</b></div>`);
    if (r && r.isBest) bits.push('<div class="cab-best">🏆 New personal best!</div>');
    else if (r) bits.push(`<div class="cab-best muted">Your best: ${fmt(r.prev)}</div>`);

    const pay = [];
    if (r && r.gems) pay.push(`<span class="chip chip-gem">💎 +${r.gems}</span>`);
    if (r && r.coins) pay.push(`<span class="chip chip-gold">🪙 +${fmt(r.coins)}</span>`);
    if (!pay.length) pay.push('<span class="chip">No score, no prize</span>');

    card.innerHTML =
      `${bits.join('')}<div class="chips cab-pay">${pay.join('')}</div>
       <p class="cab-note">${
         r && r.capped
           ? 'That is every gem the arcade pays today — coins keep coming, and the gems reset at midnight.'
           : next
             ? `${fmt(next - g.score)} more points would have earned another 💎.`
             : 'You cleared every gem rung in this cabinet. Superb.'
       }</p>`;

    const again = el('button', 'btn btn-big btn-green', '🔁 Play again');
    again.onclick = () => { haptic(); card.remove(); start(); };
    const done = el('button', 'btn btn-big btn-blue', 'Back to the barn');
    done.style.marginTop = '8px';
    done.onclick = () => { haptic(); leave(); };
    card.append(again, done);
    stage.appendChild(card);
  }

  /* -------------------------------- leaving ------------------------------ */

  let gone = false;
  function leave() {
    if (gone) return;
    gone = true;
    cancelAnimationFrame(raf);
    window.removeEventListener('keydown', onKey);
    window.removeEventListener('resize', fit);
    root.remove();
    live = null;
    // A run abandoned mid-game still counts — nobody likes losing a good score.
    if (phase === 'play' && g.score > 0) G.arcadeFinish(game.id, g.score);
    if (onDone) onDone();
  }
  quit.onclick = () => { haptic(); leave(); };

  live = { id: game.id, leave };
  start();
}

/** Shuts any open cabinet — used when the game needs the screen back. */
function close() {
  if (live) live.leave();
}
return { open, close, isOpen };
})();

    const u = unlocksAt(lv);
    if (u.length) { target = lv; unlocks = u; break; }

  if (!target) return null;

  let toGo = D.xpToNext(S.level) - S.xp;
  for (let lv = S.level + 1; lv < target; lv++) toGo += D.xpToNext(lv);

  const row = el('div', 'row');

}

/** Everything the map can hand back to us. */
function mapTap(kind, arg) {
  const S = St.S;
  if (kind === 'plot') {
    const i = arg;
    const node = gridRef && gridRef.plotNode(i);
    const state = G.plotState(S.plots[i]);

    if (state === 'empty') {
      if (G.plant(i, S.selectedSeed)) FX.sowFx(node);
    } else if (state === 'ready') {
      const icon = D.ITEMS[S.plots[i].crop].icon;
      const got = G.harvest(i);
      if (got) {
        FX.reapFx(node, icon);
        FX.floatFrom(node, `+${got} ${icon}`);
      }
    } else {
      speedSheet('field', () => { if (G.speedUpPlot(i)) render(); },
        (S.plots[i].end - now()) / 1000, D.ITEMS[S.plots[i].crop]);
      return;
    }
    refresh();
    return;
  }

  if (kind === 'land') { landSheet(); return; }

  if (kind === 'animal') {
    const an = St.animalsOf(arg.type)[arg.idx];
    if (!an) return;
    const st = G.animalState(an);
    if (st === 'hungry') G.feedAnimal(an);
    else if (st === 'ready') G.collectAnimal(an);
    else {
      speedSheet(arg.type, () => { if (G.speedUpAnimal(an)) render(); },
        (an.readyAt - now()) / 1000, D.ITEMS[D.ANIMALS.find(a => a.id === arg.type).product]);
      return;
    }
    refresh();
    return;
  }

  if (kind === 'buy-animal') {
    const t = D.ANIMALS.find(a => a.id === arg);
    if (t.level > S.level) { SFX.error(); toast(`${t.name}s unlock at level ${t.level}`, '🔒', true); return; }
    G.buyAnimal(arg);
    render();
    return;
  }

  if (kind === 'silo') { sellSheet('silo'); return; }
  if (kind === 'barn') { sellSheet('barn'); return; }
  if (kind === 'works') { setView('craft'); return; }
  if (kind === 'orders') { setView('orders'); return; }
  if (kind === 'goals') { setView('goals'); return; }
  if (kind === 'store') { setView('shop'); return; }
}

/** Clearing the next field, from the overgrown patches on the map. */

  const S = St.S;
  if (S.plots.length >= D.MAX_PLOTS) { toast('Every field is yours', '🏆'); return; }
  const cost = D.plotCost(S.plots.length), lv = D.plotLevel(S.plots.length);
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, '🚧 Clear this patch'));
    sheet.appendChild(el('p', 'sub',
      S.level >= lv ? `Field ${S.plots.length + 1} of ${D.MAX_PLOTS}.`
                    : `You need to reach level ${lv} before clearing this one.`));
    const go = el('button', 'btn btn-big btn-green', `🪙 ${fmt(cost)} — Clear it`);
    go.disabled = S.level < lv || S.coins < cost;
    go.onclick = () => { G.buyPlot(); close(); render(); };
    sheet.appendChild(go);
    const no = el('button', 'btn btn-big', 'Not yet');

    const left = (p.end - now()) / 1000;
    if (!b.dataset.crop || b.dataset.crop !== p.crop || !b.querySelector('.crop')) {
      b.innerHTML = `<span class="crop">${crop.icon}</span>
                     <span class="tag"></span><span class="growbar"><i></i></span>`;
      b.dataset.crop = p.crop;
    }
    // Seedling grows into a full plant as the timer runs down.
    const scale = 0.42 + 0.58 * pct;
    b.querySelector('.crop').style.transform = `scale(${scale.toFixed(2)})`;
    b.querySelector('.growbar > i').style.width = (pct * 100).toFixed(1) + '%';
    b.querySelector('.tag').textContent = state === 'ready' ? 'TAP!' : fmtTime(left);
  });
  return b;
}

/** The trough: a bar, what's filling it, and the two ways to top it up. */
function troughPanel() {
  const wrap = el('div', 'trough');
  const bar = meter(0, '', 'meter-hay');
  const note = el('div', 'muted');
  const buttons = el('div', 'btn-row');
  buttons.style.marginTop = '8px';

  const hay = el('button', 'btn btn-sm btn-gold',
    `🌾 Buy hay · 🪙${fmt(D.HAY.coins)}`);
  hay.onclick = () => { haptic(); G.buyHay(); render(); };
  const mill = el('button', 'btn btn-sm', '🏚️ Mill feed');
  mill.onclick = () => { haptic(); setView('craft'); };
  buttons.append(hay, mill);

  wrap.append(el('div', 'fld-label', 'Feed trough'), bar, note, buttons);

  T(() => {
    const u = St.troughUnits();
    const pct = u / D.TROUGH_CAP;
    bar.querySelector('i').style.width = clamp(pct, 0, 1) * 100 + '%';
    bar.querySelector('span').textContent = `${u} / ${D.TROUGH_CAP}`;
    bar.classList.toggle('low', pct < 0.15);
    const grazing = u < D.TROUGH_CAP * D.GRAZE_CEILING;
    const ceiling = Math.round(D.TROUGH_CAP * D.GRAZE_CEILING);
    note.textContent = grazing
      ? `Your animals feed themselves from here. Grass regrows on its own and will reach ` +
        `${ceiling} in about ${fmtTime((ceiling - u) / St.grazeRate())}.`
      : 'Your animals feed themselves from here. The pasture is grazed down to its limit — ' +
        'hay or milled feed tops up the rest.';
    hay.disabled = u >= D.TROUGH_CAP || St.S.coins < D.HAY.coins;
  });
  return wrap;
}

function critterTile(an, type) {
  const b = el('button', 'critter');
  b.onclick = () => {
    haptic();
    const st = G.animalState(an);
    if (st === 'hungry') { G.feedAnimal(an); render(); }
    else if (st === 'ready') { G.collectAnimal(an); render(); }
    else speedSheet(type.name.toLowerCase(), () => { if (G.speedUpAnimal(an)) render(); }, (an.readyAt - now()) / 1000, D.ITEMS[type.product]);
  };
  T(() => {
    const st = G.animalState(an);
    b.className = 'critter ' + st;
    const mark = st === 'ready' ? D.ITEMS[type.product].icon : st === 'hungry' ? '❗' : '';
    const tag = st === 'ready' ? 'TAP!' : st === 'hungry' ? 'Feed' : fmtTime((an.readyAt - now()) / 1000);
    b.innerHTML = `<span>${type.icon}</span>${mark ? `<span class="mark">${mark}</span>` : ''}<span class="tag">${tag}</span>`;
  });
  return b;
}

function craftView() {
  const S = St.S;
  const frag = document.createDocumentFragment();

  const top = panel(`<em>🏭</em>Workshops<span class="spacer"></span>`, storageBar('barn'));
  const cb = el('button', 'btn btn-sm btn-green', '🧺 Collect Everything');
  cb.style.marginTop = '8px';
  cb.onclick = () => { haptic(); G.collectAllJobs(); render(); };
  top.appendChild(cb);
  frag.appendChild(top);

  const soon = [];
  for (const m of D.MACHINES) {
    const owned = S.machines[m.id] && S.machines[m.id].owned;
    if (m.level > S.level && !owned) {
      soon.push(lockRow(m.icon, m.name, m.level,
        D.recipesFor(m.id).map(r => D.ITEMS[r.out].icon).join(' ')));
      continue;
    }

    if (!owned) {
      const b = el('button', 'btn btn-sm btn-green', `🔨 ${fmt(m.cost)}`);
      b.disabled = S.coins < m.cost;
      b.onclick = () => { haptic(); G.buyMachine(m.id); render(); };
      frag.appendChild(panel(null, row({
        icon: m.icon,
        title: m.name,
        sub: `Makes ${D.recipesFor(m.id).map(r => D.ITEMS[r.out].name).join(', ')}`,
        trail: b,
        onIcon: () => machineSheet(m.id),
      })));
      continue;
    }

    frag.appendChild(machinePanel(m));
  }
  if (soon.length) frag.appendChild(panel(`<em>🔒</em>Coming Soon`, ...soon));
  return frag;
}

function machinePanel(m) {
  const S = St.S;
  const head = `<em>${m.icon}</em>${m.name}<span class="spacer"></span>`;
  const slots = el('div', 'slots');
  const list = el('div');
  list.style.marginTop = '10px';

  const cap = St.queueCap();
  for (let i = 0; i < cap; i++) slots.appendChild(slotTile(m.id, i));

  for (const r of D.recipesFor(m.id)) {
    const out = D.ITEMS[r.out];
    const locked = r.level > S.level;
    const row = el('div', 'row' + (locked ? ' locked' : ''));
    const ing = el('div', 'chips');
    const icBtn = el('button', 'ic', out.icon);
    icBtn.onclick = e => { e.stopPropagation(); haptic(); itemSheet(r.out); };
    row.appendChild(icBtn);
    const body = el('div', 'body');
    const toTrough = r.out === 'feed';
    body.innerHTML = `<b>${toTrough ? `Feed · +${D.MILL_UNITS} to trough` : out.name + (r.qty > 1 ? ' ×' + r.qty : '')}</b>
      <small>${locked ? '🔒 Level ' + r.level
        : toTrough ? `⏱ ${fmtTime(G.craftTime(r))} · fills the trough your animals eat from`
        : `⏱ ${fmtTime(G.craftTime(r))} · 🪙${fmt(G.sellPrice(r.out))} · +${out.xp} XP`}</small>`;
    body.appendChild(ing);
    row.appendChild(body);

    const btn = el('button', 'btn btn-sm btn-green', '🔨 Make');
    btn.onclick = () => { haptic(); G.enqueue(m.id, r.id); render(); };
    row.appendChild(btn);

    T(() => {
      ing.innerHTML = '';
      for (const [id, q] of Object.entries(r.in)) {
        const have = St.count(id);
        ing.appendChild(el('span', 'chip ' + (have >= q ? 'done' : 'miss'),
          have >= q ? `${D.ITEMS[id].icon} ×${q}` : `${D.ITEMS[id].icon} ${have}/${q}`));
      }
      const full = S.machines[m.id].queue.length >= St.queueCap();
      btn.disabled = locked || full || !St.hasAll(r.in);
      btn.textContent = full ? '⏳ Full' : '🔨 Make';
    });
    list.appendChild(row);
  }
  return panel(head, slots, list);
}

function slotTile(machineId, i) {
  const b = el('button', 'slot');
  b.onclick = () => {
    const m = St.S.machines[machineId];
    const job = m.queue[i];
    if (!job) return;
    haptic();
    if (G.jobReady(job)) { G.collectJob(machineId, job.jid); render(); }
    else {
      const r = D.RECIPES.find(x => x.id === job.recipe);
      speedSheet(D.ITEMS[r.out].name, () => { if (G.speedUpJob(machineId, job.jid)) render(); },
        (job.end - now()) / 1000, D.ITEMS[r.out]);
    }
  };
  T(() => {
    const m = St.S.machines[machineId];
    const job = m.queue[i];
    if (!job) { b.className = 'slot'; b.innerHTML = '<span style="opacity:.35">＋</span>'; return; }
    const r = D.RECIPES.find(x => x.id === job.recipe);
    const out = D.ITEMS[r.out];
    const ready = G.jobReady(job);
    b.className = 'slot ' + (ready ? 'done' : 'busy');
    const total = Math.max(1, job.end - job.start);
    const pct = clamp((now() - job.start) / total, 0, 1) * 100;
    b.innerHTML = `<span class="ring" style="--p:${pct.toFixed(0)}%"></span><span>${out.icon}</span>
      <span class="tag">${ready ? 'TAP!' : fmtTime((job.end - now()) / 1000)}</span>`;
  });
  return b;
}

const CUSTOMERS = ['👨‍🍳', '👵', '🧑‍🎤', '👮', '🧑‍🏫', '👨‍🔧', '🧕', '🧑‍🚀', '💁', '🧙'];

function ordersView() {
  const S = St.S;
  const frag = document.createDocumentFragment();
  const p = panel(`<em>📋</em>Order Board<span class="spacer"></span>`);
  p.appendChild(el('div', 'muted',
    'Fill a crate to earn far more than selling piece by piece. Decline anything you cannot make — a new order arrives sooner.'));
  frag.appendChild(p);

  S.orders.forEach((o, i) => {
    if (!o || !o.oid) {
      const w = el('div', 'order wait');
      T(() => {
        const left = ((o && o.wait ? o.wait : 0) - now()) / 1000;
        w.innerHTML = `🚚 New order in ${fmtTime(Math.max(0, left))}`;
      });
      frag.appendChild(w);
      return;
    }
    frag.appendChild(orderCard(o, i));

}

function orderCard(o, i) {
  const card = el('div', 'order');
  const face = CUSTOMERS[(o.oid.charCodeAt(0) + i) % CUSTOMERS.length];
  const top = el('div', 'order-top');
  top.innerHTML = `<span class="who">${face}</span>
    <div class="body" style="flex:1"><b>Order #${o.oid.slice(0, 4).toUpperCase()}</b>
      <small class="muted">🪙 ${fmt(o.coins)} · +${o.xp} XP${o.gems ? ` · 💎 ${o.gems}` : ''}</small></div>`;
  card.appendChild(top);

  const reqs = el('div', 'order-req');
  card.appendChild(reqs);

  const btns = el('div', 'btn-row');
  btns.style.marginTop = '10px';
  const deliver = el('button', 'btn btn-sm btn-green', '🚚 Deliver');
  deliver.onclick = () => { haptic(); G.deliverOrder(o.oid); render(); };
  const decline = el('button', 'btn btn-sm', '✖️ Decline');
  decline.style.flex = '0 0 auto';
  decline.onclick = () => { haptic(); G.declineOrder(o.oid); render(); };
  btns.append(deliver, decline);
  card.appendChild(btns);

  T(() => {
    reqs.innerHTML = '';
    for (const [id, q] of Object.entries(o.items)) {
      const have = St.count(id);
      const r = el('div', 'req' + (have >= q ? '' : ' miss'));
      r.innerHTML = `<em>${D.ITEMS[id].icon}</em><b>${Math.min(have, q)}/${q}</b>`;
      reqs.appendChild(r);
    }
    deliver.disabled = !G.canDeliver(o);
  });
  return card;
}

function arcadeView() {
  const frag = document.createDocumentFragment();

  const head = panel(`<em>🕹️</em>Barn Arcade<span class="spacer"></span>
                      <span class="tag">💎 ${left} left today</span>`);
  head.classList.add('panel-feature');
  head.appendChild(el('div', 'muted',
    'Three cabinets in the back of the barn, in the spirit of the old ones. ' +
    'They pay gems — the one thing the farm itself never hands out freely.'));
  head.appendChild(meter(won / D.ARCADE_DAILY_GEMS,
    `${won} of ${D.ARCADE_DAILY_GEMS} arcade gems won today`, 'meter-fest'));
  if (!left) {
    head.appendChild(el('div', 'muted',
      "That's the day's gems. Coins still pay on every run, and the gems reset at midnight."));
  }
  frag.appendChild(head);

  const list = panel(`<em>🎮</em>Cabinets`);
  for (const game of D.ARCADE) {
    const unlocked = G.arcadeOpen(game);

                    : { text: 'Not played yet' });

      chips.push(next ? { text: `💎 at ${fmt(next)}`, cls: 'chip-gem' }
                      : { text: '💎 all rungs cleared', cls: 'chip-gem' });
    }

    const play = costBtn('▶ Play', {
      tone: 'green',
      disabled: !unlocked,
      onTap: () => Arcade.open(game.id, () => render()),
    });

    list.appendChild(row({
      icon: game.cab,
      title: `${game.icon} ${game.name}`,
      sub: unlocked ? game.blurb : `🔒 Unlocks at level ${game.level}`,
      chips,
      locked: !unlocked,
      trail: play,
