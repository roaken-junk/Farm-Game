<style>
/* ==========================================================================
   Sunny Acres — phone-first styling.
   Chunky rounded cards, thick outlines and warm colours, in the mould of the
   big mobile farm games. Everything is CSS/emoji; no image or font downloads.
   ========================================================================== */

:root {
  --sky-1: #86d3f5;
  --sky-2: #c8ecff;
  --grass: #74c045;
  --grass-dk: #4e9a2c;
  --soil: #a06a3c;
  --soil-dk: #6f4520;
  --wood: #d99a55;
  --wood-dk: #9c5f26;
  --card: #fffaef;
  --card-2: #fff3dc;
  --ink: #4a3520;
  --ink-soft: #8a6f52;
  --gold: #ffc42e;
  --gold-dk: #d38f00;
  --gem: #47c9ff;
  --red: #ef5a5a;
  --green: #57c04b;
  --green-dk: #3d9134;
  --shadow: 0 3px 0 rgba(0, 0, 0, .18);
  --r-lg: 20px;
  --r-md: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* `display: flex/grid` on #app and .onboard would otherwise beat [hidden]. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
}

body {
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
               "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, #dff3c4 100%);
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}

button, input { font: inherit; color: inherit; }

/* ------------------------------ app frame -------------------------------- */

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;   /* fallback for older iOS */
  height: 100dvh;
  max-width: 620px;
  margin: 0 auto;
}

.view {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 10px 12px calc(18px + var(--sab));
}

/* --------------------------------- HUD ----------------------------------- */

.hud {
  padding: calc(var(--sat) + 8px) 12px 8px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .1));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.hud-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: linear-gradient(180deg, #ffe9a8, #ffc95e);
  display: grid; place-items: center;
  font-size: 24px;
  box-shadow: var(--shadow);
  flex-shrink: 0;
  padding: 0;
  position: relative;
}

.hud-lvl {
  position: absolute;
  bottom: -6px; left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  border: 2px solid #fff;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 800;
  padding: 0 5px;
  line-height: 14px;
  white-space: nowrap;
}

.hud-mid { flex: 1; min-width: 0; }

.hud-name {
  font-size: 12px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.xpbar {
  height: 12px;
  background: rgba(0, 0, 0, .22);
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid #fff;
  margin-top: 3px;
  position: relative;
}
.xpbar > i {
  display: block;
  height: 100%;
  background: linear-gradient(180deg, #b6ff6e, var(--green-dk));
  border-radius: 6px 0 0 6px;
  transition: width .35s ease;
}
.xpbar > span {
  position: absolute; inset: 0;
  font-size: 9px; font-weight: 800; color: #fff;
  text-shadow: 0 1px 1px rgba(0, 0, 0, .5);
  display: grid; place-items: center;
  letter-spacing: .2px;
}

.pill {
  display: flex; align-items: center; gap: 4px;
  background: var(--card);
  border: 2.5px solid var(--wood-dk);
  border-radius: 999px;
  padding: 4px 10px 4px 6px;
  font-weight: 800;
  font-size: 13px;
  box-shadow: var(--shadow);
  flex-shrink: 0;
}
.pill em { font-style: normal; font-size: 15px; }

/* -------------------------------- tabbar --------------------------------- */

.tabbar {
  display: flex;
  background: linear-gradient(180deg, var(--wood), #c07b36);
  border-top: 3px solid var(--wood-dk);
  padding-bottom: var(--sab);
  flex-shrink: 0;
}

.tab {
  flex: 1;
  border: 0;
  background: none;
  padding: 7px 0 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: #52300f;
  font-size: 10px;
  font-weight: 800;
  position: relative;
  transition: transform .12s ease;
}
.tab em { font-style: normal; font-size: 22px; line-height: 1; filter: saturate(.75) opacity(.75); }
.tab.on { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.tab.on em { filter: none; transform: translateY(-2px) scale(1.12); }
.tab:active { transform: scale(.94); }

.tab .badge {
  position: absolute;
  top: 3px; right: 50%;
  margin-right: -22px;
  min-width: 17px; height: 17px;
  border-radius: 9px;
  background: var(--red);
  border: 2px solid #fff;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  display: grid; place-items: center;
  padding: 0 3px;
}

/* -------------------------------- pieces --------------------------------- */

.panel {
  background: var(--card);
  border: 3px solid var(--wood-dk);
  border-radius: var(--r-lg);
  box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
  padding: 12px;
  margin-bottom: 12px;
}

.panel-head {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 900;
}
.panel-head .spacer { flex: 1; }
.panel-head em { font-style: normal; font-size: 20px; }

.section-title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  margin: 4px 2px 8px;
}

.btn {
  border: 2.5px solid var(--wood-dk);
  background: linear-gradient(180deg, #fff, var(--card-2));
  color: var(--ink);
  border-radius: 12px;
  padding: 9px 12px;
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .18);
  transition: transform .1s ease, box-shadow .1s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0, 0, 0, .18); }
.btn[disabled] { opacity: .5; filter: grayscale(.6); }

.btn-green { background: linear-gradient(180deg, #86dd6e, var(--green)); border-color: var(--green-dk); color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .25); }
.btn-gold  { background: linear-gradient(180deg, #ffdc73, var(--gold)); border-color: var(--gold-dk); }
.btn-blue  { background: linear-gradient(180deg, #8fe2ff, #35b7ea); border-color: #1c86b3; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .25); }
.btn-red   { background: linear-gradient(180deg, #ff8e8e, var(--red)); border-color: #c33; color: #fff; }
.btn-sm    { padding: 6px 10px; font-size: 12px; min-height: 32px; border-radius: 10px; }
.btn-big   { width: 100%; padding: 14px; font-size: 17px; border-radius: 16px; }
.btn-row   { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1; }

.storage {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; color: var(--ink-soft);
}
.storage .bar {
  flex: 1; height: 10px;
  background: rgba(0, 0, 0, .12);
  border-radius: 6px; overflow: hidden;
}
.storage .bar > i {
  display: block; height: 100%;
  background: linear-gradient(180deg, #ffd777, var(--gold-dk));
  transition: width .3s ease;
}
.storage.full .bar > i { background: linear-gradient(180deg, #ff9a9a, #d33); }

/* --------------------------------- farm ---------------------------------- */

.fields {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 8px;
}

.plot {
  position: relative;
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  border-radius: var(--r-md);
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.09) 0 3px, transparent 3px 13px),
    linear-gradient(180deg, var(--soil), var(--soil-dk));
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22), 0 3px 0 rgba(0, 0, 0, .16);
  display: grid;
  place-items: center;
  overflow: hidden;
  transition: transform .1s ease;
}
.plot:active { transform: scale(.95); }

.plot .crop {
  font-size: 34px;
  line-height: 1;
  transition: transform .5s cubic-bezier(.2, 1.4, .4, 1), opacity .3s;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .3));
}
.plot.empty::after {
  content: '＋';
  font-size: 26px;
  font-weight: 800;
  color: rgba(255, 255, 255, .45);
}
.plot.ready { background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.09) 0 3px, transparent 3px 13px), linear-gradient(180deg, #b98450, #7d5227); }
.plot.ready .crop { animation: bob .9s ease-in-out infinite; }
.plot.ready::before {
  content: '';
  position: absolute; inset: -30%;
  background: radial-gradient(circle, rgba(255, 240, 150, .55), transparent 62%);
  animation: pulse 1.6s ease-in-out infinite;
}
.plot.locked { filter: grayscale(1) brightness(.75); }

.plot .tag {
  position: absolute;
  bottom: 8px; left: 4px; right: 4px;
  background: rgba(0, 0, 0, .5);
  color: #fff;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 0;
  text-align: center;
  backdrop-filter: blur(2px);
}
.plot .growbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(0, 0, 0, .3);
}
.plot .growbar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #ffe07a, #8ce35a);
}

@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes pulse { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }

/* seed picker strip */
.seeds {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.seeds::-webkit-scrollbar { display: none; }

.seed {
  flex: 0 0 auto;
  width: 74px;
  border: 2.5px solid var(--wood-dk);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #fff, var(--card-2));
  padding: 6px 4px 5px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .16);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: transform .1s ease;
}
.seed em { font-style: normal; font-size: 26px; line-height: 1.1; }
.seed b { font-size: 11px; font-weight: 800; }
.seed small { font-size: 10px; color: var(--ink-soft); font-weight: 700; }
.seed.on { border-color: var(--green-dk); background: linear-gradient(180deg, #dcffcb, #b6f09a); transform: translateY(-2px); }
.seed.locked { filter: grayscale(1); opacity: .6; }
.seed:active { transform: scale(.94); }

/* --------------------------------- lists --------------------------------- */

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: var(--r-md);
  background: var(--card-2);
  border: 2px solid rgba(156, 95, 38, .28);
  margin-bottom: 8px;
}
.row:last-child { margin-bottom: 0; }
.row .ic {
  width: 46px; height: 46px;
  border-radius: 12px;
  background: linear-gradient(180deg, #fff, #ffeec9);
  border: 2px solid rgba(156, 95, 38, .3);
  display: grid; place-items: center;
  font-size: 25px;
  flex-shrink: 0;
}
.row .body { flex: 1; min-width: 0; }
.row .body b { display: block; font-size: 14px; font-weight: 900; }
.row .body small { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 700; line-height: 1.35; }
.row.locked { opacity: .62; filter: grayscale(.7); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: #fff;
  border: 2px solid rgba(156, 95, 38, .3);
  border-radius: 999px;
  padding: 1px 8px 1px 5px;
  font-size: 11px;
  font-weight: 800;
}
.chip.miss { background: #ffe4e4; border-color: #eaa; color: #b33; }
.chip.done { background: #e2ffd9; border-color: #9d9; }

/* pens & machines */
.pen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 7px; margin-top: 9px; }

.critter {
  position: relative;
  aspect-ratio: 1;
  border: 2.5px solid rgba(156, 95, 38, .35);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #d6f3a6, #a8dc72);
  display: grid; place-items: center;
  font-size: 30px;
  padding: 0;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12);
  transition: transform .1s ease;
}
.critter:active { transform: scale(.94); }
.critter .mark {
  position: absolute; top: -6px; right: -4px;
  font-size: 17px;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3));
}
.critter .tag {
  position: absolute; bottom: 2px; left: 2px; right: 2px;
  font-size: 9px; font-weight: 800;
  background: rgba(0, 0, 0, .45); color: #fff;
  border-radius: 6px; padding: 1px 0;
}
.critter.ready { background: linear-gradient(180deg, #ffe9a0, #ffcd4d); animation: bob 1s ease-in-out infinite; }
.critter.hungry { background: linear-gradient(180deg, #f3ded0, #d9bda6); }
.critter.add { background: rgba(255, 255, 255, .5); border-style: dashed; font-size: 24px; color: var(--ink-soft); }

.slots { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.slot {
  position: relative;
  width: 60px; height: 60px;
  border-radius: 12px;
  border: 2.5px dashed rgba(156, 95, 38, .4);
  background: rgba(255, 255, 255, .45);
  display: grid; place-items: center;
  font-size: 25px;
  padding: 0;
}
.slot.busy { border-style: solid; background: linear-gradient(180deg, #fff, #ffeec9); }
.slot.done { border-color: var(--green-dk); background: linear-gradient(180deg, #dcffcb, #a9ec8b); animation: bob 1s ease-in-out infinite; }
.slot .tag { position: absolute; bottom: -2px; left: 0; right: 0; font-size: 9px; font-weight: 800; color: var(--ink-soft); }
.slot .ring {
  position: absolute; inset: -3px;
  border-radius: 14px;
  background: conic-gradient(var(--green) var(--p, 0%), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
}

/* orders */
.order { border: 2.5px solid var(--wood-dk); border-radius: var(--r-md); background: linear-gradient(180deg, #fffdf6, #fff0d4); padding: 10px; margin-bottom: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.14); }
.order.wait { opacity: .8; text-align: center; padding: 18px 10px; font-weight: 800; color: var(--ink-soft); }
.order-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.order-top .who { font-size: 26px; }
.order-req { display: flex; gap: 6px; flex-wrap: wrap; }
.req {
  display: flex; flex-direction: column; align-items: center;
  min-width: 52px;
  background: #fff;
  border: 2px solid rgba(156, 95, 38, .3);
  border-radius: 10px;
  padding: 4px 6px;
}
.req em { font-style: normal; font-size: 22px; line-height: 1; }
.req b { font-size: 11px; font-weight: 800; }
.req.miss { background: #ffe9e9; border-color: #e9a; }
.req.miss b { color: #c33; }

/* shop */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ------------------------------- sheets ---------------------------------- */

.backdrop {
  position: fixed; inset: 0;
  background: rgba(30, 18, 6, .5);
  z-index: 50;
  animation: fade .18s ease;
  display: flex; align-items: flex-end;
}
@keyframes fade { from { opacity: 0 } }

.sheet {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 3px solid var(--wood-dk);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  padding: 8px 14px calc(18px + var(--sab));
  max-height: 86dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: rise .24s cubic-bezier(.2, .9, .3, 1);
}
@keyframes rise { from { transform: translateY(100%) } }

.sheet-grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .2); margin: 2px auto 10px; }
.sheet h2 { margin: 0 0 4px; font-size: 19px; font-weight: 900; }
.sheet .sub { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); font-weight: 700; }

.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .num { font-size: 20px; font-weight: 900; min-width: 46px; text-align: center; }

/* ------------------------------- toasts ---------------------------------- */

.toasts {
  position: fixed;
  top: calc(var(--sat) + 66px);
  left: 0; right: 0;
  z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: rgba(46, 30, 14, .93);
  color: #fff;
  border: 2px solid rgba(255, 255, 255, .3);
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  animation: toastIn .22s ease, toastOut .3s ease 1.9s forwards;
  max-width: 88%;
  text-align: center;
}
.toast.bad { background: rgba(150, 34, 34, .95); }
@keyframes toastIn { from { transform: translateY(-14px); opacity: 0 } }
@keyframes toastOut { to { transform: translateY(-10px); opacity: 0 } }

/* floating +coins / +xp text */
.float {
  position: fixed;
  z-index: 80;
  font-weight: 900;
  font-size: 17px;
  color: #fff;
  text-shadow: 0 2px 3px rgba(0, 0, 0, .5);
  pointer-events: none;
  animation: floatUp 1s ease forwards;
}
@keyframes floatUp {
  to { transform: translate(-50%, -60px); opacity: 0 }
}

/* level-up splash */
.levelup {
  position: fixed; inset: 0;
  z-index: 95;
  display: grid; place-items: center;
  background: rgba(20, 12, 4, .55);
  animation: fade .2s ease;
}
.levelup .card {
  background: linear-gradient(180deg, #fff8e2, #ffe2a6);
  border: 4px solid var(--gold-dk);
  border-radius: 26px;
  padding: 22px 26px;
  text-align: center;
  box-shadow: 0 8px 0 rgba(0, 0, 0, .25);
  animation: pop .4s cubic-bezier(.2, 1.5, .4, 1);
  max-width: 320px;
}
@keyframes pop { from { transform: scale(.5); opacity: 0 } }
.levelup .big { font-size: 54px; line-height: 1; }
.levelup h2 { margin: 6px 0 2px; font-size: 26px; font-weight: 900; }
.levelup p { margin: 2px 0 10px; font-weight: 700; color: var(--ink-soft); font-size: 13px; }
.unlock-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }

/* ------------------------------ onboarding ------------------------------- */

.onboard {
  position: fixed; inset: 0;
  z-index: 100;
  display: grid; place-items: center;
  padding: 20px;
  padding-top: calc(var(--sat) + 20px);
  background: linear-gradient(180deg, var(--sky-1), #cdefa4);
  overflow-y: auto;
}
.onboard-card {
  background: var(--card);
  border: 4px solid var(--wood-dk);
  border-radius: 26px;
  padding: 20px;
  width: 100%; max-width: 380px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .2);
  text-align: center;
}
.onboard-logo { font-size: 56px; line-height: 1; }
.onboard h1 { margin: 4px 0 0; font-size: 30px; font-weight: 900; }
.onboard .sub { margin: 2px 0 16px; color: var(--ink-soft); font-weight: 700; }
.fld-label { display: block; text-align: left; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); margin: 10px 2px 5px; }
.fld {
  width: 100%;
  border: 2.5px solid var(--wood-dk);
  border-radius: 12px;
  padding: 11px 12px;
  background: #fff;
  font-size: 16px; /* keeps iOS from zooming the field */
  font-weight: 700;
}
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 16px; }
.av {
  aspect-ratio: 1;

/* Small shared helpers. */

const now = () => Date.now();

function clamp(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));
}

/** 1,234,567 -> "1.23M" so the HUD never overflows on a narrow phone. */
function fmt(n) {
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString('en-US');
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
}

/** Countdown text: 1h 04m / 4m 30s / 12s */
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return `${m}m ${String(s).padStart(2, '0')}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${String(m % 60).padStart(2, '0')}m`;
}

/** Same units, but wordier — used for offline summaries. */
function fmtSpan(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h) return `${h} hour${h > 1 ? 's' : ''} ${m} min`;
  if (m) return `${m} minute${m > 1 ? 's' : ''}`;
  return `${sec} seconds`;
}

function el(tag, className, html) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (html != null) n.innerHTML = html;
  return n;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function randInt(a, b) {
  return a + Math.floor(Math.random() * (b - a + 1));
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

/** A short buzz on supported hardware. iOS ignores it; harmless there. */
function haptic(ms = 12) {
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch { /* ignore */ }
  }
}

 */
function marketMult(id, t = Date.now()) {
  let h = 7;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 9973;
  const phase = (h / 9973) * Math.PI * 2;
  return 1 + 0.22 * Math.sin(phase + t / 900000) + 0.08 * Math.sin(phase * 3 + t / 300000);
}

function makeOrder() {
  const S = St.S;
  const pool = St.producibleItems();
  if (!pool.length) return null;
  const kinds = clamp(randInt(1, S.level < 5 ? 1 : S.level < 12 ? 2 : 3), 1, pool.length);
  const chosen = [];
  while (chosen.length < kinds) {
    const id = pick(pool);
    if (!chosen.includes(id)) chosen.push(id);
  }
  const items = {};
  let coins = 0, xp = 0;
  for (const id of chosen) {
    const it = D.ITEMS[id];
    // Cheap staples are asked for in bulk, expensive goods one or two at a time.
    const max = it.price < 50 ? 8 : it.price < 300 ? 5 : 3;
    const q = randInt(1, max);
    items[id] = q;
    coins += it.price * q;
    xp += it.xp * q;

    oid: uid(),
    items,
    coins: Math.round(coins * 1.4 * St.orderMult()),
    xp: Math.max(3, Math.round(xp * 1.8)),
    gems: Math.random() < 0.16 ? 1 : 0,

  if (!Array.isArray(S.orders)) S.orders = [];
  while (S.orders.length < D.ORDER_SLOTS) S.orders.push({ wait: 0 });
  S.orders.length = D.ORDER_SLOTS;
  for (let i = 0; i < S.orders.length; i++) {

    if (slot && slot.oid) continue;
    const until = slot && slot.wait ? slot.wait : 0;
    if (now() >= until) {
      const o = makeOrder();
      S.orders[i] = o || { wait: now() + 30000 };
    }
  }

  if (!St.removeAll(o.items)) { fail('You are missing some items', '📦'); return false; }
  St.earnCoins(o.coins);
  S.gems += o.gems;
  S.stats.orders += 1;
  gainXp(o.xp);
  S.orders[i] = { wait: now() + orderWait() };

  ok(`Order delivered! +${o.coins} coins`, '🚚');
  St.saveSoon();
  return true;
}

function tick() {

      soon.push(lockRow(m.icon, m.name, m.level,
        D.recipesFor(m.id).map(r => D.ITEMS[r.out].icon).join(' ')));
      continue;
    }

    if (!owned) {
      const row = el('div', 'row');
      row.innerHTML = `<div class="ic">${m.icon}</div><div class="body"><b>${m.name}</b>
        <small>Makes ${D.recipesFor(m.id).map(r => D.ITEMS[r.out].name).join(', ')}</small></div>`;
      const b = el('button', 'btn btn-sm btn-green', `🔨 ${fmt(m.cost)}`);
      b.disabled = S.coins < m.cost;
      b.onclick = () => { haptic(); G.buyMachine(m.id); render(); };
      row.appendChild(b);
      frag.appendChild(panel(null, row));
      continue;
    }

    frag.appendChild(machinePanel(m));
  }
  if (soon.length) frag.appendChild(panel(`<em>🔒</em>Coming Soon`, ...soon));
  return frag;
}

function machinePanel(m) {
  const S = St.S;
  const head = `<em>${m.icon}</em>${m.name}<span class="spacer"></span>`;
  const slots = el('div', 'slots');
  const list = el('div');
  list.style.marginTop = '10px';

  const cap = St.queueCap();
  for (let i = 0; i < cap; i++) slots.appendChild(slotTile(m.id, i));

  for (const r of D.recipesFor(m.id)) {
    const out = D.ITEMS[r.out];
    const locked = r.level > S.level;
    const row = el('div', 'row' + (locked ? ' locked' : ''));
    const ing = el('div', 'chips');
    row.innerHTML = `<div class="ic">${out.icon}</div>`;
    const body = el('div', 'body');
    body.innerHTML = `<b>${out.name}${r.qty > 1 ? ' ×' + r.qty : ''}</b>
      <small>${locked ? '🔒 Level ' + r.level : `⏱ ${fmtTime(G.craftTime(r))} · 🪙${fmt(G.sellPrice(r.out))} · +${out.xp} XP`}</small>`;
    body.appendChild(ing);
    row.appendChild(body);

    const btn = el('button', 'btn btn-sm btn-green', '🔨 Make');
    btn.onclick = () => { haptic(); G.enqueue(m.id, r.id); render(); };
    row.appendChild(btn);

    T(() => {
      ing.innerHTML = '';
      for (const [id, q] of Object.entries(r.in)) {
        const have = St.count(id);
        ing.appendChild(el('span', 'chip ' + (have >= q ? 'done' : 'miss'),
          have >= q ? `${D.ITEMS[id].icon} ×${q}` : `${D.ITEMS[id].icon} ${have}/${q}`));
      }
      const full = S.machines[m.id].queue.length >= St.queueCap();
      btn.disabled = locked || full || !St.hasAll(r.in);
      btn.textContent = full ? '⏳ Full' : '🔨 Make';
    });
    list.appendChild(row);
  }
  return panel(head, slots, list);
}

function slotTile(machineId, i) {
  const b = el('button', 'slot');
  b.onclick = () => {
    const m = St.S.machines[machineId];
    const job = m.queue[i];
    if (!job) return;
    haptic();
    if (G.jobReady(job)) { G.collectJob(machineId, job.jid); render(); }
    else {
      const r = D.RECIPES.find(x => x.id === job.recipe);
      speedSheet(D.ITEMS[r.out].name, () => { if (G.speedUpJob(machineId, job.jid)) render(); },
        (job.end - now()) / 1000, D.ITEMS[r.out]);
    }
  };
  T(() => {
    const m = St.S.machines[machineId];
    const job = m.queue[i];
    if (!job) { b.className = 'slot'; b.innerHTML = '<span style="opacity:.35">＋</span>'; return; }
    const r = D.RECIPES.find(x => x.id === job.recipe);
    const out = D.ITEMS[r.out];
    const ready = G.jobReady(job);
    b.className = 'slot ' + (ready ? 'done' : 'busy');
    const total = Math.max(1, job.end - job.start);
    const pct = clamp((now() - job.start) / total, 0, 1) * 100;
    b.innerHTML = `<span class="ring" style="--p:${pct.toFixed(0)}%"></span><span>${out.icon}</span>
      <span class="tag">${ready ? 'TAP!' : fmtTime((job.end - now()) / 1000)}</span>`;
  });
  return b;
}

/* -------------------------------- ORDERS --------------------------------- */

const CUSTOMERS = ['👨‍🍳', '👵', '🧑‍🎤', '👮', '🧑‍🏫', '👨‍🔧', '🧕', '🧑‍🚀', '💁', '🧙'];

function ordersView() {
  const S = St.S;
  const frag = document.createDocumentFragment();
  const p = panel(`<em>📋</em>Order Board<span class="spacer"></span>`);
  p.appendChild(el('div', 'muted',
    'Fill a crate to earn far more than selling piece by piece. Decline anything you cannot make — a new order arrives sooner.'));
  frag.appendChild(p);

  S.orders.forEach((o, i) => {
    if (!o || !o.oid) {
      const w = el('div', 'order wait');
      T(() => {
        const left = ((o && o.wait ? o.wait : 0) - now()) / 1000;
        w.innerHTML = `🚚 New order in ${fmtTime(Math.max(0, left))}`;
      });
      frag.appendChild(w);
      return;
    }
    frag.appendChild(orderCard(o, i));
  });
  return frag;
}

function orderCard(o, i) {
  const card = el('div', 'order');
  const face = CUSTOMERS[(o.oid.charCodeAt(0) + i) % CUSTOMERS.length];
  const top = el('div', 'order-top');
  top.innerHTML = `<span class="who">${face}</span>
    <div class="body" style="flex:1"><b>Order #${o.oid.slice(0, 4).toUpperCase()}</b>
      <small class="muted">🪙 ${fmt(o.coins)} · +${o.xp} XP${o.gems ? ` · 💎 ${o.gems}` : ''}</small></div>`;
  card.appendChild(top);

  const reqs = el('div', 'order-req');
  card.appendChild(reqs);

  const btns = el('div', 'btn-row');
  btns.style.marginTop = '10px';
  const deliver = el('button', 'btn btn-sm btn-green', '🚚 Deliver');
  deliver.onclick = () => { haptic(); G.deliverOrder(o.oid); render(); };
  const decline = el('button', 'btn btn-sm', '✖️ Decline');
  decline.style.flex = '0 0 auto';
  decline.onclick = () => { haptic(); G.declineOrder(o.oid); render(); };
  btns.append(deliver, decline);
  card.appendChild(btns);

  T(() => {
    reqs.innerHTML = '';
    for (const [id, q] of Object.entries(o.items)) {
      const have = St.count(id);
      const r = el('div', 'req' + (have >= q ? '' : ' miss'));
      r.innerHTML = `<em>${D.ITEMS[id].icon}</em><b>${Math.min(have, q)}/${q}</b>`;
      reqs.appendChild(r);
    }
    deliver.disabled = !G.canDeliver(o);
  });
  return card;
}

    row.appendChild(b);
    daily.appendChild(row);
  } else {
    daily.appendChild(el('div', 'muted',
      `Claimed today. Streak: ${streak} day${streak === 1 ? '' : 's'} — come back tomorrow to keep it going.`));
  }
  const dots = el('div', 'chips');
  for (let i = 1; i <= D.DAILY_MAX_STREAK; i++) {
    dots.appendChild(el('span', 'chip ' + (i <= streak ? 'done' : ''), i === D.DAILY_MAX_STREAK ? '🏅' : i));
  }

  /* goals */
  const p = panel(`<em>🏆</em>Farm Goals`);

  for (const g of D.GOALS) {
    const st = G.goalState(g);
    const row = el('div', 'row' + (st.done ? ' locked' : ''));
    const rank = st.done ? 'Legend' : D.GOAL_RANKS[st.claimed];
    const pct = clamp(st.value / st.target, 0, 1) * 100;
    row.innerHTML = `<div class="ic">${g.icon}</div><div class="body">
      <b>${g.name} · ${rank}</b>
      <small>${fmt(Math.min(st.value, st.target))} / ${fmt(st.target)} ${g.unit}</small>
      <span class="goalbar"><i style="width:${pct.toFixed(1)}%"></i></span></div>`;

      row.appendChild(el('span', 'chip done', '✔'));

  frag.appendChild(p);
  return frag;
}

function buyRow(icon, name, desc, cost, needLevel, onBuy) {
  const S = St.S;
  const r = el('div', 'row' + (needLevel ? ' locked' : ''));
  r.innerHTML = `<div class="ic">${icon}</div><div class="body"><b>${name}</b>
    <small>${needLevel ? '🔒 Unlocks at level ' + needLevel : desc}</small></div>`;
  const b = el('button', 'btn btn-sm btn-green', `🪙 ${fmt(cost)}`);
  b.disabled = !!needLevel || S.coins < cost;
  b.onclick = () => { haptic(); onBuy(); };
  r.appendChild(b);
  return r;
}

/** Market drift, as a chip class and a signed percentage. */
function trendClass(f) { return f >= 1.06 ? 'done' : f <= 0.94 ? 'miss' : ''; }
function trendLabel(f) {
  const pct = Math.round((f - 1) * 100);
  return `${pct > 0 ? '▲+' : pct < 0 ? '▼' : '='}${pct === 0 ? '' : pct + '%'}`;
}

/* -------------------------------- sheets --------------------------------- */

function openSheet(build) {
  const root = $('sheet-root');
  const back = el('div', 'backdrop');
  const sheet = el('div', 'sheet');
  sheet.appendChild(el('div', 'sheet-grab'));
  const close = () => { back.remove(); };
  build(sheet, close);
  back.appendChild(sheet);
  back.onclick = e => { if (e.target === back) close(); };
  root.appendChild(back);
  return close;
}

function sellSheet(kind) {
  const S = St.S;
  openSheet((sheet, close) => {
    const isSilo = kind === 'silo';
    sheet.appendChild(el('h2', null, isSilo ? '🛖 Sell Crops' : '🏠 Sell Goods'));
    sheet.appendChild(el('p', 'sub',
      'Tap to sell. Prices swing through the day — ▲ means better than usual.'));

    const list = el('div');
    const build = () => {
      list.innerHTML = '';
      const stock = isSilo ? S.silo : S.barn;
      const ids = Object.keys(stock).filter(id => stock[id] > 0);
      if (!ids.length) {
        list.appendChild(el('div', 'muted center', 'Nothing in here yet.'));
        return;
      }
      ids.sort((a, b) => D.ITEMS[a].price - D.ITEMS[b].price);
      for (const id of ids) {
        const it = D.ITEMS[id];
        const n = stock[id];
        const f = G.marketFactor(id);
        const row = el('div', 'row');
        row.innerHTML = `<div class="ic">${it.icon}</div><div class="body"><b>${it.name} × ${n}</b>
          <small>🪙 ${fmt(G.sellPrice(id))} each
          <span class="trend ${trendClass(f)}">${trendLabel(f)}</span></small></div>`;
        const one = el('button', 'btn btn-sm btn-gold', 'Sell 1');
        const all = el('button', 'btn btn-sm btn-green', `All 🪙${fmt(G.sellPrice(id) * n)}`);
        one.onclick = e => { haptic(); floatText(e, '+' + fmt(G.sell(id, 1)) + ' 🪙'); build(); refresh(); };
        all.onclick = e => { haptic(); floatText(e, '+' + fmt(G.sell(id, n)) + ' 🪙'); build(); refresh(); };
        row.append(one, all);
        list.appendChild(row);
      }
    };
    build();
    sheet.appendChild(list);

    const done = el('button', 'btn btn-big btn-blue', 'Done');
    done.style.marginTop = '10px';
    done.onclick = () => { close(); render(); };
    sheet.appendChild(done);
  });
}

function speedSheet(what, action, secLeft, item) {

}

/** A farm's whole save as a code you can paste on another phone. */
function transferSheet() {
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, '📤 Move your farm'));
    sheet.appendChild(el('p', 'sub',
      'Copy this code, then paste it into Load From Code on the other device. Your farm here is left alone.'));

    const box = el('textarea', 'fld code-box');
    box.readOnly = true;
    box.value = St.exportCode();
    box.onclick = () => box.select();
    sheet.appendChild(box);

    const copy = el('button', 'btn btn-big btn-green', '📋 Copy code');
    copy.style.marginTop = '10px';
    copy.onclick = async () => {
      haptic();
      box.select();
      try {
        await navigator.clipboard.writeText(box.value);
        toast('Code copied', '📋');
      } catch {
        // Clipboard is blocked in some in-app browsers; the selection still works.
        toast('Press and hold the code to copy', '📋');
      }
    };
    sheet.appendChild(copy);

    const done = el('button', 'btn btn-big btn-blue', 'Done');
    done.style.marginTop = '8px';
    done.onclick = close;
    sheet.appendChild(done);
  });
}

function confirmSheet(title, body, onYes) {
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, title));
    sheet.appendChild(el('p', 'sub', body));
    const yes = el('button', 'btn btn-big btn-red', 'Yes, do it');
    yes.onclick = () => { close(); onYes(); };
    const no = el('button', 'btn btn-big', 'Cancel');
    no.style.marginTop = '8px';
    no.onclick = close;

/* ------------------------------- feedback -------------------------------- */

function toast(msg, icon, bad) {
  const t = el('div', 'toast' + (bad ? ' bad' : ''), `${icon ? icon + ' ' : ''}${msg}`);
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2300);
}

function floatText(e, text) {
  const f = el('div', 'float', text);
  const x = e && e.clientX ? e.clientX : innerWidth / 2;
  const y = e && e.clientY ? e.clientY : innerHeight / 2;
  f.style.left = x + 'px';
  f.style.top = y + 'px';
  f.style.transform = 'translate(-50%, 0)';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

/** What the player just earned the right to do. */
function unlocksAt(level) {
  const out = [];
  for (const c of D.CROPS) if (c.level === level) out.push(`${c.icon} ${c.name}`);
  for (const a of D.ANIMALS) if (a.level === level) out.push(`${a.icon} ${a.name}`);
  for (const m of D.MACHINES) if (m.level === level) out.push(`${m.icon} ${m.name}`);
  for (const r of D.RECIPES) if (r.level === level && !D.MACHINES.some(m => m.level === level && m.id === r.machine)) {
    out.push(`${D.ITEMS[r.out].icon} ${D.ITEMS[r.out].name}`);
  }
  for (const u of D.UPGRADES) if (u.level === level) out.push(`${u.icon} ${u.name}`);
  const owned = St.S.plots.length;
  if (owned < D.MAX_PLOTS && D.plotLevel(owned) === level) out.push('🚧 New field');
  return out;
}

function levelUpSplash(level) {
  SFX.levelUp();
  const wrap = el('div', 'levelup');
  const card = el('div', 'card');
  const unlocks = unlocksAt(level);
  const newTitle = D.titleFor(level) !== D.titleFor(level - 1);
  card.innerHTML = `<div class="big">🎉</div><h2>Level ${level}!</h2>
    <p>${newTitle ? `You are now a ${D.titleFor(level)} · ` : ''}+🪙${fmt(level * 120)} · +💎${level % 5 === 0 ? 3 : 1}</p>
    ${unlocks.length ? `<div class="unlock-list">${unlocks.map(u => `<span class="chip">${u}</span>`).join('')}</div>` : ''}`;
  const b = el('button', 'btn btn-big btn-green', 'Nice!');
  b.onclick = () => { wrap.remove(); render(); };
  card.appendChild(b);
  wrap.appendChild(card);
  wrap.onclick = e => { if (e.target === wrap) { wrap.remove(); render(); } };
  document.body.appendChild(wrap);
}

function welcomeBack(info) {
  if (info.away < 120) return;
  const bits = [];
  if (info.ripe) bits.push(`${info.ripe} field${info.ripe > 1 ? 's' : ''} ripened`);
  if (info.ready) bits.push(`${info.ready} animal${info.ready > 1 ? 's' : ''} produced`);
  if (info.crafts) bits.push(`${info.crafts} craft${info.crafts > 1 ? 's' : ''} finished`);
  if (!bits.length) return;
  openSheet((sheet, close) => {
    sheet.appendChild(el('h2', null, '👋 Welcome back!'));
    sheet.appendChild(el('p', 'sub', `You were away for ${fmtSpan(info.away)}.`));
    const list = el('div');
    for (const b of bits) {
      const r = el('div', 'row');
      r.innerHTML = `<div class="ic">✅</div><div class="body"><b>${b}</b></div>`;
      list.appendChild(r);
    }
    sheet.appendChild(list);
    const go = el('button', 'btn btn-big btn-green', 'Back to the farm');
    go.style.marginTop = '10px';
    go.onclick = close;
    sheet.appendChild(go);
  });
}
return { setView, render, refresh, openSheet, toast, levelUpSplash, welcomeBack, get view() { return view; } };
})();

/* ---------- js/main.js ---------- */
const __mod_main = (function () {
const D = __mod_data;
const St = __mod_state;
const G = __mod_game;
const UI = __mod_ui;
const {setSound, unlockAudio} = __mod_audio;
const {el, fmt} = __mod_util;
/* ==========================================================================
   main.js — the title screen, onboarding, and the once-a-second heartbeat.
   ========================================================================== */








const $ = id => document.getElementById(id);

/* ------------------------------ title screen ----------------------------- */

/** "3 days ago" style, for the save list. */
function ago(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs > 1 ? 's' : ''} ago`;
  const days = Math.floor(hrs / 24);
  return `${days} day${days > 1 ? 's' : ''} ago`;
}

function showTitle() {
  const screen = $('title');
  screen.hidden = false;
  $('onboard').hidden = true;
  $('app').hidden = true;

  const list = $('slots');
  list.innerHTML = '';

  for (const s of St.slotSummaries()) {
    const card = el('button', 'slot-card' + (s.empty ? ' empty' : ''));
    card.type = 'button';
    card.innerHTML = s.empty
      ? `<span class="face">＋</span><span class="who"><b>New Farm</b>
         <small>Save ${s.i + 1} · empty</small></span>`
      : `<span class="face">${s.avatar}</span><span class="who"><b>${s.name}</b>
         <small>Level ${s.level} · 🪙 ${fmt(s.coins)} · played ${ago(s.played)}</small></span>`;
    card.onclick = () => {
      unlockAudio();
      if (s.empty) showOnboarding(s.i);
      else if (St.load(s.i)) boot();
    };
    list.appendChild(card);

    if (!s.empty) {
      const del = el('button', 'slot-del', '🗑️');
      del.type = 'button';
      del.title = `Delete save ${s.i + 1}`;
      del.onclick = e => {
        e.stopPropagation();
        if (confirm(`Delete ${s.name}'s farm? This cannot be undone.`)) {
          St.deleteSlot(s.i);
          showTitle();
        }
      };
      card.appendChild(del);
    }
  }

  $('load-code').onclick = () => {
    const code = prompt('Paste the farm code from your other device:');
    if (!code) return;
    const target = St.slotSummaries().find(s => s.empty);
    if (!target) { alert('All three saves are full. Delete one first.'); return; }
    const err = St.importCode(code, target.i);
    if (err) alert(err);
    else boot();
  };
}

/* ------------------------------ onboarding ------------------------------- */

function showOnboarding(slot) {
  const ob = $('onboard');
  $('title').hidden = true;
  ob.hidden = false;
  let avatar = D.AVATARS[0];

  const grid = $('ob-avatars');
  grid.innerHTML = '';
  D.AVATARS.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'av' + (i === 0 ? ' on' : '');
    b.type = 'button';
    b.textContent = a;
    b.onclick = () => {
      avatar = a;
      [...grid.children].forEach(c => c.classList.toggle('on', c === b));
    };
    grid.appendChild(b);
  });

  $('ob-start').onclick = () => {
    unlockAudio();
    const name = ($('ob-name').value || '').trim().slice(0, 14) || 'Farmer';
    St.startNew(name, avatar, slot);
    boot();
  };
}

/* --------------------------------- boot ---------------------------------- */

let started = false;

function boot() {
  const S = St.S;
  setSound(S.settings.sound !== false);
  $('title').hidden = true;
  $('onboard').hidden = true;
  $('app').hidden = false;

  if (!started) {
    started = true;
    G.on('toast', t => UI.toast(t.msg, t.icon, t.bad));
    G.on('levelup', lv => UI.levelUpSplash(lv));

    // Heartbeat: advance the world, then repaint the cheap bits.
    setInterval(() => {
      G.tick();
      UI.refresh();
    }, 1000);

    // Timers are all timestamp-based, so a backgrounded tab catches up instantly.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) St.save();
      else { G.tick(); UI.render(); }
    });
    window.addEventListener('pagehide', St.save);
    window.addEventListener('blur', St.save);

    // iOS only starts audio inside a user gesture.
    document.addEventListener('pointerdown', unlockAudio, { once: true });

    // Kill the pull-to-refresh / rubber-band bounce on the game surface.
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  }

  const info = G.settleOffline();
  UI.setView('farm');
  UI.welcomeBack(info);
}

/* --------------------------------- start --------------------------------- */

showTitle();
return {  };
})();
</script>
