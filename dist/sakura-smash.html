<title>Sakura Smash 桜スマッシュ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
/* ============================================================
   SAKURA SMASH — 桜スマッシュ
   Original anime-inspired UI theme. All art is drawn in code.
   ============================================================ */

:root{
  --ink:#160c2c;
  --ink-2:#241546;
  --ink-3:#33205e;
  --paper:#fdf4e6;
  --paper-2:#f3e2cd;
  --sakura:#ff5f9e;
  --sakura-deep:#d92b6b;
  --gold:#ffcf5c;
  --gold-deep:#e39a1c;
  --jade:#4be3c8;
  --sky:#63b6ff;
  --violet:#a56bff;
  --danger:#ff5a5a;
  --ok:#5ce08a;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --font-ui:"Avenir Next","Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;}
body{
  font-family:var(--font-ui);
  background:var(--ink);
  color:var(--paper);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
  font-weight:700;
}
canvas{display:block;}
button{font-family:inherit;font-weight:800;color:inherit;border:0;background:none;cursor:pointer;}

#app{position:fixed;inset:0;overflow:hidden;}

/* --- animated night-sky backdrop shared by all menu screens --- */
.screen{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% -10%, #4a2170 0%, rgba(74,33,112,0) 60%),
    radial-gradient(90% 60% at 100% 100%, #2b1550 0%, rgba(43,21,80,0) 55%),
    linear-gradient(180deg,#1d1038 0%, #160c2c 55%, #120922 100%);
}
.screen.active{display:flex;}
.screen.sub{z-index:20;}

.screen::before{ /* soft washi paper grain */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.7) 0 1px, transparent 1.6px),
    radial-gradient(circle at 70% 65%, rgba(255,255,255,.5) 0 1px, transparent 1.6px),
    radial-gradient(circle at 45% 85%, rgba(255,255,255,.45) 0 1px, transparent 1.6px);
  background-size:180px 180px,220px 220px,140px 140px;
  mix-blend-mode:overlay;
}
.screen::after{ /* drifting sakura haze */
  content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.5;
  background:
    radial-gradient(circle at 12% 22%, rgba(255,95,158,.20) 0, transparent 26%),
    radial-gradient(circle at 88% 12%, rgba(165,107,255,.20) 0, transparent 24%),
    radial-gradient(circle at 60% 92%, rgba(75,227,200,.14) 0, transparent 28%);
  animation:haze 22s ease-in-out infinite alternate;
}
@keyframes haze{from{transform:translate3d(-2%,-1%,0) scale(1);}to{transform:translate3d(3%,2%,0) scale(1.08);}}

/* ============ BOOT ============ */
/* Everything on this screen is sized against the *smaller* of the viewport's
   two axes, so the start button is reachable no matter how short or narrow
   the frame we are embedded in turns out to be. */
.boot{align-items:center;justify-content:center;z-index:60;cursor:pointer;}
.boot-inner{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:clamp(2px,1vh,6px);padding:clamp(10px,3vh,24px);
  max-width:100%;max-height:100%;overflow:hidden;
}
#boot-crest{
  width:min(200px,30vh,46vw);height:auto;flex-shrink:1;
  filter:drop-shadow(0 12px 30px rgba(255,95,158,.45));
  animation:crestIn .9s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes crestIn{from{transform:scale(.5) rotate(-25deg);opacity:0;}to{transform:none;opacity:1;}}

.logo{
  margin:clamp(4px,1.5vh,10px) 0 0;
  font-size:clamp(22px,min(9vw,5vh),48px);
  letter-spacing:.04em;line-height:.95;
  font-weight:900;font-style:italic;
  background:linear-gradient(180deg,#fff 0%,var(--gold) 48%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 0 rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;gap:.2em;
  max-width:100%;white-space:nowrap;
}
.logo em{font-style:italic;background:linear-gradient(180deg,#fff,var(--sakura) 60%,var(--sakura-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo-jp{font-family:var(--font-jp);-webkit-text-fill-color:var(--sakura);font-size:.8em;}
.boot-tag{font-family:var(--font-jp);letter-spacing:.4em;color:#c8b6e8;font-size:clamp(9px,2.6vw,12px);
  margin:clamp(2px,1vh,6px) 0 clamp(8px,2.5vh,20px);text-align:center;}
.boot-bar{width:min(200px,60vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);
  overflow:hidden;flex-shrink:0;}
.boot-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sakura),var(--gold));transition:width .3s;}
.btn-tap{margin-top:clamp(8px,2vh,18px);animation:pulse 1.4s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse{50%{transform:scale(1.05);}}

/* ============ BUTTONS ============ */
.btn{
  position:relative;border-radius:var(--r-md);padding:14px 22px;font-size:16px;letter-spacing:.08em;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .09s ease, filter .15s ease;
  text-transform:uppercase;
}
.btn:active{transform:translateY(3px) scale(.985);}
.btn small{font-size:10px;opacity:.85;letter-spacing:.12em;font-weight:700;text-transform:none;}
.btn .jp{font-family:var(--font-jp);font-size:11px;letter-spacing:.3em;opacity:.9;}

.btn-primary{
  background:linear-gradient(180deg,#ff86b8 0%,var(--sakura) 40%,var(--sakura-deep) 100%);
  box-shadow:0 6px 0 #9c1b4c, 0 12px 24px rgba(217,43,107,.45), inset 0 2px 0 rgba(255,255,255,.5);
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28);
}
.btn-primary:active{box-shadow:0 3px 0 #9c1b4c, 0 6px 14px rgba(217,43,107,.4), inset 0 2px 0 rgba(255,255,255,.4);}

.btn-gold{
  background:linear-gradient(180deg,#ffe6a3 0%,var(--gold) 40%,var(--gold-deep) 100%);
  box-shadow:0 6px 0 #a86a08, 0 12px 22px rgba(227,154,28,.4), inset 0 2px 0 rgba(255,255,255,.6);
  color:#5a3403;text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.btn-gold:active{box-shadow:0 3px 0 #a86a08, inset 0 2px 0 rgba(255,255,255,.5);}

.btn-ghost{
  background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.18);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08);
  color:#e9def7;font-size:13px;padding:11px 14px;
}
.btn-ghost:active{background:rgba(255,255,255,.14);}
.btn[disabled]{filter:grayscale(.7) brightness(.7);pointer-events:none;}

.icon-btn{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.16);color:#fff;
}
.icon-btn:active{background:rgba(255,255,255,.2);}

/* ============ TOP BAR ============ */
.topbar{
  position:relative;z-index:3;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
}
.player-chip{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14);
  border-radius:99px;padding:5px 14px 5px 5px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08);}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,var(--violet),var(--sakura));}
.player-meta{display:flex;flex-direction:column;line-height:1.15;}
.player-meta strong{font-size:14px;}
.league-line{font-size:10px;color:#c9b8e6;display:flex;align-items:center;gap:5px;font-weight:700;}
.league-dot{width:7px;height:7px;border-radius:50%;background:var(--sakura);box-shadow:0 0 8px var(--sakura);}

.currencies{margin-left:auto;display:flex;gap:6px;}
.cur{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 10px;border-radius:99px;
  background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.12);}
.cur i{font-style:normal;font-size:13px;}
.cur-gold{color:var(--gold);}
.cur-gem{color:var(--jade);}
.cur-trophy{color:#ffd9a0;}

/* ============ HOME ============ */
.home-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 12px 6px;min-height:0;}
/* The portrait is absolutely positioned inside the stage so it is always
   bounded by it — a percentage max-height on an auto-sized replaced element
   inside a flex item is not reliable enough to keep it from overlapping the
   buttons on a short screen. */
.home-stage{position:relative;flex:1 1 0;min-height:0;width:100%;overflow:hidden;}
#home-hero{position:absolute;inset:0;margin:auto;
  max-width:min(78vw,340px);max-height:100%;width:auto;height:auto;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));animation:float 4.5s ease-in-out infinite;}
@keyframes float{50%{transform:translateY(-12px);}}
.stage-glow{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  width:min(70vw,300px);height:34px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,95,158,.55), rgba(255,95,158,0) 70%);
  filter:blur(3px);animation:glowFloat 4.5s ease-in-out infinite;}
@keyframes glowFloat{50%{transform:translateX(-50%) translateY(6px) scaleX(.92);}
}
.home-hero-name{position:absolute;left:8px;bottom:2px;text-align:left;line-height:1.1;}
.home-hero-name strong{display:block;font-size:19px;font-style:italic;letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.4);}
.home-hero-name span{font-family:var(--font-jp);font-size:11px;color:#d3c0f0;letter-spacing:.2em;}

.battle-actions{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px;align-items:center;}
.btn-battle{width:100%;font-size:23px;padding:16px;letter-spacing:.14em;}
.mini-actions{display:flex;gap:8px;width:100%;}
.mini-actions .btn{flex:1;}

.chest-row{display:flex;gap:7px;width:100%;max-width:460px;margin-top:8px;}
.chest-slot{
  flex:1;aspect-ratio:1/1.08;border-radius:var(--r-md);position:relative;
  background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.16);
  display:grid;place-items:center;overflow:hidden;
}
.chest-slot.filled{border-style:solid;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));}
.chest-slot canvas{width:78%;height:auto;}
.chest-slot .chest-label{position:absolute;bottom:3px;font-size:9px;letter-spacing:.1em;color:#e6d9ff;text-shadow:0 1px 2px #000;}
.chest-slot .lock{font-size:20px;opacity:.35;}
.chest-slot.ready{animation:chestReady 1.6s ease-in-out infinite;}
@keyframes chestReady{50%{box-shadow:0 0 0 3px rgba(255,207,92,.5), 0 0 22px rgba(255,207,92,.5);}}

/* ============ TAB BAR ============ */
.tabbar{
  position:relative;z-index:3;display:flex;
  padding:6px calc(var(--safe-r) + 6px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 6px);
  background:linear-gradient(180deg,rgba(11,6,20,0),rgba(11,6,20,.85) 40%);
  border-top:2px solid rgba(255,255,255,.08);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;
  font-size:10px;letter-spacing:.06em;color:#9d8cc0;transition:.15s;}
.tab i{font-style:normal;font-size:21px;filter:grayscale(.5);transition:.15s;}
.tab.active{color:#fff;background:rgba(255,255,255,.09);}
.tab.active i{filter:none;transform:translateY(-2px) scale(1.1);}

/* ============ SUB SCREENS ============ */
.subbar{
  position:relative;z-index:3;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
  border-bottom:2px solid rgba(255,255,255,.08);
}
.subbar h2{margin:0;font-size:17px;font-style:italic;letter-spacing:.08em;display:flex;flex-direction:column;line-height:1;}
.subbar h2 .jp{font-family:var(--font-jp);font-size:10px;font-style:normal;letter-spacing:.3em;color:var(--sakura);}
.power-chip{margin-left:auto;font-size:11px;padding:7px 12px;border-radius:99px;background:rgba(0,0,0,.3);
  border:2px solid rgba(255,255,255,.12);letter-spacing:.1em;color:#e2d5ff;}
.power-chip b{color:var(--gold);}
.back{font-size:28px;line-height:0;padding-bottom:4px;}

.scroll{
  position:relative;z-index:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 26px) calc(var(--safe-l) + 12px);
}
.hint{font-size:12px;color:#b6a5d6;margin:0 0 12px;font-weight:700;letter-spacing:.03em;}
.section-title{font-size:13px;letter-spacing:.16em;margin:20px 0 10px;color:#d9c9ff;display:flex;align-items:center;gap:8px;}
.section-title .jp{font-family:var(--font-jp);color:var(--sakura);font-size:11px;letter-spacing:.3em;}
.section-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.2),transparent);}

/* ============ HERO CARDS ============ */
.team-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;}
.hero-grid.big{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));}

.card{
  position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:3/4;
  background:linear-gradient(180deg,#3a2560,#241540);
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 5px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.12);
  display:flex;flex-direction:column;transition:transform .1s;
}
.card:active{transform:translateY(3px) scale(.98);}
.card.empty{background:rgba(255,255,255,.05);border-style:dashed;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.3);box-shadow:none;}
.card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,92,.45),0 5px 0 rgba(0,0,0,.4);}
.card.locked{filter:grayscale(.85) brightness(.62);}
.card.deployed{opacity:.45;}
.card canvas{width:100%;flex:1;min-height:0;object-fit:contain;}
.card .card-name{
  font-size:9.5px;text-align:center;padding:3px 2px 4px;letter-spacing:.06em;
  background:rgba(0,0,0,.42);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .card-lvl{position:absolute;top:4px;left:4px;font-size:9px;padding:2px 6px;border-radius:99px;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);}
.card .card-rarity{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 26px 26px 0;}
.card .card-cards{position:absolute;bottom:20px;left:4px;right:4px;height:5px;border-radius:99px;background:rgba(0,0,0,.55);overflow:hidden;}
.card .card-cards i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--jade));}
.card .card-up{position:absolute;top:4px;right:4px;font-size:14px;animation:pulse 1.2s infinite;}

.r-common{border-color:#9fb4cc;}   .r-common .card-rarity{border-color:transparent #9fb4cc transparent transparent;}
.r-rare{border-color:#5ec8ff;}     .r-rare .card-rarity{border-color:transparent #5ec8ff transparent transparent;}
.r-epic{border-color:#c07bff;}     .r-epic .card-rarity{border-color:transparent #c07bff transparent transparent;}
.r-legend{border-color:var(--gold);} .r-legend .card-rarity{border-color:transparent var(--gold) transparent transparent;}
.r-legend{box-shadow:0 5px 0 rgba(0,0,0,.4), 0 0 18px rgba(255,207,92,.35), inset 0 2px 0 rgba(255,255,255,.15);}

/* ============ HERO DETAIL ============ */
.detail-top{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.detail-art{width:44%;max-width:190px;border-radius:var(--r-md);background:radial-gradient(circle at 50% 30%,#4a2e7a,#211339);
  border:2px solid rgba(255,255,255,.16);}
.detail-info{flex:1;min-width:0;}
.detail-info h3{margin:0 0 2px;font-size:22px;font-style:italic;}
.detail-info .jp-name{font-family:var(--font-jp);color:var(--sakura);letter-spacing:.24em;font-size:12px;}
.detail-info p{font-size:12px;line-height:1.5;color:#cbbbe8;font-weight:600;margin:8px 0 0;}
.stat-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:11px;letter-spacing:.08em;}
.stat-row span{width:64px;color:#b8a7d8;}
.stat-bar{flex:1;height:9px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.stat-bar i{display:block;height:100%;border-radius:99px;}
.stat-row b{width:34px;text-align:right;}
.bar-hp i{background:linear-gradient(90deg,#5ce08a,#2fae63);}
.bar-atk i{background:linear-gradient(90deg,#ff8a5c,#e04a2f);}
.bar-wt i{background:linear-gradient(90deg,#9db8ff,#5a76e0);}
.bar-cd i{background:linear-gradient(90deg,#c07bff,#7a3fd6);}

.ability-box{background:rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.14);border-radius:var(--r-md);padding:12px 14px;margin-top:12px;}
.ability-box h4{margin:0 0 4px;font-size:14px;color:var(--gold);letter-spacing:.06em;display:flex;align-items:center;gap:8px;}
.ability-box h4 .jp{font-family:var(--font-jp);font-size:11px;color:var(--sakura);letter-spacing:.2em;}
.ability-box p{margin:0;font-size:12px;line-height:1.55;color:#d6c9ef;font-weight:600;}
.upgrade-bar{display:flex;gap:10px;align-items:center;margin-top:14px;}
.upgrade-bar .btn{flex:1;}

/* ============ SHOP ============ */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.shop-item{border-radius:var(--r-md);padding:12px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.16);box-shadow:0 5px 0 rgba(0,0,0,.35);}
.shop-item canvas{width:76%;height:auto;margin:2px auto 6px;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));}
.shop-item h4{margin:0;font-size:13px;letter-spacing:.06em;}
.shop-item .sub{font-size:10px;color:#c3b2e2;margin:2px 0 9px;font-weight:600;min-height:24px;}
.shop-item .btn{width:100%;padding:9px;font-size:13px;}

/* ============ SETTINGS ============ */
.set-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);margin-bottom:9px;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);}
.set-row .lbl{flex:1;}
.set-row .lbl b{display:block;font-size:14px;}
.set-row .lbl small{font-size:11px;color:#b3a2d4;font-weight:600;}
.switch{width:54px;height:30px;border-radius:99px;background:rgba(0,0,0,.5);position:relative;border:2px solid rgba(255,255,255,.16);}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#8c7aa8;transition:.18s;}
.switch.on{background:linear-gradient(90deg,var(--sakura-deep),var(--sakura));}
.switch.on i{left:26px;background:#fff;}

/* ============ BATTLE ============ */
.battle{background:#0b0618;}
#arena{position:absolute;inset:0;width:100%;height:100%;}
.battle-ui{position:absolute;inset:0;pointer-events:none;z-index:5;
  padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 10px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 10px);
  display:flex;flex-direction:column;}
.team-bar{display:flex;gap:6px;}
.team-bar.bottom{margin-top:auto;}
.pip{
  flex:1;max-width:88px;border-radius:12px;padding:3px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.pip canvas{width:100%;height:34px;object-fit:contain;}
.pip .hp{height:5px;border-radius:99px;background:rgba(0,0,0,.6);overflow:hidden;margin-top:2px;}
.pip .hp i{display:block;height:100%;background:linear-gradient(90deg,#5ce08a,#2fae63);transition:width .25s;}
.pip.foe .hp i{background:linear-gradient(90deg,#ff7b7b,#d63232);}

// Small math helpers shared by physics, AI and rendering.

const TAU = Math.PI * 2;

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
const smoothstep = (t) => t * t * (3 - 2 * t);

const dist2 = (ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay;
  return dx * dx + dy * dy;
};
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

const len = (x, y) => Math.sqrt(x * x + y * y);

function norm(x, y) {
  const l = Math.sqrt(x * x + y * y) || 1;
  return [x / l, y / l];
}

const angleOf = (x, y) => Math.atan2(y, x);

// Shortest signed difference between two angles.
function angleDelta(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;

  const t = clamp((apx * abx + apy * aby) / abLen2, 0, 1);
  return dist(px, py, ax + abx * t, ay + aby * t);
}

const rad = (d) => (d * Math.PI) / 180;

// Exponential decay that is stable regardless of frame time.
const damp = (rate, dt) => Math.pow(rate, dt);

function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';

}

  ctx.beginPath();
  ell(ctx, x + w * 0.34, y + hh * 0.36, w * 0.14, hh * 0.16);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();

  // upper shadow inside the eye
  ctx.beginPath();
  ctx.moveTo(x - w * 1.2, y - hh * 1.2);
  ctx.lineTo(x + w * 1.2, y - hh * 1.2);
  ctx.lineTo(x + w * 1.2, y - hh * 0.42);
  ctx.quadraticCurveTo(x, y - hh * 0.1, x - w * 1.2, y - hh * 0.5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(43,26,63,.28)'; ctx.fill();
  ctx.restore();

  // a relaxed / winking eye gets a real skin-coloured lid over the top half
  if (lidDrop > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w * 1.15, y - hh * 1.3);
    ctx.lineTo(x + w * 1.15, y - hh * 1.3);
    ctx.lineTo(x + w * 1.15, y - hh + lidDrop);
    ctx.quadraticCurveTo(x, y - hh * 0.5 + lidDrop, x - w * 1.15, y - hh + lidDrop);
    ctx.closePath();
    ctx.fillStyle = art.skin;
    ctx.fill();
    ctx.restore();
  }

  // lash line — thick on top, thin below
  shape(ctx, () => {
    ctx.moveTo(x - w * 1.03, y + hh * 0.1 - lidDrop * 0.2);
    ctx.quadraticCurveTo(x - w * 0.7, y - hh * 1.1 + lidDrop, x + w * 0.18, y - hh * 1.02 + lidDrop);
    ctx.quadraticCurveTo(x + w * 1.02, y - hh * 0.72 + lidDrop, x + w * 0.95, y + hh * 0.18 - lidDrop * 0.2);
  }, null, 3.4);
  shape(ctx, () => {
    ctx.moveTo(x - w * 0.95, y + hh * 0.22);
    ctx.quadraticCurveTo(x + w * 0.25, y + hh * 0.92, x + w * 0.9, y + hh * 0.24);
  }, null, 1.5);
}

function drawBrow(ctx, x, y, w, side, expr) {
  let tilt = 0;
  if (expr === 'angry') tilt = side * 0.42;
  if (expr === 'determined') tilt = side * 0.3;
  if (expr === 'smug') tilt = side * 0.22;
  if (expr === 'calm') tilt = -side * 0.1;
  shape(ctx, () => {
    ctx.moveTo(x - w, y + tilt * w * 0.55);
    ctx.quadraticCurveTo(x, y - w * 0.4 + tilt * w * 0.1, x + w, y - tilt * w * 0.35);
  }, null, 2.1);
}

function drawMouth(ctx, x, y, s, expr) {
  switch (expr) {
    case 'happy':
      shape(ctx, () => {
        ctx.moveTo(x - s * 0.6, y - s * 0.1);
        ctx.quadraticCurveTo(x, y + s * 0.95, x + s * 0.6, y - s * 0.1);
        ctx.quadraticCurveTo(x, y + s * 0.25, x - s * 0.6, y - s * 0.1);
        ctx.closePath();
      }, '#8c2f4d', 2);
      break;
    case 'angry':
      shape(ctx, () => {
        ctx.moveTo(x - s * 0.75, y - s * 0.25);
        ctx.lineTo(x - s * 0.25, y + s * 0.45);
        ctx.lineTo(x + s * 0.2, y - s * 0.2);
        ctx.lineTo(x + s * 0.7, y + s * 0.4);
        ctx.lineTo(x + s * 0.75, y - s * 0.3);
        ctx.quadraticCurveTo(x, y - s * 0.75, x - s * 0.75, y - s * 0.25);
        ctx.closePath();
      }, '#7d2436', 2);
      break;
    case 'smug':
      shape(ctx, () => {
        ctx.moveTo(x - s * 0.5, y + s * 0.2);
        ctx.quadraticCurveTo(x + s * 0.1, y + s * 0.45, x + s * 0.65, y - s * 0.25);
      }, null, 2.3);
      break;
    case 'cool':
      shape(ctx, () => {
        ctx.moveTo(x - s * 0.42, y + s * 0.05);
        ctx.lineTo(x + s * 0.42, y + s * 0.05);
      }, null, 2.3);
      break;
    case 'determined':
      shape(ctx, () => {
        ctx.moveTo(x - s * 0.5, y + s * 0.1);
        ctx.quadraticCurveTo(x, y - s * 0.28, x + s * 0.5, y + s * 0.12);
      }, null, 2.5);
      break;
    default: // calm
      shape(ctx, () => {
        ctx.moveTo(x - s * 0.35, y);
        ctx.quadraticCurveTo(x, y + s * 0.42, x + s * 0.35, y);
      }, null, 2.2);
      break;
  }
}

/* --------------------------------- head --------------------------------- */

function drawEars(ctx, art, hx, hy, hr) {
  const kind = art.ears;
  if (!kind) return;
  const furA = art.hair, furB = art.hair2 || shade(art.hair, -0.3);
  const inner = kind === 'cat' ? '#ffb6c8' : '#f7d5b0';
  for (const s of [-1, 1]) {
    const bx = hx + s * hr * 0.66, by = hy - hr * 0.86;
    shape(ctx, () => {
      ctx.moveTo(bx - hr * 0.3, by + hr * 0.24);
      ctx.quadraticCurveTo(bx + s * hr * 0.06, by - hr * 0.78, bx + hr * 0.34, by + hr * 0.18);
      ctx.quadraticCurveTo(bx, by + hr * 0.34, bx - hr * 0.3, by + hr * 0.24);
      ctx.closePath();
    }, s < 0 ? furA : furB);
    shape(ctx, () => {
      ctx.moveTo(bx - hr * 0.14, by + hr * 0.16);
      ctx.quadraticCurveTo(bx + s * hr * 0.04, by - hr * 0.42, bx + hr * 0.17, by + hr * 0.13);
      ctx.closePath();
    }, inner, 0);
  }
}

function drawHorns(ctx, art, hx, hy, hr) {
  for (const s of [-1, 1]) {
    shape(ctx, () => {
      const bx = hx + s * hr * 0.78, by = hy - hr * 0.72;
      ctx.moveTo(bx - s * hr * 0.16, by + hr * 0.16);
      ctx.quadraticCurveTo(bx + s * hr * 0.5, by - hr * 0.5, bx + s * hr * 0.28, by - hr * 0.92);
      ctx.quadraticCurveTo(bx + s * hr * 0.02, by - hr * 0.42, bx - s * hr * 0.2, by - hr * 0.02);
      ctx.closePath();
    }, '#f6e7cf');
  }
}

function drawHead(ctx, art, hx, hy, hr, expr) {
  const skin = art.skin;
  backHair(ctx, art, hx, hy, hr);
  if (art.ears) drawEars(ctx, art, hx, hy, hr);
  if (art.horns) drawHorns(ctx, art, hx, hy, hr);

  // face
  shape(ctx, () => {
    ctx.moveTo(hx - hr, hy - hr * 0.12);
    ctx.quadraticCurveTo(hx - hr, hy + hr * 0.74, hx, hy + hr * 1.06);
    ctx.quadraticCurveTo(hx + hr, hy + hr * 0.74, hx + hr, hy - hr * 0.12);
    ctx.quadraticCurveTo(hx + hr * 0.9, hy - hr * 1.06, hx, hy - hr * 1.08);
    ctx.quadraticCurveTo(hx - hr * 0.9, hy - hr * 1.06, hx - hr, hy - hr * 0.12);
    ctx.closePath();
  }, skin);

  // gentle cel shadow on the shaded side only — never across the whole face
  ctx.save();
  ctx.beginPath();
  ell(ctx, hx, hy, hr * 0.99, hr * 1.05);
  ctx.clip();
  const sg = ctx.createLinearGradient(hx + hr * 0.45, hy, hx + hr * 1.05, hy);
  sg.addColorStop(0, 'rgba(0,0,0,0)');
  sg.addColorStop(1, withAlpha(shade(skin, -0.3), 0.42));
  ctx.fillStyle = sg;
  ctx.fillRect(hx - hr * 1.2, hy - hr * 1.2, hr * 2.4, hr * 2.4);
  // soft shadow cast by the fringe
  const fg = ctx.createLinearGradient(hx, hy - hr * 0.9, hx, hy - hr * 0.1);
  fg.addColorStop(0, withAlpha(shade(skin, -0.35), 0.5));
  fg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = fg;
  ctx.fillRect(hx - hr * 1.2, hy - hr * 1.2, hr * 2.4, hr * 1.3);
  ctx.restore();

  const eyeY = hy + hr * 0.26;
  const eyeDX = hr * 0.45;
  const eyeW = hr * 0.33, eyeH = hr * 0.38;

  drawEye(ctx, hx - eyeDX, eyeY, eyeW, eyeH, art, -1, expr);
  drawEye(ctx, hx + eyeDX, eyeY, eyeW, eyeH, art, 1, expr);
  drawBrow(ctx, hx - eyeDX, eyeY - hr * 0.34, hr * 0.2, -1, expr);
  drawBrow(ctx, hx + eyeDX, eyeY - hr * 0.34, hr * 0.2, 1, expr);

  // blush
  ctx.save();
  ctx.globalAlpha = 0.42;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ell(ctx, hx + s * hr * 0.72, eyeY + hr * 0.3, hr * 0.19, hr * 0.1);
    ctx.fillStyle = '#ff7ba3'; ctx.fill();
  }
  ctx.restore();

  // nose dot + mouth
  ctx.beginPath();
  ell(ctx, hx + hr * 0.03, eyeY + hr * 0.36, hr * 0.03, hr * 0.045);
  ctx.fillStyle = withAlpha(shade(skin, -0.5), 0.6); ctx.fill();
  drawMouth(ctx, hx, eyeY + hr * 0.58, hr * 0.19, expr);

  if (art.mask) {
    shape(ctx, () => {
      ctx.moveTo(hx - hr * 0.94, eyeY + hr * 0.42);
      ctx.quadraticCurveTo(hx, eyeY + hr * 0.24, hx + hr * 0.94, eyeY + hr * 0.42);
      ctx.quadraticCurveTo(hx + hr * 0.78, hy + hr * 1.04, hx, hy + hr * 1.12);
      ctx.quadraticCurveTo(hx - hr * 0.78, hy + hr * 1.04, hx - hr * 0.94, eyeY + hr * 0.42);
      ctx.closePath();
    }, art.outfit2 || '#4a4a6a');
  }

  frontHair(ctx, art, hx, hy, hr);

  if (art.halo) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ell(ctx, hx, hy - hr * 1.52, hr * 0.85, hr * 0.22);
    ctx.strokeStyle = art.accent; ctx.lineWidth = 3.2; ctx.stroke();
    ctx.restore();
  }
}

/* -------------------------------- weapons -------------------------------- */

function drawWeapon(ctx, art, x, y, s, behind) {
  const kind = art.weapon;
  if (!kind || kind === 'none') return;
  const metal = '#e8eef7', dark = '#4a4a6a';

  if (behind) {
    if (kind === 'katana') {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(-0.62);
      shape(ctx, () => { capsule(ctx, -s * 0.1, 0, s * 1.5, 0, s * 0.075); }, metal);
      shape(ctx, () => { capsule(ctx, -s * 0.55, 0, -s * 0.12, 0, s * 0.07); }, art.accent || '#c0392b');
      shape(ctx, () => ell(ctx, -s * 0.08, 0, s * 0.055, s * 0.16), '#ffd97a');
      ctx.restore();
    } else if (kind === 'scythe') {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(0.3);
      shape(ctx, () => { capsule(ctx, 0, s * 0.9, 0, -s * 1.15, s * 0.065); }, '#3a2440');
      shape(ctx, () => {
        ctx.moveTo(0, -s * 1.15);
        ctx.quadraticCurveTo(s * 1.25, -s * 1.3, s * 1.05, -s * 0.25);
        ctx.quadraticCurveTo(s * 0.85, -s * 0.95, 0, -s * 0.98);
        ctx.closePath();
      }, '#ff5a3c');
      ctx.restore();
    } else if (kind === 'staff') {
      shape(ctx, () => { capsule(ctx, x, y + s * 0.95, x, y - s * 1.25, s * 0.06); }, '#8b5a2b');
      shape(ctx, () => ell(ctx, x, y - s * 1.35, s * 0.2, s * 0.2), art.accent || '#c9b6ff');
    } else if (kind === 'bow') {
      ctx.save();
      ctx.translate(x, y);
      shape(ctx, () => {
        ctx.moveTo(0, -s * 1.15);
        ctx.quadraticCurveTo(s * 0.85, 0, 0, s * 1.15);
      }, null, 3.2);
      shape(ctx, () => { ctx.moveTo(0, -s * 1.15); ctx.lineTo(0, s * 1.15); }, null, 1.2);
      ctx.restore();
    } else if (kind === 'club') {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(-0.4);
      shape(ctx, () => { capsule(ctx, 0, s * 0.8, 0, -s * 0.95, s * 0.1); }, '#6b4a2a');
      shape(ctx, () => ell(ctx, 0, -s * 1.15, s * 0.34, s * 0.44), '#7c5630');
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * TAU;
        shape(ctx, () => ell(ctx, Math.cos(a) * s * 0.28, -s * 1.15 + Math.sin(a) * s * 0.34, s * 0.06, s * 0.06), '#d8d8e8', 1.4);
      }
      ctx.restore();
    } else if (kind === 'gohei') {
      shape(ctx, () => { capsule(ctx, x, y + s * 0.8, x, y - s * 1.1, s * 0.055); }, '#c8a06a');
      for (let i = 0; i < 4; i++) {
        shape(ctx, () => {
          ctx.moveTo(x - s * 0.3, y - s * 1.05 + i * s * 0.13);
          ctx.lineTo(x + s * 0.3, y - s * 1.0 + i * s * 0.13);
          ctx.lineTo(x + s * 0.24, y - s * 0.9 + i * s * 0.13);
          ctx.lineTo(x - s * 0.26, y - s * 0.95 + i * s * 0.13);
          ctx.closePath();
        }, '#fdf4e6', 1.2);
      }
    } else if (kind === 'drumstick') {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(-0.5);
      shape(ctx, () => { capsule(ctx, -s * 0.5, 0, s * 0.7, 0, s * 0.07); }, '#d9b382');
      shape(ctx, () => ell(ctx, s * 0.78, 0, s * 0.16, s * 0.16), '#f0e0c0');
      ctx.restore();
    }
    return;
  }

  // in-front pieces
  if (kind === 'kunai') {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(0.5);
    shape(ctx, () => {
      ctx.moveTo(0, -s * 0.62); ctx.lineTo(s * 0.17, -s * 0.1);
      ctx.lineTo(0, s * 0.16); ctx.lineTo(-s * 0.17, -s * 0.1);
      ctx.closePath();
    }, metal);
    shape(ctx, () => { capsule(ctx, 0, s * 0.16, 0, s * 0.62, s * 0.06); }, dark);
    ctx.restore();
  } else if (kind === 'fan') {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-0.35);
    shape(ctx, () => {
      ctx.moveTo(0, s * 0.3);
      ctx.arc(0, s * 0.3, s * 0.72, -Math.PI * 0.92, -Math.PI * 0.08);
      ctx.closePath();
    }, art.outfit || '#fdf4e6');
    for (let i = 0; i <= 4; i++) {
      const a = -Math.PI * 0.92 + (i / 4) * Math.PI * 0.84;
      shape(ctx, () => {
        ctx.moveTo(0, s * 0.3);
        ctx.lineTo(Math.cos(a) * s * 0.72, s * 0.3 + Math.sin(a) * s * 0.72);
      }, null, 1.3);
    }
    ctx.restore();
  }
}

function drawTails(ctx, art, x, y, s, t) {
  const n = art.tails || 0;
  if (!n) return;
  for (let i = 0; i < n; i++) {
    const spread = (i / (n - 1) - 0.5) * 2;
    const a = -Math.PI * 0.5 + spread * 1.15 + Math.sin(t * 1.6 + i) * 0.07;
    const L = s * (1.35 + Math.abs(spread) * 0.15);
    const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
    shape(ctx, () => {
      capsule(ctx, x, y, ex, ey, s * 0.15);
    }, art.hair);
    shape(ctx, () => ell(ctx, ex, ey, s * 0.17, s * 0.17), art.hair2 || '#ffd9e8', 2);
  }
}

function drawWings(ctx, art, x, y, s, t) {
  if (!art.wings) return;
  const flap = Math.sin(t * 2.2) * 0.12;
  for (const sd of [-1, 1]) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sd, 1);
    ctx.rotate(flap);
    shape(ctx, () => {
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 1.1, -s * 0.95, s * 1.5, -s * 0.15);
      ctx.quadraticCurveTo(s * 1.05, -s * 0.2, s * 1.15, s * 0.3);
      ctx.quadraticCurveTo(s * 0.75, -s * 0.02, s * 0.7, s * 0.5);
      ctx.quadraticCurveTo(s * 0.4, s * 0.05, 0, 0);
      ctx.closePath();
    }, '#3a1030');
    ctx.restore();
  }
}

/* ------------------------------- full body ------------------------------- */

/**
 * Draws a hero at chibi scale. Local space: feet at (0,0), body 100 tall,
 * y increases downward like canvas, so the head sits at negative y.
 */
function drawBody(ctx, art, t = 0, opts = {}) {
  const bounce = Math.sin(t * 2) * 1.2;
  const big = art.big ? 1.1 : art.small ? 0.9 : 1;

  ctx.save();
  ctx.translate(0, bounce);
  ctx.scale(big, big);

  const hipY = -30;
  const shoulderY = -54;
  const headR = 23;
  const headY = -54 - headR * 0.95;

  drawWings(ctx, art, 0, shoulderY + 4, 26, t);
  drawTails(ctx, art, 0, hipY - 2, 26, t);
  drawWeapon(ctx, art, 16, shoulderY - 2, 26, true);

  // legs
  const legSwing = Math.sin(t * 2) * 1.4;
  for (const s of [-1, 1]) {
    shape(ctx, () => capsule(ctx, s * 7, hipY, s * 8 + legSwing * s, -6, 6.2), art.outfit2 || '#444');
    shape(ctx, () => ell(ctx, s * 8 + legSwing * s, -3.5, 7.4, 4.6), '#3b2a4a');
  }

  // torso — kimono-ish wrap
  shape(ctx, () => {
    ctx.moveTo(-13, hipY + 2);
    ctx.quadraticCurveTo(-17, shoulderY + 10, -14, shoulderY);
    ctx.quadraticCurveTo(0, shoulderY - 4, 14, shoulderY);
    ctx.quadraticCurveTo(17, shoulderY + 10, 13, hipY + 2);
    ctx.closePath();
  }, art.outfit);

  // collar V
  shape(ctx, () => {
    ctx.moveTo(-11, shoulderY + 1);
    ctx.lineTo(0, shoulderY + 15);
    ctx.lineTo(11, shoulderY + 1);
    ctx.quadraticCurveTo(0, shoulderY + 5, -11, shoulderY + 1);
    ctx.closePath();
  }, art.outfit2 || '#fff', 1.8);

  // obi sash
  shape(ctx, () => {
    ctx.moveTo(-13.5, hipY - 3);
    ctx.lineTo(13.5, hipY - 3);
    ctx.lineTo(13, hipY + 4);
    ctx.lineTo(-13, hipY + 4);
    ctx.closePath();
  }, art.accent || '#ffcf5c', 1.8);

  // arms
  const armSwing = Math.sin(t * 2 + 1) * 2.2;
  for (const s of [-1, 1]) {
    shape(ctx, () =>
      capsule(ctx, s * 13, shoulderY + 4, s * 18, hipY - 2 + armSwing * s, 4.6), art.outfit);
    shape(ctx, () => ell(ctx, s * 18, hipY + 1 + armSwing * s, 4.4, 4.4), art.skin);
  }

  drawWeapon(ctx, art, 18, hipY - 2, 22, false);
  drawHead(ctx, art, 0, headY, headR, art.expression || 'calm');

  ctx.restore();
}

/* ------------------------------ public API ------------------------------- */

/** Full-body portrait fitted into a w x h canvas region. */
function drawPortrait(ctx, heroId, w, h, t = 0, opts = {}) {
  const hero = HERO_BY_ID[heroId];
  if (!hero) return;
  const art = hero.art;
  const pad = opts.pad ?? 0.08;
  const scale = (h * (1 - pad * 2)) / 108;

  ctx.save();
  ctx.translate(w / 2, h * (1 - pad * 0.7));
  ctx.scale(scale, scale);

  if (opts.glow !== false) {
    const g = ctx.createRadialGradient(0, -50, 4, 0, -50, 80);
    g.addColorStop(0, withAlpha(art.aura, 0.42));
    g.addColorStop(1, withAlpha(art.aura, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -50, 80, 0, TAU); ctx.fill();
  }
  if (opts.shadow !== false) {
    ctx.beginPath();
    ell(ctx, 0, 2, 26, 6);
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.fill();
  }

  drawBody(ctx, art, t, opts);
  ctx.restore();
}

/** Head-and-shoulders bust, used on cards and battle tokens. */
function drawBust(ctx, heroId, size, t = 0) {
  const hero = HERO_BY_ID[heroId];
  if (!hero) return;
  const art = hero.art;
  const s = size / 74;

  ctx.save();
  ctx.scale(s, s);
  ctx.translate(0, 6);

  drawTails(ctx, art, 0, 24, 16, t);
  drawWings(ctx, art, 0, 16, 17, t);

  // shoulders
  shape(ctx, () => {
    ctx.moveTo(-25, 44);
    ctx.quadraticCurveTo(-24, 17, -10, 13);
    ctx.quadraticCurveTo(0, 10, 10, 13);
    ctx.quadraticCurveTo(24, 17, 25, 44);
    ctx.closePath();
  }, art.outfit);
  shape(ctx, () => {
    ctx.moveTo(-10, 13); ctx.lineTo(0, 27); ctx.lineTo(10, 13);
    ctx.quadraticCurveTo(0, 16, -10, 13);
    ctx.closePath();
  }, art.outfit2 || '#fff', 1.6);

  drawHead(ctx, art, 0, -8, 23, art.expression || 'calm');
  ctx.restore();
}

/* --------------------------- cached renderers ---------------------------- */

const cache = new Map();

/** Renders a bust once into an offscreen canvas and reuses it. */
function bustCanvas(heroId, size, dpr = window.devicePixelRatio || 1) {
  const key = `${heroId}|${size}|${dpr}`;
  if (cache.has(key)) return cache.get(key);
  const c = document.createElement('canvas');
  c.width = Math.ceil(size * dpr);
  c.height = Math.ceil(size * dpr);
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.translate(size / 2, size * 0.56);
  drawBust(ctx, heroId, size * 0.92, 0);
  cache.set(key, c);
  return c;
}

/** Paints a hero bust into an existing <canvas> element (cards, pips). */
function paintCard(canvasEl, heroId, opts = {}) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const rect = canvasEl.getBoundingClientRect();
  const w = Math.max(24, rect.width || opts.w || 90);
  const h = Math.max(24, rect.height || opts.h || 90);
  canvasEl.width = Math.round(w * dpr);
  canvasEl.height = Math.round(h * dpr);
  const ctx = canvasEl.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const hero = HERO_BY_ID[heroId];
  if (!hero) return;

  if (opts.backdrop !== false) {

// Battlefield rendering: stage, hazards, decor and the hero "tokens".
// Kept separate from the simulation so the look can change freely.

const { ARENA_W, ARENA_H } = __req("data/arenas.js");
const { HERO_BY_ID } = __req("data/heroes.js");
const { drawBust, withAlpha, shade } = __req("art/characters.js");
const { TAU, clamp, norm } = __req("core/math.js");

/* ------------------------------ background ------------------------------ */

function drawStage(ctx, arena, t) {
  const th = arena.theme;

  // sky / backdrop
  const sky = ctx.createLinearGradient(0, -260, 0, ARENA_H + 260);
  sky.addColorStop(0, shade(th.sky, 0.12));
  sky.addColorStop(0.5, th.sky);
  sky.addColorStop(1, shade(th.sky, -0.35));
  ctx.fillStyle = sky;
  ctx.fillRect(-400, -400, ARENA_W + 800, ARENA_H + 800);

  // giant kanji watermark
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = th.line;
  ctx.font = `900 ${ARENA_W * 0.85}px "Hiragino Sans","Yu Gothic",serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(th.banner, ARENA_W / 2, ARENA_H / 2);
  ctx.restore();

  if (arena.decor.skyline) drawSkyline(ctx, th, t);
  if (arena.decor.bamboo) drawBamboo(ctx, th, t);
  if (arena.decor.torii) drawTorii(ctx, th);

  drawFloor(ctx, arena, t);

  if (arena.decor.lanterns) drawLanterns(ctx, th, arena.decor.lanterns, t);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawFloor(ctx, arena, t) {
  const th = arena.theme;
  const R = 56;

  // drop shadow under the platform
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  roundRect(ctx, -14, 18, ARENA_W + 28, ARENA_H + 26, R + 10);
  ctx.filter = 'blur(0px)';
  ctx.fill();
  ctx.restore();

  const g = ctx.createLinearGradient(0, 0, ARENA_W, ARENA_H);
  g.addColorStop(0, th.floor);
  g.addColorStop(1, th.floor2);
  roundRect(ctx, 0, 0, ARENA_W, ARENA_H, R);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  roundRect(ctx, 0, 0, ARENA_W, ARENA_H, R);
  ctx.clip();

  // tatami / plank grid
  ctx.globalAlpha = 0.11;
  ctx.strokeStyle = th.line;
  ctx.lineWidth = 3;
  for (let y = 0; y <= ARENA_H; y += 125) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ARENA_W, y); ctx.stroke();
  }
  for (let x = 0; x <= ARENA_W; x += 125) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ARENA_H); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // centre line + emblem
  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = th.line;
  ctx.lineWidth = 5;
  ctx.setLineDash([26, 22]);
  ctx.beginPath(); ctx.moveTo(0, ARENA_H / 2); ctx.lineTo(ARENA_W, ARENA_H / 2); ctx.stroke();
  ctx.setLineDash([]);

  const pulse = 1 + Math.sin(t * 1.6) * 0.03;
  ctx.globalAlpha = 0.26;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.arc(ARENA_W / 2, ARENA_H / 2, 145 * pulse, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 0.16;
  ctx.beginPath();
  ctx.arc(ARENA_W / 2, ARENA_H / 2, 108 * pulse, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // vignette
  const vg = ctx.createRadialGradient(ARENA_W / 2, ARENA_H / 2, ARENA_W * 0.3, ARENA_W / 2, ARENA_H / 2, ARENA_H * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.5)');

function drawTorii(ctx, th) {

  ctx.moveTo(x - 60, y);
  ctx.lineTo(x + w + 60, y);
  ctx.lineTo(x + w + 44, y + 30);
  ctx.lineTo(x - 44, y + 30);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(x - 20, y + 52, w + 40, 22);
  ctx.fillStyle = '#8b1f14';
  ctx.fillRect(x - 20, y + 68, w + 40, 8);
  ctx.restore();
}

function drawSkyline(ctx, th, t) {
  ctx.save();
  ctx.globalAlpha = 0.55;
  let seed = 1;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  for (let layer = 0; layer < 2; layer++) {
    ctx.fillStyle = layer === 0 ? shade(th.sky, -0.4) : shade(th.sky, -0.62);
    let x = -300;
    while (x < ARENA_W + 300) {
      const w = 60 + rnd() * 110;
      const h = 160 + rnd() * (layer === 0 ? 300 : 460);
      const y = -80 - layer * 40;
      ctx.fillRect(x, y - h + 300, w, h + 400);
      // windows
      ctx.fillStyle = withAlpha(th.accent, 0.5);
      for (let wy = y - h + 320; wy < y + 260; wy += 26) {
        for (let wx = x + 8; wx < x + w - 10; wx += 20) {
          if (rnd() > 0.55) ctx.fillRect(wx, wy, 8, 12);
        }

      ctx.fillStyle = layer === 0 ? shade(th.sky, -0.4) : shade(th.sky, -0.62);
      x += w + 16 + rnd() * 28;
    }
  }
  ctx.restore();
}

function drawBamboo(ctx, th, t) {
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 14; i++) {
    const x = -150 + i * 95 + Math.sin(t * 0.5 + i) * 8;
    const w = 22 + (i % 3) * 6;
    ctx.fillStyle = i % 2 ? '#3f6b4f' : '#35603f';
    ctx.fillRect(x, -300, w, ARENA_H + 600);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    for (let y = -300; y < ARENA_H + 300; y += 150) ctx.fillRect(x, y, w, 7);
  }
  ctx.restore();
}

function drawLanterns(ctx, th, n, t) {
  for (let i = 0; i < n; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const x = side < 0 ? -78 : ARENA_W + 78;
    const y = 200 + Math.floor(i / 2) * 460 + Math.sin(t * 1.1 + i) * 12;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 0.9 + i) * 0.07);
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -140); ctx.lineTo(0, -46); ctx.stroke();

    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 120);
    g.addColorStop(0, 'rgba(255,180,90,.5)');
    g.addColorStop(1, 'rgba(255,180,90,0)');

    ctx.fillStyle = '#e8463c';
    ctx.beginPath(); ctx.ellipse(0, 0, 40, 50, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.28)';

    ctx.fillStyle = '#2b1a3f';
    ctx.fillRect(-16, -54, 32, 10);
    ctx.fillRect(-16, 44, 32, 10);
    ctx.fillStyle = '#fdf4e6';
    ctx.font = '900 34px "Hiragino Sans",serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(th.banner, 0, 2);
    ctx.restore();
  }
}

/* -------------------------------- hazards ------------------------------- */

function drawHazards(ctx, world, arena, t) {
  const th = arena.theme;
  for (const h of world.hazards) {
    if (h.type === 'pit') {
      const g = ctx.createRadialGradient(h.x, h.y, h.r * 0.1, h.x, h.y, h.r);
      g.addColorStop(0, '#000');
      g.addColorStop(0.72, '#07040f');

      g.addColorStop(0, hot ? '#fff0b0' : '#eaf7ff');
      g.addColorStop(0.45, hot ? '#ff6a2a' : '#8fd8ff');

      ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 1.12, 0, TAU); ctx.fill();

      const n = 9;
      ctx.fillStyle = hot ? '#ffb347' : '#dff2ff';
      ctx.strokeStyle = 'rgba(30,16,50,.6)';
      ctx.lineWidth = 3;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + t * (hot ? 0.5 : 0.25);
        const L = h.r * (0.85 + Math.sin(t * 3 + i) * 0.1);
        ctx.beginPath();
        ctx.moveTo(h.x + Math.cos(a) * L, h.y + Math.sin(a) * L);
        ctx.lineTo(h.x + Math.cos(a + 0.32) * h.r * 0.34, h.y + Math.sin(a + 0.32) * h.r * 0.34);
        ctx.lineTo(h.x + Math.cos(a - 0.32) * h.r * 0.34, h.y + Math.sin(a - 0.32) * h.r * 0.34);

      g.addColorStop(0, '#fff3d0');
      g.addColorStop(0.5, th.accent);
      g.addColorStop(1, shade(th.accent, -0.45));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, h.r, 0, TAU); ctx.fill();

}

/* --------------------------------- units -------------------------------- */

const SIDE_COLORS = [
  { rim: '#ffcf5c', rim2: '#e39a1c', hp: '#5ce08a', hp2: '#2fae63' },
  { rim: '#a56bff', rim2: '#6b3fd6', hp: '#ff7b7b', hp2: '#d63232' },
];

function drawUnit(ctx, u, t, opts = {}) {
  const hero = HERO_BY_ID[u.heroId];
  const col = SIDE_COLORS[u.side];
  const R = u.r;

  ctx.save();
  ctx.translate(u.x, u.y);

  if (u.falling > 0) {
    const k = clamp(u.falling, 0, 1);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, R + 11, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // token body
  const tilt = clamp(u.spin, -0.3, 0.3);
  ctx.rotate(tilt);

  const rim = ctx.createLinearGradient(-R, -R, R, R);
  rim.addColorStop(0, shade(col.rim, 0.35));
  rim.addColorStop(0.5, col.rim);
  rim.addColorStop(1, col.rim2);
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(28,14,45,.85)';
  ctx.lineWidth = 4;
  ctx.stroke();

  const inner = R * 0.82;
  const bg = ctx.createRadialGradient(0, -inner * 0.3, 3, 0, 0, inner);
  bg.addColorStop(0, withAlpha(hero.art.aura, 0.95));
  bg.addColorStop(1, shade(hero.art.aura, -0.6));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, TAU); ctx.fill();

  // hero art, clipped into the disc
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, TAU); ctx.clip();
  ctx.translate(0, inner * 0.42);
  drawBust(ctx, u.heroId, inner * 2.05, t + u.slot);
  ctx.restore();

  ctx.strokeStyle = 'rgba(28,14,45,.5)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, inner, 0, TAU); ctx.stroke();

  ctx.rotate(-tilt);

  // HP arc
  const hpFrac = clamp(u.hp / u.hpMax, 0, 1);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.5)';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.arc(0, 0, R + 5.5, -Math.PI * 0.82, -Math.PI * 0.18);
  ctx.stroke();
  const hg = ctx.createLinearGradient(-R, 0, R, 0);
  hg.addColorStop(0, col.hp);
  hg.addColorStop(1, col.hp2);
  ctx.strokeStyle = hg;
  ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.arc(0, 0, R + 5.5, -Math.PI * 0.82, -Math.PI * 0.82 + Math.PI * 0.64 * hpFrac);

      ctx.arc(0, 0, R + 5.5, Math.PI * 0.82 - Math.PI * 0.64 * rageFrac, Math.PI * 0.82);

    ctx.fillStyle = '#bfe9ff';
    ctx.beginPath(); ctx.arc(0, 0, R * 1.04, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = '#eaf8ff';
    ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {

      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R * 0.3, Math.sin(a) * R * 0.3);
      ctx.lineTo(Math.cos(a) * R * 1.05, Math.sin(a) * R * 1.05);
      ctx.stroke();
    }

  }

  ctx.restore();
}

function drawDeadMarker(ctx, u, t) {
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  const R = u.r * 0.55;
  ctx.beginPath();
  ctx.moveTo(-R, -R); ctx.lineTo(R, R);
  ctx.moveTo(R, -R); ctx.lineTo(-R, R);
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------- projectiles ----------------------------- */

function drawProjectile(ctx, p, t) {
  const hero = HERO_BY_ID[p.heroId];
  const color = hero ? hero.art.aura : '#fff';
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.kind === 'clone') {
    ctx.globalAlpha = 0.72;
    ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, p.r * 1.4);
    g.addColorStop(0, withAlpha(color, 0.9));
    g.addColorStop(1, withAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.clip();
    ctx.translate(0, p.r * 0.4);
    drawBust(ctx, p.heroId, p.r * 2, t);
    ctx.restore();
    ctx.strokeStyle = withAlpha(color, 0.9);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.stroke();
  } else {
    // foxfire wisp
    const flick = 1 + Math.sin(t * 18 + p.id) * 0.16;
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, p.r * 2.6 * flick);
    g.addColorStop(0, '#fff');
    g.addColorStop(0.35, withAlpha(color, 0.95));
    g.addColorStop(1, withAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 2.6 * flick, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, p.r * 0.45, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* -------------------------------- aim guide ------------------------------ */

function drawAimGuide(ctx, unit, dirX, dirY, power, world, t) {
  const [nx, ny] = norm(dirX, dirY);
  ctx.save();

  // pull-back arrow behind the hero
  const back = unit.r + 12;
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(unit.x - nx * back, unit.y - ny * back);
  ctx.lineTo(unit.x - nx * (back + 90 * power), unit.y - ny * (back + 90 * power));

// game stays tiny and works offline. The music is a slow pentatonic
// (yo-scale) koto-ish arpeggio, which gives the Japanese flavour.

let ctx = null;

let musicGain = null;

let musicOn = true;

let failed = false;

  if (ctx || failed) return ctx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { failed = true; return null; }
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    musicGain.connect(master);

    sfxGain.gain.value = 0.85;
    sfxGain.connect(master);

// Deterministic seeded RNG (mulberry32). The battle world uses a seeded
// stream so the AI's forward simulation reproduces the real outcome exactly.

function makeRng(seed = Date.now() >>> 0) {
  let s = seed >>> 0;
  const fn = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  fn.state = () => s;
  fn.setState = (v) => { s = v >>> 0; };
  return fn;
}

const randRange = (rng, a, b) => a + rng() * (b - a);
const randInt = (rng, a, b) => Math.floor(a + rng() * (b - a + 1));
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Weighted pick: entries are [value, weight].
function weighted(rng, entries) {
  let total = 0;
  for (const e of entries) total += e[1];
  let r = rng() * total;
  for (const e of entries) {
    r -= e[1];
    if (r <= 0) return e[0];
  }
  return entries[entries.length - 1][0];
}

// Player save file. Everything lives in localStorage so the game works
// fully offline once the PWA is installed.

const KEY = 'sakura-smash-save-v1';

const DEFAULT_SAVE = {
  version: 1,
  name: 'Sensei',
  avatarSeed: 7,
  trophies: 0,
  bestTrophies: 0,
  gold: 300,
  gems: 20,
  wins: 0,
  losses: 0,
  streak: 0,
  // heroId -> { level, cards }
  owned: {},
  team: [],
  // chest slots: null | { type, unlockAt|null, readyAt }
  chests: [null, null, null, null],
  lastFreeChest: 0,
  settings: { sfx: true, music: true, haptics: true, lefty: false, quality: 'auto' },
  seenIntro: false,
};

let cache = null;

// Deliberately not structuredClone: it is missing on iOS Safari before 15.4,
// and a save file is plain JSON anyway. A missing global here used to take the
// whole boot down, since the fallback path needed it too.
const clone = (v) => JSON.parse(JSON.stringify(v));

function load() {
  if (cache) return cache;
  try {
    const raw = localStorage.getItem(KEY);
    cache = raw ? deepMerge(clone(DEFAULT_SAVE), JSON.parse(raw)) : clone(DEFAULT_SAVE);
  } catch (err) {
    // Storage can be unavailable outright (private mode, sandboxed frame).
    // The game still has to run — it just will not remember anything.
    console.warn('save load failed, starting fresh', err);
    cache = clone(DEFAULT_SAVE);
  }
  return cache;
}

let saveTimer = 0;
function save(immediate = false) {
  if (!cache) return;
  const write = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify(cache));
    } catch (err) {
      console.warn('save failed', err);
    }
  };
  if (immediate) {
    clearTimeout(saveTimer);
    write();
  } else {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(write, 220);
  }
}

function resetSave() {
  cache = clone(DEFAULT_SAVE);
  save(true);
  return cache;
}

function deepMerge(base, patch) {
  if (patch === null || patch === undefined) return base;
  if (Array.isArray(base)) return Array.isArray(patch) ? patch : base;
  if (typeof base !== 'object') return patch;
  if (typeof patch !== 'object') return base;
  const out = { ...base };
  for (const k of Object.keys(patch)) {
    out[k] = k in base ? deepMerge(base[k], patch[k]) : patch[k];
  }
  return out;
}

// ============================================================================
// Battle world: pure data + pure functions.
//
// Nothing in here touches the DOM or canvas. That is deliberate — the AI runs
// this exact code to look one turn into the future, so what it predicts is
// literally what will happen. Rendering just reads the state and drains
// `world.events`.
// ============================================================================

const { ARENA_BY_ID, ARENA_W, ARENA_H, spawnPoints } = __req("data/arenas.js");
const { HERO_BY_ID, heroStats } = __req("data/heroes.js");
const { makeRng } = __req("core/rng.js");
const { clamp, len, norm, dist } = __req("core/math.js");

const MAX_LAUNCH_SPEED = 1450;
const MIN_LAUNCH_SPEED = 260;
const REF_SPEED = 900;
const MAX_DRAG = 340;          // virtual units of pull for full power
const STOP_SPEED = 14;
const WALL_BOUNCE = 0.84;
const UNIT_BOUNCE = 0.95;
const RAGE_MAX = 100;
const TURN_LIMIT = 60;         // after this, the arena starts collapsing
const SIM_TIMEOUT = 14;        // virtual seconds before a turn is force-ended

/* -------------------------------------------------------------------------- */
/* construction                                                               */
/* -------------------------------------------------------------------------- */

let nextId = 1;

function createWorld({ arenaId, teams, seed = 1234, firstTurn = 0 }) {
  const arena = ARENA_BY_ID[arenaId] || ARENA_BY_ID.courtyard;
  const rng = makeRng(seed);
  const world = {
    arenaId: arena.id,
    friction: arena.friction,          // fraction of speed retained per second
    hazards: arena.hazards.map((h) => ({ ...h, pulse: 0 })),
    units: [],
    projectiles: [],
    turn: firstTurn,
    turnCount: 0,
    phase: 'aim',
    activeId: null,
    firstHitDone: false,
    stopResolved: true,
    winner: null,
    time: 0,
    simTime: 0,
    events: [],
    quiet: false,
    seed,
    _rngState: rng.state(),
    collapse: 0,
  };

    const pts = spawnPoints(side);
    team.forEach((member, i) => {
      const hero = HERO_BY_ID[member.heroId];
      if (!hero) return;
      const st = heroStats(member.heroId, member.level);
      const p = pts[i % pts.length];
      world.units.push({
        id: nextId++,
        side,
        slot: i,
        heroId: hero.id,
        abilityId: hero.ability.id,
        level: member.level,
        x: p.x, y: p.y, vx: 0, vy: 0,
        r: st.radius,
        mass: hero.weight,
        hp: st.hp, hpMax: st.hp,
        atk: st.atk,
        // Moving second is a real edge — you get to answer their positioning.
        // The side that opens starts with a slice of rage as compensation.
        rage: side === firstTurn ? 18 : 0,
        charged: false,
        alive: true,
        falling: 0,
        frozen: 0,
        brittle: 1,
        shield: 0, shieldTurns: 0,
        burn: 0, burnTick: 0,
        leech: 0,

// Fast structural clone. Much quicker than structuredClone for the AI's
// hundreds of speculative rollouts.
function cloneWorld(w) {

    ...w,
    hazards: w.hazards.map((h) => ({ ...h })),
    units: w.units.map((u) => ({ ...u })),
    projectiles: w.projectiles.map((p) => ({ ...p })),
    events: [],
    quiet: true,
  };
}

const rngFor = (w) => {

};
const saveRng = (w, r) => { w._rngState = r.state(); };

function emit(w, ev) {

}

/* -------------------------------------------------------------------------- */
/* queries                                                                    */
/* -------------------------------------------------------------------------- */

const unitById = (w, id) => w.units.find((u) => u.id === id);
const aliveOf = (w, side) => w.units.filter((u) => u.side === side && u.alive);
const enemiesOf = (w, side) => w.units.filter((u) => u.side !== side && u.alive);

function legalLaunchers(w, side) {

}

function teamHp(w, side) {

}

function settled(w) {

/* -------------------------------------------------------------------------- */
/* launching                                                                  */
/* -------------------------------------------------------------------------- */

function launch(w, unitId, dirX, dirY, power01) {

}

function applyLaunchAbility(w, u, ab, nx, ny, speed) {
  switch (ab.id) {
    case 'arrow':
      u.slick = ab.friction;
      u.dmgMul = ab.dmgMul;
      break;
    case 'clones': {
      for (let i = 0; i < ab.count; i++) {
        const sign = i % 2 === 0 ? 1 : -1;
        const step = Math.ceil((i + 1) / 2);
        const a = Math.atan2(ny, nx) + sign * ab.spread * step;
        w.projectiles.push({
          id: nextId++, kind: 'clone', owner: u.id, side: u.side, heroId: u.heroId,
          x: u.x + Math.cos(a) * (u.r + 6), y: u.y + Math.sin(a) * (u.r + 6),
          vx: Math.cos(a) * speed * 0.92, vy: Math.sin(a) * speed * 0.92,
          r: u.r * 0.72, dmg: u.atk * ab.dmgMul, ttl: 2.6, target: null, hits: [],
        });
      }
      break;
    }
    case 'vampire':
      u.leech = ab.leech;
      break;
    case 'pierce':
      u.pierce = 1;
      break;
    default:
      // onFirstHit / onStop abilities are handled elsewhere; flag stays on the unit.
      break;
  }
}

/* -------------------------------------------------------------------------- */
/* stepping                                                                   */
/* -------------------------------------------------------------------------- */

function step(w, dt) {
  if (w.phase !== 'sim') return;
  w.time += dt;
  w.simTime += dt;

  integrate(w, dt);

  for (const h of w.hazards) h.pulse = Math.max(0, h.pulse - dt * 2.2);

  if (w.simTime > SIM_TIMEOUT) {
    for (const u of w.units) { u.vx = 0; u.vy = 0; }
    w.projectiles.length = 0;
  }

  if (settled(w)) {
    if (!w.stopResolved) {
      w.stopResolved = true;
      resolveStopAbility(w);
      if (!settled(w)) return;   // ability spawned projectiles / knockback
    }
    finishTurn(w);
  }
}

function integrate(w, dt) {
  // --- units ---
  for (const u of w.units) {
    if (!u.alive) continue;

    if (u.falling > 0) {
      u.falling += dt * 2.4;
      u.vx *= 0.86; u.vy *= 0.86;
      u.x += u.vx * dt; u.y += u.vy * dt;
      if (u.falling >= 1) {
        u.alive = false;
        u.hp = 0;
        u.vx = u.vy = 0;
        emit(w, { type: 'ko', x: u.x, y: u.y, unit: u.id, side: u.side, heroId: u.heroId, cause: 'pit' });
      }
      continue;
    }

    const speed = len(u.vx, u.vy);
    if (speed > 0) {
      const retain = u.slick ? Math.max(w.friction, u.slick) : w.friction;
      const f = Math.pow(retain, dt);
      u.vx *= f; u.vy *= f;
      if (len(u.vx, u.vy) < STOP_SPEED) { u.vx = 0; u.vy = 0; u.spin *= 0.5; }
    }
    u.spin *= Math.pow(0.2, dt);

    u.x += u.vx * dt;
    u.y += u.vy * dt;

    bounceWalls(w, u);
  }

  resolveUnitCollisions(w);
  resolveHazards(w, dt);
  stepProjectiles(w, dt);
}

function bounceWalls(w, u) {
  let hit = 0;
  if (u.x - u.r < 0) { u.x = u.r; u.vx = -u.vx * WALL_BOUNCE; hit = Math.abs(u.vx); }
  else if (u.x + u.r > ARENA_W) { u.x = ARENA_W - u.r; u.vx = -u.vx * WALL_BOUNCE; hit = Math.abs(u.vx); }
  if (u.y - u.r < 0) { u.y = u.r; u.vy = -u.vy * WALL_BOUNCE; hit = Math.max(hit, Math.abs(u.vy)); }
  else if (u.y + u.r > ARENA_H) { u.y = ARENA_H - u.r; u.vy = -u.vy * WALL_BOUNCE; hit = Math.max(hit, Math.abs(u.vy)); }
  if (hit > 180) emit(w, { type: 'wall', x: u.x, y: u.y, power: clamp(hit / REF_SPEED, 0, 1) });
}

function resolveUnitCollisions(w) {
  const us = w.units;
  for (let i = 0; i < us.length; i++) {
    const a = us[i];
    if (!a.alive || a.falling > 0) continue;
    for (let j = i + 1; j < us.length; j++) {
      const b = us[j];
      if (!b.alive || b.falling > 0) continue;

      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 === 0) continue;

      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;

      // positional de-overlap weighted by mass
      const overlap = rr - d;
      const totalMass = a.mass + b.mass;
      a.x -= nx * overlap * (b.mass / totalMass);
      a.y -= ny * overlap * (b.mass / totalMass);
      b.x += nx * overlap * (a.mass / totalMass);
      b.y += ny * overlap * (a.mass / totalMass);

      const avn = a.vx * nx + a.vy * ny;
      const bvn = b.vx * nx + b.vy * ny;
      const approach = avn - bvn;
      if (approach <= 0) continue;

      // Captured before the impulse: abilities that punch through a target
      // need the speed the attacker arrived with, not what it bounced away at.
      const preSpeedA = len(a.vx, a.vy);
      const preSpeedB = len(b.vx, b.vy);

      // 1D elastic impulse along the normal
      const imp = ((1 + UNIT_BOUNCE) * approach) / totalMass;
      a.vx -= imp * b.mass * nx; a.vy -= imp * b.mass * ny;
      b.vx += imp * a.mass * nx; b.vy += imp * a.mass * ny;

      a.spin += approach * 0.0016 * (ny > 0 ? 1 : -1);
      b.spin -= approach * 0.0016 * (ny > 0 ? 1 : -1);

      const impact = clamp(approach / REF_SPEED, 0, 1.7);

      if (a.side === b.side) {

        emit(w, { type: 'bump', x: hx, y: hy, power: impact });
        continue;
      }

      const aShare = Math.abs(avn) / (Math.abs(avn) + Math.abs(bvn) + 1e-6);

      const dmgToB = a.atk * impact * aShare * a.dmgMul;
      const dmgToA = b.atk * impact * (1 - aShare) * b.dmgMul;

      const attacker = dmgToB >= dmgToA ? a : b;
      const defender = attacker === a ? b : a;

      if (dmgToB > 1) applyHit(w, a, b, dmgToB, hx, hy, impact);
      if (dmgToA > 1) applyHit(w, b, a, dmgToA, hx, hy, impact);

      emit(w, { type: 'clash', x: hx, y: hy, power: impact, a: attacker.id, b: defender.id });

      // first-impact abilities fire once per turn, for the launched hero only
      const active = unitById(w, w.activeId);
      if (active && active.usingAbility && !w.firstHitDone && (active === a || active === b)) {
        const other = active === a ? b : a;
        if (other.side !== active.side) {
          w.firstHitDone = true;
          resolveFirstHitAbility(w, active, other, nx, ny, active === a ? preSpeedA : preSpeedB);

      }
    }
  }
}

function applyHit(w, from, to, rawDmg, hx, hy, impact) {
  let dmg = rawDmg * to.brittle;
  if (to.shieldTurns > 0) dmg *= 1 - to.shield;
  dmg = Math.round(dmg);
  if (dmg <= 0) return;

  damage(w, from, to, dmg, hx, hy, impact);

  from.rage = clamp(from.rage + dmg * 0.085, 0, RAGE_MAX);
  to.rage = clamp(to.rage + dmg * 0.05, 0, RAGE_MAX);
  refreshCharge(from); refreshCharge(to);

  if (from.leech > 0) {
    const healed = Math.round(dmg * from.leech);
    from.hp = Math.min(from.hpMax, from.hp + healed);
    emit(w, { type: 'heal', x: from.x, y: from.y, unit: from.id, amount: healed });
  }
}

function refreshCharge(u) {
  if (u.rage >= RAGE_MAX && !u.charged) {
    u.charged = true;
  }
}

// Core damage application, also used by abilities and hazards.
function damage(w, from, to, amount, hx, hy, impact = 0.6, kind = 'hit') {
  if (!to.alive) return 0;
  const dealt = Math.min(to.hp, Math.round(amount));
  to.hp -= dealt;
  emit(w, {
    type: 'damage', x: hx ?? to.x, y: hy ?? to.y, unit: to.id, side: to.side,
    amount: dealt, power: impact, kind,
  });
  if (to.hp <= 0) {
    to.hp = 0;
    to.alive = false;
    to.vx = to.vy = 0;
    emit(w, { type: 'ko', x: to.x, y: to.y, unit: to.id, side: to.side, heroId: to.heroId, cause: kind });
  }
  return dealt;
}

/* -------------------------------------------------------------------------- */
/* hazards                                                                    */
/* -------------------------------------------------------------------------- */

function resolveHazards(w, dt) {
  for (const u of w.units) {
    if (!u.alive || u.falling > 0) continue;
    let onSpikeNow = false;

    for (const h of w.hazards) {
      const d = dist(u.x, u.y, h.x, h.y);

      if (h.type === 'pit') {
        // You have to be genuinely over the hole to drop — clipping the edge
        // at speed should skim you past it, not swallow you.
        if (d < h.r * 0.5) {
          u.falling = 0.01;
          h.pulse = 1;
          emit(w, { type: 'pitfall', x: u.x, y: u.y, unit: u.id, hx: h.x, hy: h.y });
        } else if (d < h.r * 0.95) {
          // the lip tugs, but only once you are properly over the rim, and it
          // pulls a stationary hero in far harder than one flying past
          const speed = len(u.vx, u.vy);
          const grip = clamp(1 - speed / 900, 0.25, 1);
          const pull = (1 - (d - h.r * 0.5) / (h.r * 0.45)) * 175 * grip;
          const [nx, ny] = norm(h.x - u.x, h.y - u.y);
          u.vx += nx * pull * dt;
          u.vy += ny * pull * dt;
        }
      } else if (h.type === 'spike') {
        if (d < h.r + u.r * 0.7) {
          onSpikeNow = true;
          if (!u.onSpike) {
            h.pulse = 1;
            damage(w, null, u, h.dmg, u.x, u.y, 0.8, 'spike');
            emit(w, { type: 'spikeHit', x: u.x, y: u.y, unit: u.id });
          }
        }
      } else if (h.type === 'bumper') {
        const rr = h.r + u.r;
        if (d < rr && d > 0) {
          const nx = (u.x - h.x) / d, ny = (u.y - h.y) / d;
          u.x = h.x + nx * rr;
          u.y = h.y + ny * rr;
          const vn = u.vx * nx + u.vy * ny;
          if (vn < 0) {
            u.vx -= 2.1 * vn * nx;
            u.vy -= 2.1 * vn * ny;
            const boost = 150;
            u.vx += nx * boost; u.vy += ny * boost;
            h.pulse = 1;
            emit(w, { type: 'bumper', x: h.x + nx * h.r, y: h.y + ny * h.r, power: clamp(-vn / REF_SPEED, 0, 1) });
          }
        }
      }
    }

  }
}

/* -------------------------------------------------------------------------- */
/* projectiles (clones, foxfire)                                              */
/* -------------------------------------------------------------------------- */

function stepProjectiles(w, dt) {
  const keep = [];
  for (const p of w.projectiles) {
    p.ttl -= dt;
    if (p.ttl <= 0) { emit(w, { type: 'projGone', x: p.x, y: p.y, kind: p.kind }); continue; }

    if (p.kind === 'foxfire') {
      const t = unitById(w, p.target);
      if (!t || !t.alive) {
        const alt = enemiesOf(w, p.side)[0];
        if (!alt) { emit(w, { type: 'projGone', x: p.x, y: p.y, kind: p.kind }); continue; }
        p.target = alt.id;
      }
      const tgt = unitById(w, p.target);
      const [nx, ny] = norm(tgt.x - p.x, tgt.y - p.y);
      const sp = len(p.vx, p.vy) || 500;
      p.vx = (p.vx + nx * sp * 5.5 * dt);
      p.vy = (p.vy + ny * sp * 5.5 * dt);
      const s2 = len(p.vx, p.vy);
      p.vx = (p.vx / s2) * sp; p.vy = (p.vy / s2) * sp;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.x < 0 || p.x > ARENA_W || p.y < 0 || p.y > ARENA_H) {
      if (p.kind === 'clone') {
        // clones ricochet off the walls once
        if (p.x < 0 || p.x > ARENA_W) p.vx *= -1;
        if (p.y < 0 || p.y > ARENA_H) p.vy *= -1;
        p.x = clamp(p.x, 0, ARENA_W); p.y = clamp(p.y, 0, ARENA_H);
      } else {
        emit(w, { type: 'projGone', x: p.x, y: p.y, kind: p.kind });
        continue;
      }
    }

    let consumed = false;
    for (const u of w.units) {
      if (!u.alive || u.side === p.side || u.falling > 0) continue;
      if (p.hits && p.hits.includes(u.id)) continue;
      if (dist(p.x, p.y, u.x, u.y) < u.r + p.r) {
        const owner = unitById(w, p.owner);
        let dmg = p.dmg * u.brittle;
        if (u.shieldTurns > 0) dmg *= 1 - u.shield;
        damage(w, owner, u, dmg, p.x, p.y, 0.7, p.kind);
        if (owner && owner.alive) {
          owner.rage = clamp(owner.rage + dmg * 0.05, 0, RAGE_MAX);
          refreshCharge(owner);
        }
        const [kx, ky] = norm(p.vx, p.vy);
        u.vx += kx * 190; u.vy += ky * 190;
        emit(w, { type: 'projHit', x: p.x, y: p.y, kind: p.kind, unit: u.id });
        if (p.kind === 'foxfire') { consumed = true; break; }
        p.hits.push(u.id);
        p.dmg *= 0.7;
      }
    }
    if (consumed) continue;
    keep.push(p);
  }
  w.projectiles = keep;
}

/* -------------------------------------------------------------------------- */
/* abilities                                                                  */
/* -------------------------------------------------------------------------- */

function resolveFirstHitAbility(w, u, target, nx, ny, preSpeed) {
  const ab = HERO_BY_ID[u.heroId].ability;
  if (ab.trigger !== 'onFirstHit') return;

  switch (ab.id) {
    case 'pierce': {
      const extra = Math.round(u.atk * (ab.dmgMul - 1));
      let dmg = extra * target.brittle;
      if (target.shieldTurns > 0) dmg *= 1 - target.shield;
      damage(w, u, target, dmg, target.x, target.y, 1.2, 'pierce');
      // punch straight through instead of bouncing back
      const keep = preSpeed * ab.keepMomentum;
      const dirX = target.x - u.x, dirY = target.y - u.y;
      const [dx, dy] = norm(dirX, dirY);
      u.vx = dx * keep; u.vy = dy * keep;
      emit(w, { type: 'slash', x: target.x, y: target.y, angle: Math.atan2(dy, dx), unit: u.id });
      break;
    }
    case 'freeze': {
      target.frozen = ab.turns + 1;
      target.brittle = ab.brittle;
      target.vx *= 0.25; target.vy *= 0.25;
      emit(w, { type: 'freeze', x: target.x, y: target.y, unit: target.id });
      break;
    }
    case 'burn': {
      target.burn = ab.turns;
      target.burnTick = ab.tick;
      target.burnBlast = ab.blast;
      target.burnRadius = ab.blastRadius;
      target.burnSrc = u.id;
      emit(w, { type: 'burnApply', x: target.x, y: target.y, unit: target.id });
      break;
    }
    case 'chain': {
      let from = target;
      const hitIds = [target.id];
      for (let i = 0; i < ab.jumps; i++) {
        const cands = enemiesOf(w, u.side)
          .filter((e) => !hitIds.includes(e.id))
          .map((e) => ({ e, d: dist(from.x, from.y, e.x, e.y) }))
          .filter((c) => c.d < ab.range)
          .sort((a, b) => a.d - b.d);
        if (!cands.length) break;
        const nxt = cands[0].e;
        emit(w, { type: 'lightning', x1: from.x, y1: from.y, x2: nxt.x, y2: nxt.y });
        let dmg = ab.dmg * nxt.brittle;
        if (nxt.shieldTurns > 0) dmg *= 1 - nxt.shield;
        damage(w, u, nxt, dmg, nxt.x, nxt.y, 0.9, 'lightning');
        hitIds.push(nxt.id);
        from = nxt;
      }
      break;
    }
    case 'vampire':

// Battle screen: camera, input, rendering, HUD, AI driving and results.

const { makeRng } = __req("core/rng.js");

  canvas = $('#arena');
  ctx = canvas.getContext('2d');
  $('#btn-pause').onclick = pauseMenu;
  window.addEventListener('resize', resize);
  bindInput();
}

function startBattle(mode = 'ladder') {
  const p = load();
  const seed = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
  const rng = makeRng(seed);
  const arena = mode === 'practice' ? ARENA_BY_ID.courtyard : arenaForTrophies(p.trophies);

    arenaId: arena.id,
    teams: [myTeam, foeTeam],
    seed,
    firstTurn: rng() < 0.5 ? 0 : 1,
  });

  state = {
    mode,
    world,
    arena,
    rival: mode === 'versus' ? { name: 'Player 2', jp: 'ふたり', skill: 0, hue: 280 } : rival,
    skill: mode === 'practice' ? 0.3 : clamp(rival.skill + (p.trophies / 4200), 0.2, 0.97),
    fx: new Fx(),
    ambient: new Ambient(arena.theme.petals, ARENA_W + 500, ARENA_H + 500),
    acc: 0,
    time: 0,
    aim: null,
    turnClock: TURN_SECONDS,
    aiPlan: null,
    aiThink: 0,
    aiShot: null,
    aiPreview: 0,
    paused: false,
    over: false,
    resultShown: false,
    cam: { x: 0, y: 0, s: 1 },

function resize() {

  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  canvas.width = Math.round(w * dpr);

  const availW = w - 14;
  const availH = h - 150;
  const s = Math.min(availW / ARENA_W, availH / ARENA_H);

  state.cam.x = (w - ARENA_W * s) / 2;
  state.cam.y = (h - ARENA_H * s) / 2;

  x: (sx - state.cam.x) / state.cam.s,

function bindInput() {

  if (!state) return false;
  if (state.mode === 'versus') return true;
  return state.world.turn === 0;
}

function fire(unitId, dx, dy, power) {
  const w = state.world;
  const u = unitById(w, unitId);
  if (!u) return;
  if (!launch(w, unitId, dx, dy, power)) return;
  state.turnClock = TURN_SECONDS;
  state.aiShot = null;
  state.aiPlan = null;
  haptic(power > 0.7 ? [14, 20, 10] : 12);

/* ---------------------------------- HUD ---------------------------------- */

function buildPips() {
  state.pips = new Map();
  for (const side of [0, 1]) {
    const bar = $(side === 0 ? '#bar-you' : '#bar-foe');
    bar.innerHTML = '';
    for (const u of state.world.units.filter((x) => x.side === side)) {
      const pip = el('div', `pip ${side === 1 ? 'foe' : ''}`);

      const cv = el('canvas');
      pip.appendChild(cv);
      const hp = el('div', 'hp');
      hp.appendChild(el('i'));
      pip.appendChild(hp);
      const rage = el('div', 'rage');
      rage.appendChild(el('i'));
      pip.appendChild(rage);
      bar.appendChild(pip);
      state.pips.set(u.id, {
        root: pip,
        hp: hp.firstChild,
        rage: rage.firstChild,
      });
      requestAnimationFrame(() => paintCard(cv, u.heroId, { w: 84, h: 34 }));
    }
  }
}

// Runs every frame, so it reads from a prebuilt node map rather than doing
// eight querySelector lookups per tick.
function updatePips() {
  if (!state.pips) return;
  const w = state.world;
  for (const u of w.units) {
    const pip = state.pips.get(u.id);
    if (!pip) continue;
    pip.hp.style.width = `${clamp((u.hp / u.hpMax) * 100, 0, 100)}%`;
    pip.rage.style.width = `${clamp((u.rage / RAGE_MAX) * 100, 0, 100)}%`;
    pip.root.classList.toggle('dead', !u.alive);
    pip.root.classList.toggle('charged', u.charged && u.alive);

function showTurnBanner() {

/* ------------------------------- main loop -------------------------------- */

let lastNow = 0;

function loop(now) {
