<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunny Acres — Farm Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="description" content="A pocket farming game you walk around, in four shades of green.">
<meta name="theme-color" content="#c9c5b8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sunny Acres">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="device" class="device" hidden>
  <div class="bezel">
    <div class="bezel-label"><span>DOT MATRIX WITH STEREO SOUND</span></div>
    <canvas id="screen" width="160" height="144"></canvas>
  </div>

  <div class="brand">SUNNY ACRES<span>FARM SYSTEM</span></div>

  <div class="pads">
    <div class="dpad">
      <button type="button" class="d up" data-key="up" aria-label="Up"></button>
      <button type="button" class="d left" data-key="left" aria-label="Left"></button>
      <button type="button" class="d right" data-key="right" aria-label="Right"></button>
      <button type="button" class="d down" data-key="down" aria-label="Down"></button>
      <span class="d-hub"></span>
    </div>
    <div class="ab">
      <button type="button" class="rb" data-key="b" aria-label="B">B</button>
      <button type="button" class="rb" data-key="a" aria-label="A">A</button>
    </div>
  </div>

  <div class="startrow">
    <button type="button" class="pill" data-key="start" aria-label="Start">START</button>
  </div>
</div>

<div id="onboard" class="onboard" hidden>
  <div class="ob-screen">
    <div class="ob-logo">SUNNY ACRES</div>
    <p class="ob-sub">A FARM IN FOUR SHADES OF GREEN</p>

    <label class="ob-label" for="ob-name">FARMER NAME</label>
    <input id="ob-name" class="ob-field" type="text" maxlength="10" placeholder="FARMER"
           autocomplete="off" autocapitalize="characters" spellcheck="false">

    <label class="ob-label">PICK A FACE</label>
    <div class="avatar-grid" id="ob-avatars"></div>

    <button type="button" class="ob-start" id="ob-start">PRESS START</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
