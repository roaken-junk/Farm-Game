<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunny Acres — Farm Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="description" content="A pocket farming game: plant, raise animals, craft goods and fill orders.">
<meta name="theme-color" content="#7ec8f0">

<!-- Add to Home Screen on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunny Acres">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" hidden>
  <header class="hud" id="hud"></header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- Pick a save -->
<div id="title" class="onboard" hidden>
  <div class="onboard-card">
    <div class="onboard-logo">🌻</div>
    <h1>Sunny Acres</h1>
    <p class="sub">Grow it. Raise it. Sell it.</p>
    <div id="slots" class="slots-list"></div>
    <button class="btn btn-big" id="load-code">📥 Load from a code</button>
  </div>
</div>

<!-- First run: name + avatar -->
<div id="onboard" class="onboard" hidden>
  <div class="onboard-card">
    <div class="onboard-logo">🌻</div>
    <h1>Sunny Acres</h1>
    <p class="sub">Grow it. Raise it. Sell it.</p>

    <label class="fld-label" for="ob-name">Your farmer's name</label>
    <input id="ob-name" class="fld" type="text" maxlength="14" placeholder="Farmer" autocomplete="off"
           autocapitalize="words" spellcheck="false">

    <label class="fld-label">Pick your look</label>
    <div class="avatar-grid" id="ob-avatars"></div>

    <button class="btn btn-big btn-green" id="ob-start">Start Farming</button>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="sheet-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
